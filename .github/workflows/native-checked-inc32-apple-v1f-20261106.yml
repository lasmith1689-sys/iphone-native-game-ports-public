path.stat().st_nlink==1 and path.stat().st_size<=4194304;data=path.read_bytes();assert pin(data)==meta['archive']['archive'];assert set(meta['archive']['symbols'])==set().union(*(set(REQUIRED[n])for n in PRODUCTION));collected['libpc64_checked_inc32_own.a']=data;passed=True\n else:assert p.returncode!=0 and result['SDKCompileProved']is False\n assert sum(map(len,collected.values()))<=16777216\n pending=root/'candidate-selected';pending.mkdir()\n for n,b in collected.items():path=pending/n;path.parent.mkdir(exist_ok=True);path.write_bytes(b)\n selected.rmdir();pending.rename(selected)\nexcept BaseException:\n # Timeout/unreaped/uncertain or untrusted output never carries a child prefix.\n # No process discovery/killall or descendant-quiescence claim is made.\n passed=False;retirementUncertain=retirementUncertain or not driverReaped and gate=='driver' or gate=='collect'\n selected.mkdir(exist_ok=True);assert not any(selected.iterdir())\n for n,obj in {'result.json':failure(),'source-identities.json':MANIFEST,'commands.json':[],'metadata.json':{},'frames.json':{}}.items():save(n,obj)\nprint(json.dumps(dict(status='passed'if passed else'failed',context=CONTEXT,driverReaped=driverReaped,toolDescendantDrainProved=False)))\nraise SystemExit(0 if passed else 1)\n"
