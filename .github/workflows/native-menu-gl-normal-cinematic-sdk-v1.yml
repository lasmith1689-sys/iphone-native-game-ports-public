name: Native menu normal and cinematic graphics SDK tests
'on':
  push:
    branches: [codex/native-menu-gl-normal-cinematic-sdk-v1-20261107]
permissions:
  contents: read
concurrency:
  group: native-menu-gl-normal-cinematic-sdk-v1
  cancel-in-progress: false
jobs:
  sdk:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.ref == 'refs/heads/codex/native-menu-gl-normal-cinematic-sdk-v1-20261107' && github.event_name == 'push'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 1
        submodules: false
        lfs: false
    - name: Verify fixed public support inputs
      shell: bash
      run: |
        python3 - <<'PY'
        import hashlib,pathlib
        pins = {'menu-gl-source.json': '9e3d7af35fe21ebdfcc43ba5f44b9c8cbc4358b010589d904590bcf4b28be122', 'menu-gl-source.zip': '5ccc7ecac2149063e728a9967b160b705a401cda93938a20adeec060b663aa48', 'sdk_build.py': 'cb348982e1abaa4f5df14e38ead12ef9812252349481533ae46d5735caa4383d'}
        for name, expected in pins.items():
            assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected, name
        PY
    - name: Compile the coherent support cohort and run synthetic boundary tests
      run: python3 -B sdk_build.py
    - name: Retain objects layout dumps and test receipts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-menu-gl-normal-cinematic-sdk-v1
        path: sdk-result
        if-no-files-found: error
        retention-days: 7
        compression-level: 6
