name: Encrypted V4 boot-trace unsigned iPhone app link
'on':
  push:
    branches:
    - claude/native-boot-trace-v4-link-v1-20261106
    paths:
    - .github/workflows/native-encrypted-boot-trace-v4-link-v1.yml
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Exact reviewed encrypted bundle ID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-boot-trace-v4-link-v1
  cancel-in-progress: false
jobs:
  app-sdk:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private == false && github.ref == 'refs/heads/claude/native-boot-trace-v4-link-v1-20261106' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
