        \ in (raw,b'_'+raw) and f['sourceBinding'] in ('translation-unit','source-line')\n     if f['line'] is not None:integer(f['line'],0,10000)\n    selected[unit]={**row,'object':obj}\n   except Exception as exc:rejected.append({'unit':unit,'reason':type(exc).__name__});gap=True;break\n  assert type(summary['completedUnits']) is list and summary['completedUnits']==[u for u in UNITS if u in meta.get('units',{})],'child prefix summary mismatch'\n  complete=status['status']=='passed' and status['SDKCompileLinkAuditPassed'] is True and summary['wholeSDKProofComplete'] is True\n  linked={}\n  if complete:\n   assert not rejected and list(selected)==list(UNITS) and [r['label'] for r in commands]==order\n   assert all(r['exitCode']==0 or (r['label']=='host-translated' and r['exitCode']==1) for r in commands) and not any(r['timedOut'] for r in commands)\n   assert status['failure'] is None;linked=metadata(meta['linked'],word,True)\n  else:assert status['status']=='failed' and status['SDKCompileLinkAuditPassed']\
