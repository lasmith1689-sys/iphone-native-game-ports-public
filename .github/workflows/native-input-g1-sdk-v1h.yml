        \ {**{n:(json.dumps(v,sort_keys=True)+'\\n').encode() for n,v in values.items()},'diagnostics.txt':'\\n'.join(diagnostics).encode()}\npayload=bundle()\nif max(map(len,payload.values()))>196608 or sum(map(len,payload.values()))>393216:\n passed=False;failure='selected-report-size-budget';status.update(status='failed',SDKCompileLinkAuditPassed=False,failure=failure,childReportsCollected=False,childFailure='');summary={'wholeSDKProofComplete':False,'completedUnits':[],'actualUIKitRuntime':False,'toolDescendantDrainProved':False};metadata={};commands=[];diagnostics=['Selected report budget failed; no child contents retained.'];payload=bundle()\nassert set(payload)==set(report_names) and max(map(len,payload.values()))<=196608 and sum(map(len,payload.values()))<=393216\nfor name,raw in payload.items():(reports/name).write_bytes(raw)\nassert {p.name for p in reports.iterdir()}==set(report_names)\nfor p in reports.iterdir():regular(p)\nprint(json.dumps(status));raise SystemExit(0 if passed\
        \ else 1)\nPY\n"
    - id: upload
      name: Upload only five bounded own reports
      if: always() && steps.guard.outcome == 'success' && steps.stage0.outcome == 'success' && steps.stage1.outcome == 'success' && steps.stage2.outcome == 'success' && steps.proof.outcome != 'skipped'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: own-input-g1-sdk-v1-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/native-input-g1-sdk-v1h/reports/status.json

          ${{ runner.temp }}/native-input-g1-sdk-v1h/reports/result-summary.json

          ${{ runner.temp }}/native-input-g1-sdk-v1h/reports/metadata-summary.json

          ${{ runner.temp }}/native-input-g1-sdk-v1h/reports/commands-summary.json

          ${{ runner.temp }}/native-input-g1-sdk-v1h/reports/diagnostics.txt'
        if-no-files-found: error
        retention-days: 1
        compression-level: 6
        include-hidden-files: false
        archive: true
    - id: final
      name: Require actual audit and selected report upload
      if: always()
      shell: bash
      run: 'set -euo pipefail

        test ''${{ steps.proof.outcome }}'' = ''success''

        test ''${{ steps.upload.outcome }}'' = ''success''

        '
