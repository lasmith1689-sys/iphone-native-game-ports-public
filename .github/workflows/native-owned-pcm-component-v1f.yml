name: Owned PCM offline component Mac and iPhone SDK proof
'on':
  push:
    branches:
    - codex/native-owned-pcm-component-v1f-20261029
    paths:
    - .github/workflows/native-owned-pcm-component-v1f.yml
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: generic-native-owned-pcm-component-v1f
  cancel-in-progress: false
jobs:
  owned-pcm-component:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-owned-pcm-component-v1f-20261029' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
    - name: Require exact public repository and branch
      id: guard
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json,os,re\nfrom pathlib import Path\nassert os.environ['GITHUB_REPOSITORY']=='lasmith1689-sys/iphone-native-game-ports-public'\nassert os.environ['GITHUB_REF']=='refs/heads/codex/native-owned-pcm-component-v1f-20261029'\nkind=os.environ['GITHUB_EVENT_NAME'];assert kind in ('push','workflow_dispatch')\nassert re.fullmatch('[a-f0-9]{40}',os.environ['GITHUB_SHA'])\nevent=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())\nassert event['repository']['full_name']=='lasmith1689-sys/iphone-native-game-ports-public' and event['repository']['private'] is False\nif kind=='push':\n assert event['ref']=='refs/heads/codex/native-owned-pcm-component-v1f-20261029' and event['after']==os.environ['GITHUB_SHA'] and event.get('deleted',False) is False\nelse:\n assert event.get('inputs') in (None,{})\nprint('Exact public owned-PCM offline proof context accepted.')\nPY\n"
    - name: Stage exact reviewed own sources inline
      id: stage
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,os,zlib\nfrom pathlib import Path\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'ngp-owned-pcm-public-v1f'\npayload={'ngp_audio_v1.h': '',\
        \ 'ngp_audio_internal_v1.h': '', 'ngp_audio_core_v1.c': '',\
        \ 'ngp_audio_backend_v1.m': ''}\n\
        identities={'ngp_audio_v1.h': {'bytes': 2446, 'sha256': 'cd691f643e3b6350014bd3617f4feb9924fdaae69ed03ea531293138cf2cbe73'}, 'ngp_audio_internal_v1.h': {'bytes': 1197, 'sha256': '156720236bf9316a12d6d71081b422dfd3cf8be6689c5dec0ac7919da17ec1fd'}, 'ngp_audio_core_v1.c': {'bytes': 9351, 'sha256': '8eb7e96d859cd9ded264c573ba0688b5eec57d2d48bdd6f3c7e2cfe8b4f9931e'}, 'ngp_audio_backend_v1.m': {'bytes': 11404, 'sha256': '8ecdafa0ae668800f2e25a0c645f43f84bc28f597c2789a92499dd90b45c7d6d'}}\nprior={}\nassert not base.exists();base.mkdir(mode=0o700)\nsource=base/'source';source.mkdir(mode=0o700)\nassert set(payload)==set(identities) and len(payload)==4\nfor name,wanted in prior.items():\n path=source/name;assert path.is_file() and not path.is_symlink()\n raw=path.read_bytes();assert len(raw)==wanted['bytes'] and hashlib.sha256(raw).hexdigest()==wanted['sha256']\nfor name,encoded in payload.items():\n assert '/' not in name and '\\\\' not in name and name not in ('.','..')\n path=source/name;assert\
        \ not path.exists()\n compressed=base64.b64decode(encoded,validate=True);decoder=zlib.decompressobj();raw=decoder.decompress(compressed,65537)\n assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail and len(raw)<=65536\n wanted=identities[name];assert len(raw)==wanted['bytes'] and hashlib.sha256(raw).hexdigest()==wanted['sha256']\n path.write_bytes(raw)\nall_identities={**prior,**identities}\nassert {p.name for p in source.iterdir()}==set(all_identities)\n(base/'source-manifest.json').write_text(json.dumps(all_identities,sort_keys=True)+'\\n')\nprint(json.dumps({'status':'exact-own-source-chunk-staged','chunkFiles':4,'totalFilesNow':len(all_identities)}))\nPY\n"
    - name: Stage second exact own source chunk
      id: stage2
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,os,zlib\nfrom pathlib import Path\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'ngp-owned-pcm-public-v1f'\npayload={'test_audio_apple_v1.m': '',\
        \ 'apple_metadata.py': '',\
        \ 'make_oracle.py': '', 'run_apple.py': ''}\n\
        identities={'test_audio_apple_v1.m': {'bytes': 8678, 'sha256': '521aa238710d827103d15496033071fcb4578eddc6d87f163af0e9d3fb296400'}, 'apple_metadata.py': {'bytes': 3382, 'sha256': '056cb25e32463c0e26a4ee5484eac6324570955521e34d65ee3e7b4cb1f9d203'}, 'make_oracle.py': {'bytes': 1078, 'sha256': '8e8a5661208957a766f2609a39378030dfc3762e64b8b865fc49700e6b644192'}, 'run_apple.py': {'bytes': 7615, 'sha256': '68280753ff84ec139a61eabb2554e2b2be30069f7ca6004c6c97ad862ee70fc8'}}\nprior={'ngp_audio_v1.h': {'bytes': 2446, 'sha256': 'cd691f643e3b6350014bd3617f4feb9924fdaae69ed03ea531293138cf2cbe73'}, 'ngp_audio_internal_v1.h': {'bytes': 1197, 'sha256': '156720236bf9316a12d6d71081b422dfd3cf8be6689c5dec0ac7919da17ec1fd'}, 'ngp_audio_core_v1.c': {'bytes': 9351, 'sha256': '8eb7e96d859cd9ded264c573ba0688b5eec57d2d48bdd6f3c7e2cfe8b4f9931e'}, 'ngp_audio_backend_v1.m': {'bytes': 11404, 'sha256': '8ecdafa0ae668800f2e25a0c645f43f84bc28f597c2789a92499dd90b45c7d6d'}}\nassert base.is_dir() and not base.is_symlink()\n\
        source=base/'source';assert source.is_dir() and not source.is_symlink()\nassert {p.name for p in source.iterdir()}==set(prior)\nassert set(payload)==set(identities) and len(payload)==4\nfor name,wanted in prior.items():\n path=source/name;assert path.is_file() and not path.is_symlink()\n raw=path.read_bytes();assert len(raw)==wanted['bytes'] and hashlib.sha256(raw).hexdigest()==wanted['sha256']\nfor name,encoded in payload.items():\n assert '/' not in name and '\\\\' not in name and name not in ('.','..')\n path=source/name;assert not path.exists()\n compressed=base64.b64decode(encoded,validate=True);decoder=zlib.decompressobj();raw=decoder.decompress(compressed,65537)\n assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail and len(raw)<=65536\n wanted=identities[name];assert len(raw)==wanted['bytes'] and hashlib.sha256(raw).hexdigest()==wanted['sha256']\n path.write_bytes(raw)\nall_identities={**prior,**identities}\nassert {p.name for p in source.iterdir()}==set(all_identities)\n\
        (base/'source-manifest.json').write_text(json.dumps(all_identities,sort_keys=True)+'\\n')\nprint(json.dumps({'status':'exact-own-source-chunk-staged','chunkFiles':4,'totalFilesNow':len(all_identities)}))\nPY\n"
    - name: Run exact own Mac and unsigned iPhone component proof
      id: proof
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport hashlib,json,os,signal,subprocess,sys\nfrom pathlib import Path\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'ngp-owned-pcm-public-v1f'\nsource=base/'source';output=base/'build';reports=base/'reports';reports.mkdir(mode=0o700)\nidentities={'ngp_audio_v1.h': {'bytes': 2446, 'sha256': 'cd691f643e3b6350014bd3617f4feb9924fdaae69ed03ea531293138cf2cbe73'}, 'ngp_audio_internal_v1.h': {'bytes': 1197, 'sha256': '156720236bf9316a12d6d71081b422dfd3cf8be6689c5dec0ac7919da17ec1fd'}, 'ngp_audio_core_v1.c': {'bytes': 9351, 'sha256': '8eb7e96d859cd9ded264c573ba0688b5eec57d2d48bdd6f3c7e2cfe8b4f9931e'}, 'ngp_audio_backend_v1.m': {'bytes': 11404, 'sha256': '8ecdafa0ae668800f2e25a0c645f43f84bc28f597c2789a92499dd90b45c7d6d'}, 'test_audio_apple_v1.m': {'bytes': 8678, 'sha256': '521aa238710d827103d15496033071fcb4578eddc6d87f163af0e9d3fb296400'}, 'apple_metadata.py': {'bytes': 3382, 'sha256': '056cb25e32463c0e26a4ee5484eac6324570955521e34d65ee3e7b4cb1f9d203'},\
        \ 'make_oracle.py': {'bytes': 1078, 'sha256': '8e8a5661208957a766f2609a39378030dfc3762e64b8b865fc49700e6b644192'}, 'run_apple.py': {'bytes': 7615, 'sha256': '68280753ff84ec139a61eabb2554e2b2be30069f7ca6004c6c97ad862ee70fc8'}}\nassert {p.name for p in source.iterdir()}==set(identities)\nfor name,wanted in identities.items():\n p=source/name;assert p.is_file() and not p.is_symlink()\n raw=p.read_bytes();assert len(raw)==wanted['bytes'] and hashlib.sha256(raw).hexdigest()==wanted['sha256']\nfor name in ('status.json', 'result-summary.json', 'commands-summary.json', 'metadata-summary.json', 'diagnostics.txt'):(reports/name).write_text('' if name.endswith('.txt') else '{}\\n')\nstatus={'status':'started','ownSourceFiles':8,'purpose':'ngp-owned-pcm-offline-v1f','contextId':'a9e70ea6-44fd-4dd5-980b-855d3bcb1294','recoveredEngineExecuted':False,'physicalIPhoneTest':False}\n(reports/'status.json').write_text(json.dumps(status,indent=2)+'\\n')\nclean={'PATH':'/usr/bin:/bin:/usr/sbin:/sbin','HOME':str(base),'TMPDIR':str(base)+'/',\
        \ 'LANG':'C','LC_ALL':'C','PYTHONDONTWRITEBYTECODE':'1'}\nexit_code=1;timed_out=False;failure=''\ntry:\n with (base/'driver.stdout').open('wb') as stdout,(base/'driver.stderr').open('wb') as stderr:\n  child=subprocess.Popen([sys.executable,'-B',str(source/'run_apple.py'),'--output',str(output)],env=clean,stdout=stdout,stderr=stderr,start_new_session=True)\n  try:exit_code=child.wait(timeout=900)\n  except subprocess.TimeoutExpired:\n   timed_out=True;failure='owned-proof-process-group-timeout';os.killpg(child.pid,signal.SIGTERM)\n   try:child.wait(timeout=3)\n   except subprocess.TimeoutExpired:os.killpg(child.pid,signal.SIGKILL);child.wait(timeout=3)\nexcept Exception as exc:failure=type(exc).__name__+': '+str(exc)[:512]\ndef completed_mac_observations(output,commands):\n \"\"\"Selected completed child receipts only. Never upgrades an overall proof result.\"\"\"\n observed={};rejected=[];by_label={r['label']:r['exitCode'] for r in commands}\n for label in ('mac-actual-1','mac-actual-2','mac-actual-timeouts','mac-actual-exceptions'):\n\
        \  path=output/(label+'.stdout')\n  if not path.exists():continue\n  try:\n   assert path.is_file() and not path.is_symlink() and path.stat().st_size<=16384\n   assert len(by_label)==len(commands) and type(by_label.get(label)) is int and by_label[label]==0\n   raw=path.read_bytes();row=json.loads(raw);assert isinstance(row,dict) and row.get('status')=='passed'\n   if label in ('mac-actual-1','mac-actual-2'):\n    channels=1 if label.endswith('-1') else 2\n    assert row['scope']=='actual-native-Mac-AVAudioEngine-offline' and row['channels']==channels\n    assert row['inputFrames']==1024 and row['renderedFrames']==8192 and type(row['measuredLeadingFrames']) is int and 0<=row['measuredLeadingFrames']<=4096\n    assert all(row[n] is True for n in ('allInputSamplesCompared','ownerReleaseObserved','actualQueuedCancellationObserved','deviceUnsupportedTokenZero')) and row['hardwarePlaybackClaimed'] is False\n    selected={n:row[n] for n in ('channels','inputFrames','renderedFrames','measuredLeadingFrames','allInputSamplesCompared','ownerReleaseObserved','actualQueuedCancellationObserved','deviceUnsupportedTokenZero','hardwarePlaybackClaimed')}\n\
        \   elif label=='mac-actual-timeouts':\n    assert row=={'status':'passed','actualFrameworkRequestsWithInjectedControlDelay':3,'borrowedInputAndOutputFreedAfterTimeout':True,'retainedBeforeLateClose':True};selected=dict(row)\n   else:\n    assert row=={'status':'passed','actualProducerExceptions':3,'initialFailureNoGraph':True,'lateOwnedWorkRetained':True,'exceptionEscapedC':False};selected=dict(row)\n   observed[label]={'selectedReceipt':selected,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'commandExitCode':0}\n  except (AssertionError,KeyError,ValueError,TypeError,OSError):rejected.append({'label':label,'reason':'receipt-not-admitted'})\n return {'observations':observed,'rejectedReceipts':rejected,'overallProofClaim':False}\n\ncompleted={'observations':{},'rejectedReceipts':[],'overallProofClaim':False}\ncommands=[];result={};frames={};completed=[]\ntry:\n commands=[]\n if (output/'commands.json').is_file():\n  path=output/'commands.json';assert not path.is_symlink()\
        \ and path.stat().st_size<=262144\n  raw=json.loads(path.read_bytes());assert isinstance(raw,list) and len(raw)<=64\n  for row in raw:\n   assert isinstance(row['label'],str) and len(row['label'])<=100 and isinstance(row['exitCode'],int)\n   commands.append({'label':row['label'],'exitCode':row['exitCode']})\n (reports/'commands-summary.json').write_text(json.dumps(commands,indent=2)+'\\n')\n completed=completed_mac_observations(output,commands)\n result={};frames={};result_path=output/'result.json'\n if exit_code==0 and not timed_out and not failure:\n  assert result_path.is_file() and not result_path.is_symlink() and result_path.stat().st_size<=262144\n  full=json.loads(result_path.read_bytes())\n  assert full['status']=='passed' and full['scope']=='owned-PCM-actual-native-Mac-offline-and-unsigned-iPhone-SDK'\n  assert full['sourceHashes']=={name:row['sha256'] for name,row in identities.items()}\n  assert full['physicalIPhoneExecuted'] is False and full['deviceReady'] is False and\
        \ full['legacyBound'] is False and full['keysUsed'] is False and full['SDKExported'] is False\n  assert {r['channels'] for r in full['actualMac']}=={1,2} and len(full['actualMac'])==2\n  actual=[]\n  for row in full['actualMac']:\n   assert row['status']=='passed' and row['scope']=='actual-native-Mac-AVAudioEngine-offline'\n   assert row['inputFrames']==1024 and row['renderedFrames']==8192 and 0<=row['measuredLeadingFrames']<=4096\n   assert all(row[n] is True for n in ('allInputSamplesCompared','ownerReleaseObserved','actualQueuedCancellationObserved','deviceUnsupportedTokenZero')) and row['hardwarePlaybackClaimed'] is False\n   actual.append({n:row[n] for n in ('channels','inputFrames','renderedFrames','measuredLeadingFrames','allInputSamplesCompared','ownerReleaseObserved','actualQueuedCancellationObserved','deviceUnsupportedTokenZero','hardwarePlaybackClaimed')})\n  assert full['actualFrameworkTimeouts']=={'status':'passed','actualFrameworkRequestsWithInjectedControlDelay':3,'borrowedInputAndOutputFreedAfterTimeout':True,'retainedBeforeLateClose':True}\n\
        \  assert full['actualProducerExceptions']=={'status':'passed','actualProducerExceptions':3,'initialFailureNoGraph':True,'lateOwnedWorkRetained':True,'exceptionEscapedC':False}\n  for label,platform,kind in [('mac',1,2),('ios',2,6)]:\n   meta=full['metadata'][label];assert meta['cpu']=='ARM64' and meta['platform']==platform and meta['kind']==kind\n   assert len(meta['strongFileBackedAPIs'])==7\n   frames[label]={n:meta[n] for n in ('cpu','kind','platform','buildVersion','dependencies','codeSignatures','strongFileBackedAPIs','unsignedIPhoneLibrary')}\n  assert frames['ios']['unsignedIPhoneLibrary'] is True and frames['ios']['codeSignatures']==0\n  result={'status':'actual-owned-PCM-offline-Mac-and-unsigned-iPhone-SDK-passed','actualMac':actual,'actualFrameworkTimeouts':full['actualFrameworkTimeouts'],'actualProducerExceptions':full['actualProducerExceptions'],'sourceHashes':full['sourceHashes'],'versions':full['versions'],'compilerSha256':full['compilerSha256'],'deviceReady':False,'legacyBound':False,'physicalIPhoneExecuted':False,'SDKExported':False}\n\
        \ else:result={'status':'proof-not-passed','recoveredEngineExecuted':False,'physicalIPhoneTest':False}\n result['completedMacObservations']=completed\n (reports/'result-summary.json').write_text(json.dumps(result,indent=2)+'\\n')\n (reports/'metadata-summary.json').write_text(json.dumps(frames,indent=2)+'\\n')\nexcept Exception as exc:\n failure='report-collection-'+type(exc).__name__+': '+str(exc)[:512];exit_code=1\n result={'status':'proof-not-passed','recoveredEngineExecuted':False,'physicalIPhoneTest':False,'completedMacObservations':completed}\n (reports/'commands-summary.json').write_text(json.dumps(commands,indent=2)+'\\n')\n (reports/'result-summary.json').write_text(json.dumps(result,indent=2)+'\\n')\n (reports/'metadata-summary.json').write_text(json.dumps(frames,indent=2)+'\\n')\ndiagnostics=[]\nselected=[base/'driver.stderr']+sorted(output.glob('*.stderr'))\nremaining=49152\nfor path in selected:\n if path.is_file() and not path.is_symlink() and path.stat().st_size:\n\
        \  count=min(4096,remaining,path.stat().st_size)\n  with path.open('rb') as handle:handle.seek(-count,2);raw=handle.read(count)\n  diagnostics.append('=== '+path.name+' (bounded tail) ===\\n'+raw.decode('utf-8',errors='replace'));remaining-=len(raw)\n  if remaining<=0:break\n(reports/'diagnostics.txt').write_text('\\n'.join(diagnostics))\nstatus.update(status='passed' if exit_code==0 and not timed_out and not failure else 'failed',recipeExitCode=exit_code,timedOut=timed_out,failure=failure,actualMacAndSDKProofPassed=exit_code==0 and not timed_out and not failure)\n(reports/'status.json').write_text(json.dumps(status,indent=2)+'\\n')\nassert {p.name for p in reports.iterdir()}==set(('status.json', 'result-summary.json', 'commands-summary.json', 'metadata-summary.json', 'diagnostics.txt'))\nassert all(p.is_file() and not p.is_symlink() and p.stat().st_size<=196608 for p in reports.iterdir())\nassert sum(p.stat().st_size for p in reports.iterdir())<=393216\nprint(json.dumps(status))\n\
        raise SystemExit(0 if status['status']=='passed' else 1)\nPY\n"
    - name: Upload only bounded selected reports
      id: upload
      if: always() && steps.guard.outcome == 'success' && steps.stage.outcome == 'success' && steps.stage2.outcome == 'success' && steps.proof.outcome != 'skipped'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: owned-pcm-component-v1f-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/ngp-owned-pcm-public-v1f/reports/status.json

          ${{ runner.temp }}/ngp-owned-pcm-public-v1f/reports/result-summary.json

          ${{ runner.temp }}/ngp-owned-pcm-public-v1f/reports/commands-summary.json

          ${{ runner.temp }}/ngp-owned-pcm-public-v1f/reports/metadata-summary.json

          ${{ runner.temp }}/ngp-owned-pcm-public-v1f/reports/diagnostics.txt'
        if-no-files-found: error
        retention-days: 1
        compression-level: 6
        include-hidden-files: false
        archive: true
    - name: Require actual proof and report upload success
      id: final
      if: always()
      shell: bash
      run: 'set -euo pipefail

        test ''${{ steps.proof.outcome }}'' = ''success''

        test ''${{ steps.upload.outcome }}'' = ''success''

        '
