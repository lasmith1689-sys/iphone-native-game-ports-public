name: Generic native stack component Mac and iPhone SDK proof
'on':
  push:
    branches:
    - codex/native-stack-component-v1-20261028
    paths:
    - .github/workflows/native-stack-component-v1.yml
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: generic-native-stack-component-v1
  cancel-in-progress: false
jobs:
  stack-component:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-stack-component-v1-20261028' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
    - name: Require exact public repository and branch
      id: guard
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json,os,re\nfrom pathlib import Path\nassert os.environ['GITHUB_REPOSITORY']=='lasmith1689-sys/iphone-native-game-ports-public'\nassert os.environ['GITHUB_REF']=='refs/heads/codex/native-stack-component-v1-20261028'\nkind=os.environ['GITHUB_EVENT_NAME'];assert kind in ('push','workflow_dispatch')\nassert re.fullmatch('[a-f0-9]{40}',os.environ['GITHUB_SHA'])\nevent=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())\nassert event['repository']['full_name']=='lasmith1689-sys/iphone-native-game-ports-public' and event['repository']['private'] is False\nif kind=='push':\n assert event['ref']=='refs/heads/codex/native-stack-component-v1-20261028' and event['after']==os.environ['GITHUB_SHA'] and event.get('deleted',False) is False\nelse:\n assert event.get('inputs') in (None,{})\nprint('Exact generic public stack-proof context accepted.')\nPY\n"
    - name: Stage exact reviewed own sources inline
      id: stage
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,os,zlib\nfrom pathlib import Path\npayload={'ngp_native_stack_v1.h': '',\
        \ 'ngp_native_stack_sp_v1.h': '', 'ngp_native_stack_v1.c': '',\
        \ 'ngp_native_stack_platform_v1.c': '',\
        \ 'test_stack_v1.c': '',\
        \ 'run_apple.py': ''}\n\
        identities={'ngp_native_stack_v1.h': {'bytes': 1968, 'sha256': '5f6484557ec01d79ed700fa8ebecfcfc2bd7ae5de52271717afce36db87776ad'}, 'ngp_native_stack_sp_v1.h': {'bytes': 529, 'sha256': 'e47630d1b2656c36be9ea085961fa2acbf749b134533f57e4a14363eaa5c04cf'}, 'ngp_native_stack_v1.c': {'bytes': 4334, 'sha256': '94865c8b35e4723baacba4094cda8f6236bdc2da87138058fe533d6144471529'}, 'ngp_native_stack_platform_v1.c': {'bytes': 5361, 'sha256': 'ab1b834f1ceac8b1dc8174e585b99977ed0a0086ef682c3e7f8a683eec0ff24b'}, 'test_stack_v1.c': {'bytes': 11376, 'sha256': '9faf4ad5f2b8e659488b8e8a1135728b0b71c5e182099be2ca5f4feb2d301b37'}, 'run_apple.py': {'bytes': 19847, 'sha256': '123f8aff95c9afe83447c838e39df2958f1998413c397d9071034009aa107882'}}\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'ngp-stack-public-v1'\nassert not base.exists();base.mkdir(mode=0o700)\nsource=base/'source';source.mkdir(mode=0o700)\nassert set(payload)==set(identities) and len(payload)==6\nfor name,encoded in payload.items():\n\
        \ assert '/' not in name and '\\\\' not in name and name not in ('.','..')\n compressed=base64.b64decode(encoded,validate=True)\n decoder=zlib.decompressobj();raw=decoder.decompress(compressed,65537)\n assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail and len(raw)<=65536\n expected=identities[name]\n assert len(raw)==expected['bytes'] and hashlib.sha256(raw).hexdigest()==expected['sha256']\n (source/name).write_bytes(raw)\nassert sum(v['bytes'] for v in identities.values())==43415\n(base/'source-manifest.json').write_text(json.dumps(identities,sort_keys=True)+'\\n')\nprint(json.dumps({'status':'exact-six-own-source-files-staged','files':6,'bytes':43415}))\nPY\n"
    - name: Run exact own Mac and unsigned iPhone component proof
      id: proof
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport hashlib,json,os,signal,subprocess,sys\nfrom pathlib import Path\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'ngp-stack-public-v1'\nsource=base/'source';output=base/'build';reports=base/'reports';reports.mkdir(mode=0o700)\nidentities={'ngp_native_stack_v1.h': {'bytes': 1968, 'sha256': '5f6484557ec01d79ed700fa8ebecfcfc2bd7ae5de52271717afce36db87776ad'}, 'ngp_native_stack_sp_v1.h': {'bytes': 529, 'sha256': 'e47630d1b2656c36be9ea085961fa2acbf749b134533f57e4a14363eaa5c04cf'}, 'ngp_native_stack_v1.c': {'bytes': 4334, 'sha256': '94865c8b35e4723baacba4094cda8f6236bdc2da87138058fe533d6144471529'}, 'ngp_native_stack_platform_v1.c': {'bytes': 5361, 'sha256': 'ab1b834f1ceac8b1dc8174e585b99977ed0a0086ef682c3e7f8a683eec0ff24b'}, 'test_stack_v1.c': {'bytes': 11376, 'sha256': '9faf4ad5f2b8e659488b8e8a1135728b0b71c5e182099be2ca5f4feb2d301b37'}, 'run_apple.py': {'bytes': 19847, 'sha256': '123f8aff95c9afe83447c838e39df2958f1998413c397d9071034009aa107882'}}\n\
        assert {p.name for p in source.iterdir()}==set(identities)\nfor name,wanted in identities.items():\n p=source/name;assert p.is_file() and not p.is_symlink()\n raw=p.read_bytes();assert len(raw)==wanted['bytes'] and hashlib.sha256(raw).hexdigest()==wanted['sha256']\nfor name in ('status.json', 'result-summary.json', 'commands-summary.json', 'frames-summary.json', 'diagnostics.txt'):(reports/name).write_text('' if name.endswith('.txt') else '{}\\n')\nstatus={'status':'started','ownSourceFiles':6,'recoveredEngineExecuted':False,'physicalIPhoneTest':False}\n(reports/'status.json').write_text(json.dumps(status,indent=2)+'\\n')\nclean={'PATH':'/usr/bin:/bin:/usr/sbin:/sbin','HOME':str(base),'TMPDIR':str(base)+'/', 'LANG':'C','LC_ALL':'C'}\nexit_code=1;timed_out=False;failure=''\ntry:\n with (base/'driver.stdout').open('wb') as stdout,(base/'driver.stderr').open('wb') as stderr:\n  child=subprocess.Popen([sys.executable,str(source/'run_apple.py'),'--output',str(output)],env=clean,stdout=stdout,stderr=stderr,start_new_session=True)\n\
        \  try:exit_code=child.wait(timeout=900)\n  except subprocess.TimeoutExpired:\n   timed_out=True;failure='owned-proof-process-group-timeout'\n   os.killpg(child.pid,signal.SIGTERM)\n   try:child.wait(timeout=3)\n   except subprocess.TimeoutExpired:os.killpg(child.pid,signal.SIGKILL);child.wait(timeout=3)\nexcept Exception as exc:failure=type(exc).__name__+': '+str(exc)[:512]\ncommands=[];result={};frames={}\ntry:\n commands=[]\n if (output/'commands.json').is_file():\n  raw=json.loads((output/'commands.json').read_bytes());assert isinstance(raw,list) and len(raw)<=100\n  for row in raw:\n   commands.append({k:row[k] for k in ('label','returncode','timeout','timeoutSeconds') if k in row})\n (reports/'commands-summary.json').write_text(json.dumps(commands,indent=2)+'\\n')\n result={};frames={};result_path=output/'result.json'\n if exit_code==0 and not timed_out and not failure:\n  assert result_path.is_file() and result_path.stat().st_size<=2*1024*1024\n  full=json.loads(result_path.read_bytes())\n\
        \  assert full['status']=='own-Mac-ARM64-runtime-and-unsigned-iPhone-SDK-component-compile-pass'\n  assert full['ownComponentOnly'] and full['recoveredEngineExecuted'] is False and full['physicalIPhoneTest'] is False\n  assert set(full['targets'])=={'mac','iphone'}\n  result={k:full[k] for k in ('status','ownComponentOnly','recoveredEngineExecuted','physicalIPhoneTest','opaqueOSFormalBound')}\n  for target,data in full['targets'].items():\n   frames[target]={'certificateSha256':data['certificateSha256'],'frames':data['identity']['frames'],'descriptors':data['descriptors'],'actualCodeAndFramesStableAfterMetadata':data['actualCodeAndFramesStableAfterMetadata'],\n    'compilerSha256':data['identity']['compilerSha256'],'compilerVersion':data['identity']['compilerVersion'],'sdk':data['identity']['sdk'],'sdkVersion':data['identity']['sdkVersion'],'target':data['identity']['target'],'flags':data['identity']['flags'],'linkFlags':data['identity']['linkFlags']}\n  result['mac']={label:{'runtime':full['targets']['mac'][label]['runtime'],'actualOwnedARM64ChildExecuted':full['targets']['mac'][label]['actualOwnedARM64ChildExecuted'],\n\
        \    'sha256':full['targets']['mac'][label]['metadata']['sha256'],'bytes':full['targets']['mac'][label]['metadata']['bytes'],\n    'wrappers':[{'wrapper':r['wrapper'],'body':r['body'],'guardBeforeBody':r['guardBeforeBody'],'expectedBypass':r['expectedBypass'],'actualSPCaptureInstructions':r['actualSPCaptureInstructions']} for r in full['targets']['mac'][label]['machine']['wrappers']]} for label in ('positive','negative')}\n  iphone=full['targets']['iphone'];library=iphone['library'];proof=iphone['iPhoneLinkedFixtureProof']\n  result['iphone']={'library':{k:library[k] for k in ('filetype','platform','dependencies','uuid','signatures','encryption64','imports','exports','sha256','bytes')},'proofLibrarySha256':proof['metadata']['sha256'],\n    'linkedGuardedWrappers':[{'wrapper':r['wrapper'],'body':r['body'],'guardBeforeBody':r['guardBeforeBody']} for r in proof['machine']['wrappers']],\n    'actualReadonlyDescriptorBytesMatch':proof['machine']['actualReadonlyDescriptorBytesMatch'],'iPhoneCodeExecuted':iphone['iPhoneCodeExecuted']}\n\
        \ else:result={'status':'proof-not-passed','recoveredEngineExecuted':False,'physicalIPhoneTest':False}\n (reports/'result-summary.json').write_text(json.dumps(result,indent=2)+'\\n')\n (reports/'frames-summary.json').write_text(json.dumps(frames,indent=2)+'\\n')\nexcept Exception as exc:\n failure='report-collection-'+type(exc).__name__+': '+str(exc)[:512];exit_code=1\n result={'status':'proof-not-passed','recoveredEngineExecuted':False,'physicalIPhoneTest':False}\n (reports/'commands-summary.json').write_text(json.dumps(commands,indent=2)+'\\n')\n (reports/'result-summary.json').write_text(json.dumps(result,indent=2)+'\\n')\n (reports/'frames-summary.json').write_text(json.dumps(frames,indent=2)+'\\n')\ndiagnostics=[]\nselected=[base/'driver.stderr']+sorted(output.glob('*.stderr'))+sorted(output.glob('mac-runtime-*.stdout'))\nremaining=49152\nfor path in selected:\n if path.is_file() and path.stat().st_size:\n  raw=path.read_bytes()[-min(4096,remaining):];text=raw.decode('utf-8',errors='replace')\n\
        \  diagnostics.append('=== '+path.name+' (bounded tail) ===\\n'+text);remaining-=len(raw)\n  if remaining<=0:break\n(reports/'diagnostics.txt').write_text('\\n'.join(diagnostics))\nstatus.update(status='passed' if exit_code==0 and not timed_out and not failure else 'failed',recipeExitCode=exit_code,timedOut=timed_out,failure=failure,actualMacAndSDKProofPassed=exit_code==0 and not timed_out and not failure)\n(reports/'status.json').write_text(json.dumps(status,indent=2)+'\\n')\nassert {p.name for p in reports.iterdir()}==set(('status.json', 'result-summary.json', 'commands-summary.json', 'frames-summary.json', 'diagnostics.txt'))\nassert all(p.is_file() and not p.is_symlink() and p.stat().st_size<=196608 for p in reports.iterdir())\nassert sum(p.stat().st_size for p in reports.iterdir())<=393216\nprint(json.dumps(status))\nraise SystemExit(0 if status['status']=='passed' else 1)\nPY\n"
    - name: Upload only bounded selected reports
      id: upload
      if: always() && steps.guard.outcome == 'success' && steps.stage.outcome == 'success' && steps.proof.outcome != 'skipped'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: generic-stack-component-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/ngp-stack-public-v1/reports/status.json

          ${{ runner.temp }}/ngp-stack-public-v1/reports/result-summary.json

          ${{ runner.temp }}/ngp-stack-public-v1/reports/commands-summary.json

          ${{ runner.temp }}/ngp-stack-public-v1/reports/frames-summary.json

          ${{ runner.temp }}/ngp-stack-public-v1/reports/diagnostics.txt'
        if-no-files-found: error
        retention-days: 1
        compression-level: 6
        include-hidden-files: false
        archive: true
    - name: Require actual proof and report upload success
      id: final
      if: always()
      shell: bash
      run: 'set -euo pipefail

        test ''${{ steps.proof.outcome }}'' = ''success''

        test ''${{ steps.upload.outcome }}'' = ''success''

        '
