name: Own MP3 zero-prefix Mac and iPhone SDK diagnostic
'on':
  push:
    branches:
    - codex/native-mp3-zero-prefix-sdk-v1-20261106
    paths:
    - .github/workflows/native-mp3-zero-prefix-probe-v1.yml
permissions:
  contents: read
concurrency:
  group: native-mp3-zero-prefix-probe-v1
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-mp3-zero-prefix-sdk-v1-20261106' && github.event_name == 'push'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 1
        submodules: false
        lfs: false
        sparse-checkout: native/platform/native-audio/mp3-zero-prefix-probe-v1
    - name: Verify exact own public source manifest
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_REPOSITORY\" = 'lasmith1689-sys/iphone-native-game-ports-public'\ntest \"$GITHUB_REF\" = 'refs/heads/codex/native-mp3-zero-prefix-sdk-v1-20261106'\ntest \"$GITHUB_EVENT_NAME\" = 'push'\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\npython3 - <<'PY'\nimport hashlib,json,pathlib\nh=pathlib.Path('native/platform/native-audio/mp3-zero-prefix-probe-v1')\nraw=(h/'source-manifest.json').read_bytes()\nassert hashlib.sha256(raw).hexdigest()=='824f660a7b5ff947710d832d7cd9ab17b5dab62d3c203552b22b980363eb1ed0'\nfor n,w in json.loads(raw)['files'].items():\n p=h/n;b=p.read_bytes();assert len(b)==w['bytes'] and hashlib.sha256(b).hexdigest()==w['sha256']\nprint('Exact own/synthetic support projection verified.')\nPY\n"
    - name: Run genuine Mac own fixtures and iPhone compile only
      shell: bash
      run: 'set -euo pipefail

        python3 -B native/platform/native-audio/mp3-zero-prefix-probe-v1/run_probe.py

        '
    - name: Retain own synthetic source and compiler diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: mp3-zero-prefix-probe-${{ github.run_id }}
        path: native/platform/native-audio/mp3-zero-prefix-probe-v1/probe-output/
        if-no-files-found: error
        retention-days: 7
        compression-level: 6
        include-hidden-files: false
        archive: true
