name: Generic native stack component Mac and iPhone SDK proof
'on':
  push:
    branches:
    - codex/native-stack-component-v1c-20261029
    paths:
    - .github/workflows/native-stack-component-v1c.yml
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: generic-native-stack-component-v1c
  cancel-in-progress: false
jobs:
  stack-component:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-stack-component-v1c-20261029' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
    - name: Require exact public repository and branch
      id: guard
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json,os,re\nfrom pathlib import Path\nassert os.environ['GITHUB_REPOSITORY']=='lasmith1689-sys/iphone-native-game-ports-public'\nassert os.environ['GITHUB_REF']=='refs/heads/codex/native-stack-component-v1c-20261029'\nkind=os.environ['GITHUB_EVENT_NAME'];assert kind in ('push','workflow_dispatch')\nassert re.fullmatch('[a-f0-9]{40}',os.environ['GITHUB_SHA'])\nevent=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())\nassert event['repository']['full_name']=='lasmith1689-sys/iphone-native-game-ports-public' and event['repository']['private'] is False\nif kind=='push':\n assert event['ref']=='refs/heads/codex/native-stack-component-v1c-20261029' and event['after']==os.environ['GITHUB_SHA'] and event.get('deleted',False) is False\nelse:\n assert event.get('inputs') in (None,{})\nprint('Exact generic public stack-proof context accepted.')\nPY\n"
    - name: Stage exact reviewed own sources inline
      id: stage
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,os,zlib\nfrom pathlib import Path\npayload=''\n\
        identities={'ngp_native_stack_v1.h': {'bytes': 1968, 'sha256': '5f6484557ec01d79ed700fa8ebecfcfc2bd7ae5de52271717afce36db87776ad'}, 'ngp_native_stack_sp_v1.h': {'bytes': 529, 'sha256': 'e47630d1b2656c36be9ea085961fa2acbf749b134533f57e4a14363eaa5c04cf'}, 'ngp_native_stack_v1.c': {'bytes': 4334, 'sha256': '94865c8b35e4723baacba4094cda8f6236bdc2da87138058fe533d6144471529'}, 'ngp_native_stack_platform_v1.c': {'bytes': 5931, 'sha256': 'f8ed39ea1f651a4b03738e8394f0e11f276524b4a9aa3ec114081b6c5f924940'}, 'test_stack_v1.c': {'bytes': 11376, 'sha256': '9faf4ad5f2b8e659488b8e8a1135728b0b71c5e182099be2ca5f4feb2d301b37'}, 'run_apple.py': {'bytes': 19874, 'sha256': '22e0173436639975526b03f6bccdfe1a6241ab0462c6e4632c07b4e7d28ff715'}}\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'ngp-stack-public-v1c'\nassert not base.exists();base.mkdir(mode=0o700)\nsource=base/'source';source.mkdir(mode=0o700)\ndecoder=zlib.decompressobj();packed=decoder.decompress(base64.b64decode(payload,validate=True),131073)\n\
        assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail and len(packed)<=131072\nmaterial=json.loads(packed)\nassert set(material)==set(identities) and len(material)==6\nfor name,text in material.items():\n assert '/' not in name and '\\\\' not in name and name not in ('.','..')\n assert isinstance(text,str);raw=text.encode('utf-8');assert len(raw)<=65536\n expected=identities[name]\n assert len(raw)==expected['bytes'] and hashlib.sha256(raw).hexdigest()==expected['sha256']\n (source/name).write_bytes(raw)\nassert sum(v['bytes'] for v in identities.values())==44012\n(base/'source-manifest.json').write_text(json.dumps(identities,sort_keys=True)+'\\n')\nprint(json.dumps({'status':'exact-six-own-source-files-staged','files':6,'bytes':44012}))\nPY\n"
    - name: Run exact own Mac and unsigned iPhone component proof
      id: proof
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport hashlib,json,os,signal,subprocess,sys\nfrom pathlib import Path\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'ngp-stack-public-v1c'\nsource=base/'source';output=base/'build';reports=base/'reports';reports.mkdir(mode=0o700)\nidentities={'ngp_native_stack_v1.h': {'bytes': 1968, 'sha256': '5f6484557ec01d79ed700fa8ebecfcfc2bd7ae5de52271717afce36db87776ad'}, 'ngp_native_stack_sp_v1.h': {'bytes': 529, 'sha256': 'e47630d1b2656c36be9ea085961fa2acbf749b134533f57e4a14363eaa5c04cf'}, 'ngp_native_stack_v1.c': {'bytes': 4334, 'sha256': '94865c8b35e4723baacba4094cda8f6236bdc2da87138058fe533d6144471529'}, 'ngp_native_stack_platform_v1.c': {'bytes': 5931, 'sha256': 'f8ed39ea1f651a4b03738e8394f0e11f276524b4a9aa3ec114081b6c5f924940'}, 'test_stack_v1.c': {'bytes': 11376, 'sha256': '9faf4ad5f2b8e659488b8e8a1135728b0b71c5e182099be2ca5f4feb2d301b37'}, 'run_apple.py': {'bytes': 19874, 'sha256': '22e0173436639975526b03f6bccdfe1a6241ab0462c6e4632c07b4e7d28ff715'}}\n\
        assert {p.name for p in source.iterdir()}==set(identities)\nfor name,wanted in identities.items():\n p=source/name;assert p.is_file() and not p.is_symlink()\n raw=p.read_bytes();assert len(raw)==wanted['bytes'] and hashlib.sha256(raw).hexdigest()==wanted['sha256']\nfor name in ('status.json', 'result-summary.json', 'commands-summary.json', 'frames-summary.json', 'diagnostics.txt'):(reports/name).write_text('' if name.endswith('.txt') else '{}\\n')\nstatus={'status':'started','ownSourceFiles':6,'recoveredEngineExecuted':False,'physicalIPhoneTest':False}\n(reports/'status.json').write_text(json.dumps(status,indent=2)+'\\n')\nclean={'PATH':'/usr/bin:/bin:/usr/sbin:/sbin','HOME':str(base),'TMPDIR':str(base)+'/', 'LANG':'C','LC_ALL':'C'}\nexit_code=1;timed_out=False;failure=''\ntry:\n with (base/'driver.stdout').open('wb') as stdout,(base/'driver.stderr').open('wb') as stderr:\n  child=subprocess.Popen([sys.executable,str(source/'run_apple.py'),'--output',str(output)],env=clean,stdout=stdout,stderr=stderr,start_new_session=True)\n\
        \  try:exit_code=child.wait(timeout=900)\n  except subprocess.TimeoutExpired:\n   timed_out=True;failure='owned-proof-process-group-timeout'\n   os.killpg(child.pid,signal.SIGTERM)\n   try:child.wait(timeout=3)\n   except subprocess.TimeoutExpired:os.killpg(child.pid,signal.SIGKILL);child.wait(timeout=3)\nexcept Exception as exc:failure=type(exc).__name__+': '+str(exc)[:512]\n\"\"\"Inline collector template. Variables are supplied by the proof wrapper.\n\nComplete per-target records survive a later target failure. No raw bytes or\nenvironment is exported. This module is parsed, not imported/executed locally.\n\"\"\"\ndef sanitize_target(target,data,record_sha):\n identity=data['identity']\n assert identity['target']==('arm64-apple-macos15.0' if target=='mac' else 'arm64-apple-ios26.0')\n assert data['actualCodeAndFramesStableAfterMetadata'] is True and len(data['descriptors'])==9\n frames={'targetResultSha256':record_sha,'certificateSha256':data['certificateSha256'],'frames':identity['frames'],'descriptors':data['descriptors'],\n\
        \  'actualCodeAndFramesStableAfterMetadata':True,'compilerSha256':identity['compilerSha256'],'compilerVersion':identity['compilerVersion'],\n  'sdk':identity['sdk'],'sdkVersion':identity['sdkVersion'],'target':identity['target'],'flags':identity['flags'],'linkFlags':identity['linkFlags']}\n if target=='mac':\n  output={}\n  for label in ('positive','negative'):\n   entry=data[label];runtime=entry['runtime'];assert entry['actualOwnedARM64ChildExecuted'] is True\n   assert runtime['platform']==2 and runtime['cases']>=(54 if label=='positive' else 45)\n   assert runtime['status']==('passed' if label=='positive' else 'failed')\n   assert runtime['failure']==('' if label=='positive' else 'large-body-must-be-denied')\n   assert runtime['recoveredEngineExecuted'] is False and runtime['policyReserveIsFormalOSBound'] is False\n   machine=entry['machine'];assert len(machine['wrappers'])==9 and machine['actualReadonlyDescriptorBytesMatch'] is True\n   output[label]={'runtime':runtime,'actualOwnedARM64ChildExecuted':True,'sha256':entry['metadata']['sha256'],'bytes':entry['metadata']['bytes'],\n\
        \    'actualReadonlyDescriptorBytesMatch':True,'wrappers':[{'wrapper':r['wrapper'],'body':r['body'],'guardBeforeBody':r['guardBeforeBody'],\n     'expectedBypass':r['expectedBypass'],'actualSPCaptureInstructions':r['actualSPCaptureInstructions']} for r in machine['wrappers']]}\n else:\n  library=data['library'];proof=data['iPhoneLinkedFixtureProof']\n  assert data['iPhoneCodeExecuted'] is False and proof['executed'] is False\n  assert proof['machine']['actualReadonlyDescriptorBytesMatch'] is True and len(proof['machine']['wrappers'])==9\n  output={'library':{k:library[k] for k in ('filetype','platform','dependencies','uuid','signatures','encryption64','imports','exports','sha256','bytes')},\n   'proofLibrarySha256':proof['metadata']['sha256'],'linkedGuardedWrappers':[{'wrapper':r['wrapper'],'body':r['body'],'guardBeforeBody':r['guardBeforeBody']} for r in proof['machine']['wrappers']],\n   'actualReadonlyDescriptorBytesMatch':True,'iPhoneCodeExecuted':False}\n output['targetComplete']=True;output['targetResultSha256']=record_sha\n\
        \ return output,frames\n\ncommands=[];result={'status':'proof-not-passed','recoveredEngineExecuted':False,'physicalIPhoneTest':False,'completeTargetRecords':[]};frames={};targets={}\ntry:\n if (output/'commands.json').is_file():\n  raw=json.loads((output/'commands.json').read_bytes());assert isinstance(raw,list) and len(raw)<=100\n  for row in raw:commands.append({k:row[k] for k in ('label','returncode','timeout','timeoutSeconds') if k in row})\n for target in ('mac','iphone'):\n  path=output/target/'target-result.json'\n  if path.is_file():\n   assert path.stat().st_size<=2*1024*1024\n   raw=path.read_bytes();data=json.loads(raw)\n   summary,frame_summary=sanitize_target(target,data,hashlib.sha256(raw).hexdigest())\n   targets[target]=data;result[target]=summary;frames[target]=frame_summary;result['completeTargetRecords'].append(target)\n if exit_code==0 and not timed_out and not failure:\n  path=output/'result.json';assert path.is_file() and path.stat().st_size<=2*1024*1024\n \
        \ full=json.loads(path.read_bytes());assert full['status']=='own-Mac-ARM64-runtime-and-unsigned-iPhone-SDK-component-compile-pass'\n  assert full['ownComponentOnly'] is True and full['recoveredEngineExecuted'] is False and full['physicalIPhoneTest'] is False\n  assert full['targets']==targets and set(targets)=={'mac','iphone'}\n  assert full['inputs']=={name:wanted['sha256'] for name,wanted in identities.items()}\n  result.update({k:full[k] for k in ('status','ownComponentOnly','recoveredEngineExecuted','physicalIPhoneTest','opaqueOSFormalBound')})\nexcept Exception as exc:\n failure='report-collection-'+type(exc).__name__+': '+str(exc)[:512];exit_code=1\n result['status']='proof-not-passed'\n(reports/'commands-summary.json').write_text(json.dumps(commands,indent=2)+'\\n')\n(reports/'result-summary.json').write_text(json.dumps(result,indent=2)+'\\n')\n(reports/'frames-summary.json').write_text(json.dumps(frames,indent=2)+'\\n')\n\ndiagnostics=[]\nselected=[base/'driver.stderr']+sorted(output.glob('*.stderr'))+sorted(output.glob('mac-runtime-*.stdout'))\n\
        remaining=49152\nfor path in selected:\n if path.is_file() and path.stat().st_size:\n  raw=path.read_bytes()[-min(4096,remaining):];text=raw.decode('utf-8',errors='replace')\n  diagnostics.append('=== '+path.name+' (bounded tail) ===\\n'+text);remaining-=len(raw)\n  if remaining<=0:break\n(reports/'diagnostics.txt').write_text('\\n'.join(diagnostics))\nstatus.update(status='passed' if exit_code==0 and not timed_out and not failure else 'failed',recipeExitCode=exit_code,timedOut=timed_out,failure=failure,actualMacAndSDKProofPassed=exit_code==0 and not timed_out and not failure)\n(reports/'status.json').write_text(json.dumps(status,indent=2)+'\\n')\nassert {p.name for p in reports.iterdir()}==set(('status.json', 'result-summary.json', 'commands-summary.json', 'frames-summary.json', 'diagnostics.txt'))\nassert all(p.is_file() and not p.is_symlink() and p.stat().st_size<=196608 for p in reports.iterdir())\nassert sum(p.stat().st_size for p in reports.iterdir())<=393216\nprint(json.dumps(status))\n\
        raise SystemExit(0 if status['status']=='passed' else 1)\nPY\n"
    - name: Upload only bounded selected reports
      id: upload
      if: always() && steps.guard.outcome == 'success' && steps.stage.outcome == 'success' && steps.proof.outcome != 'skipped'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: generic-stack-component-v1c-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/ngp-stack-public-v1c/reports/status.json

          ${{ runner.temp }}/ngp-stack-public-v1c/reports/result-summary.json

          ${{ runner.temp }}/ngp-stack-public-v1c/reports/commands-summary.json

          ${{ runner.temp }}/ngp-stack-public-v1c/reports/frames-summary.json

          ${{ runner.temp }}/ngp-stack-public-v1c/reports/diagnostics.txt'
        if-no-files-found: error
        retention-days: 1
        compression-level: 6
        include-hidden-files: false
        archive: true
    - name: Require actual proof and report upload success
      id: final
      if: always()
      shell: bash
      run: 'set -euo pipefail

        test ''${{ steps.proof.outcome }}'' = ''success''

        test ''${{ steps.upload.outcome }}'' = ''success''

        '
