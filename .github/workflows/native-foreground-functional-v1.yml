name: Native foreground actual UIKit and iPhone SDK fixture
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/native-foreground-functional-v1-20261028
    paths:
    - .github/workflows/native-foreground-functional-v1.yml
permissions:
  contents: read
concurrency:
  group: native-foreground-functional-v1
  cancel-in-progress: false
jobs:
  native-foreground-functional:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private
      == false && github.ref == 'refs/heads/codex/native-foreground-functional-v1-20261028' && (github.event_name
      == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
    - name: Require isolated own-source context and installed Simulator
      id: prepare
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport hashlib,json,os,pathlib,re,subprocess\nassert os.environ['GITHUB_REPOSITORY']=='lasmith1689-sys/iphone-native-game-ports-public'\n\
        assert os.environ['GITHUB_REF']=='refs/heads/codex/native-foreground-functional-v1-20261028'\nassert os.environ['GITHUB_EVENT_NAME']\
        \ in ('push','workflow_dispatch')\nassert re.fullmatch('[0-9a-f]{40}',os.environ['GITHUB_SHA'])\nevent=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())\n\
        assert event['repository']['private'] is False and event['repository']['full_name']=='lasmith1689-sys/iphone-native-game-ports-public'\n\
        if os.environ['GITHUB_EVENT_NAME']=='push':assert event['after']==os.environ['GITHUB_SHA'] and not event.get('deleted',False)\n\
        root=pathlib.Path('.work/native-foreground-functional-v1').absolute()\nassert not root.exists() and not\
        \ any(p.is_symlink() for p in (root,*root.parents));root.mkdir(parents=True)\ndef out(args):return subprocess.check_output(args,text=True,timeout=60).strip()\n\
        developer=pathlib.Path(out(['xcode-select','-p']));assert developer.is_absolute() and developer.is_dir()\n\
        sdk=pathlib.Path(out(['xcrun','--sdk','iphonesimulator','--show-sdk-path']))\nversion=out(['xcrun','--sdk','iphonesimulator','--show-sdk-version']);assert\
        \ int(version.split('.')[0])>=26\nassert sdk.is_dir() and sdk.resolve().is_relative_to(developer.resolve())\n\
        tools={n:out(['xcrun','--sdk','iphonesimulator','-f',n]) for n in ('clang','nm')}\nfor value in tools.values():\n\
        \    p=pathlib.Path(value);assert p.is_absolute() and p.is_file() and p.resolve().is_relative_to(developer.resolve())\n\
        inventory=json.loads(out(['xcrun','simctl','list','--json']))\n(root/'simulator-inventory.json').write_text(json.dumps(inventory,indent=2))\n\
        runtimes=[r for r in inventory.get('runtimes',[]) if r.get('isAvailable') is True and\n    r.get('identifier','').startswith('com.apple.CoreSimulator.SimRuntime.iOS-')\
        \ and int(r.get('version','0').split('.')[0])>=26]\nruntimes.sort(key=lambda r:tuple(int(v) for v in r['version'].split('.')),reverse=True)\n\
        chosen=None\nfor runtime in runtimes:\n    phones=[d for d in inventory.get('devices',{}).get(runtime['identifier'],[])\
        \ if d.get('isAvailable') is True and d.get('name','').startswith('iPhone')]\n    for phone in sorted(phones,key=lambda\
        \ d:d['name']):\n        kind=phone.get('deviceTypeIdentifier')\n        if not kind:\n            kinds=[d['identifier']\
        \ for d in inventory.get('devicetypes',[]) if d.get('name')==phone['name']]\n            if len(kinds)==1:kind=kinds[0]\n\
        \        if kind and kind.startswith('com.apple.CoreSimulator.SimDeviceType.iPhone-'):\n            chosen={'runtimeIdentifier':runtime['identifier'],'runtimeVersion':runtime['version'],\n\
        \                'runtimeBuild':runtime.get('buildversion'),'deviceTypeIdentifier':kind,\n             \
        \   'compatibilityBasis':'Already configured available iPhone in this installed runtime','existingDeviceName':phone['name']};break\n\
        \    if chosen:break\nassert chosen is not None,'No already-installed compatible iOS26+ iPhone Simulator;\
        \ no platform downloaded'\nmanifest={'native/aot/platform_init/v1/platform_init_v1.h': {'bytes': 3438, 'sha256':\
        \ 'f8cd0b0386afe74254594259855381ce537a8e18a1f9b9ab0017029b518b60ae'}, 'native/platform/cod-gl-ios/input-v1/cod_input_queue_v1.h':\
        \ {'bytes': 1938, 'sha256': '29547c1f4172dd105ab211192a86a0845c97328a9cc9c162434175749580c5fd'}, 'native/platform/cod-gl-ios/input-v2/cod_input_queue_v2.h':\
        \ {'bytes': 898, 'sha256': '5db009917ace7802c60294a418d4e39c36bcbbf594cbf637986125d7df61b88b'}, 'native/platform/cod-gl-ios/input-v2/cod_input_queue_v2.c':\
        \ {'bytes': 3950, 'sha256': 'efd787570343be9ad7c37844e2697c5abee53afe5011ba85776b03b4731c6256'}, 'native/platform/cod-gl-ios/input-v2/cod_uikit_input_v2.h':\
        \ {'bytes': 2038, 'sha256': '6bed768ba33da8dcf73c387df4652153aa5c6984945865b533312bcb7916564c'}, 'native/platform/cod-gl-ios/input-v2/cod_uikit_input_v2.m':\
        \ {'bytes': 8484, 'sha256': 'c25edb34171cba936bed2855c342f784c2d65d2891ec332f8c90ca73f22368b4'}, 'native/aot/module_bootstrap/v2/loading_v11/cod_loading_v11.h':\
        \ {'bytes': 2953, 'sha256': 'cdf2edb477dab3d5b8c354f6dc98a9592d69314708e080a4c2a9e9e4bab56200'}, 'native/aot/module_bootstrap/v2/loading_v11/cod_loading_v11.c':\
        \ {'bytes': 4673, 'sha256': '9fbc0f34ba4980ab9849f1dc12b24bbfe13da06fb7b293544e0fff9ac918f170'}, 'native/platform/foreground-checkpoint-v1/ngp_foreground_state_v1.h':\
        \ {'bytes': 2169, 'sha256': '1257b5f177ce22244c77a84ca789363fea78b97493fc4621a21fcb49c4aa9757'}, 'native/platform/foreground-checkpoint-v1/ngp_foreground_state_v1.c':\
        \ {'bytes': 3088, 'sha256': '9f46ae11997d3734bdb4703f8b8acf65fb8e307a87571bdc49cb4f1d268cb696'}, 'native/platform/foreground-checkpoint-v1/ngp_foreground_uikit_v1.h':\
        \ {'bytes': 2062, 'sha256': '27325641b3f11874d3ecbd172cf939e96ada16a75b5c2904f78dc8fcbbda38e7'}, 'native/platform/foreground-checkpoint-v1/ngp_foreground_uikit_v1.m':\
        \ {'bytes': 7757, 'sha256': 'b5f32be9484428dbc8ebcd9e03b2c417dccc996a02e3c52f22094f1beb7ee4ee'}, 'foreground_app.m':\
        \ {'bytes': 22015, 'sha256': '9c12f1cdcd0085abbd22fd2dd92555b3c3f7357db21aa740d6a831565323a71f'}, 'build_probe.py':\
        \ {'bytes': 10612, 'sha256': 'ab04b141223e7f7c4ebaf8a2a507496fc674379fcc73dd415a1993760fe37c85'}, 'run_probe.py':\
        \ {'bytes': 7790, 'sha256': 'f451c82cd3136b4ea6aa46f01edee67401037d22ed3604b074862dc28486541f'}, 'check_report.py':\
        \ {'bytes': 3871, 'sha256': '4516224da190183583754b5a4702d8fe6eb46ad2dd57d33856e69d5354d2b26f'}, 'report_transport.py':\
        \ {'bytes': 3526, 'sha256': '2db4cd066b30dd0c47753680741a60a230b5ecaab8f563767dbadb29af129d0e'}, 'check_signature.py':\
        \ {'bytes': 3096, 'sha256': '30ca89933fe09783bc0f5edbe1160fa8177d4a1c2799432b11456685563c7a1a'}, 'macho_metadata.py':\
        \ {'bytes': 5206, 'sha256': '0cf4845fb3e9a12bae2e934bdb6bae5bd1f34a26bfcd586f661c112d1905f616'}};revision='b238c6b1775de1f9d7261ff8faf60f1a94770569d077fd1191c56b28661fe780'\n\
        assert hashlib.sha256(json.dumps(manifest,sort_keys=True,separators=(',',':')).encode()).hexdigest()==revision\n\
        plan={'developer':str(developer),'sdk':str(sdk),'sdkVersion':version,'tools':tools,'simulatorSelection':chosen,\n\
        \    'xcodeVersion':out(['xcodebuild','-version']),'clangVersion':out([tools['clang'],'--version']),\n \
        \   'sourceManifest':manifest,'revision':revision,'gameInputsIncluded':False,'syntheticConsumerOnly':True,'actualUIKitForegroundProvider':True}\n\
        (root/'plan.json').write_text(json.dumps(plan,indent=2));print(json.dumps(plan,indent=2))\n\nPY\n"
    - name: Stage own bounded source fragment 1
