      name: Stage reviewed own-source chunk 1
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,os,zlib\nfrom pathlib import Path\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'ngp-native-device-pcm-sdk-symbol-v1c'\nassert not base.exists();base.mkdir(mode=0o700);(base/'source').mkdir(mode=0o700)\npayload={'ngp_audio_v2.h': '',\
        \ 'ngp_audio_device_internal_v2.h': '',\
        \ 'ngp_audio_device_core_v2.c': ''}\n\
        identities={'ngp_audio_v2.h': {'bytes': 2932, 'sha256': 'fe53418d24f3b6b6daef10dfe1afd0db3aea111b82467e755ba2bdbfe828ba33'}, 'ngp_audio_device_internal_v2.h': {'bytes': 3963, 'sha256': '4a6639305c53d083a1bc2fb73ab7077e077245acf7e711c549b54f9aac8e84a8'}, 'ngp_audio_device_core_v2.c': {'bytes': 18809, 'sha256': 'b9bfe542b6c80773daa7bcbbe6ea9aa3e9b870a164c6f3dbfa56584ee57aa4e2'}}\nfor name,text in payload.items():\n assert '/' not in name and '\\\\' not in name and name not in ('.','..')\n decoder=zlib.decompressobj();data=decoder.decompress(base64.b64decode(text,validate=True),65537)\n assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail and len(data)<=65536\n expected=identities[name];assert len(data)==expected['bytes'] and hashlib.sha256(data).hexdigest()==expected['sha256']\n path=base/'source'/name;assert not path.exists();path.write_bytes(data)\nprint('Exact own-source chunk 1/3 staged.')\nPY\n"
