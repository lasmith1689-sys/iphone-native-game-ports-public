name: Own device PCM linked-private-data symbol policy SDK audit
'on':
  push:
    branches:
    - codex/native-device-pcm-sdk-v1c-symbol-policy-20261030
    paths:
    - .github/workflows/native-device-pcm-sdk-v1c-symbol-policy.yml
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: own-device-pcm-sdk-symbol-v1c
  cancel-in-progress: false
jobs:
  device-sdk:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-device-pcm-sdk-v1c-symbol-policy-20261030' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
    - id: guard
      name: Require exact dedicated public context
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import json,os,re

        from pathlib import Path

        assert os.environ[''GITHUB_REPOSITORY'']==''lasmith1689-sys/iphone-native-game-ports-public'' and os.environ[''GITHUB_REF'']==''refs/heads/codex/native-device-pcm-sdk-v1c-symbol-policy-20261030''

        kind=os.environ[''GITHUB_EVENT_NAME''];assert kind in (''push'',''workflow_dispatch'')

        assert re.fullmatch(''[a-f0-9]{40}'',os.environ[''GITHUB_SHA''])

        event=json.loads(Path(os.environ[''GITHUB_EVENT_PATH'']).read_bytes())

        assert event[''repository''][''full_name'']==''lasmith1689-sys/iphone-native-game-ports-public'' and event[''repository''][''private''] is False

        if kind==''push'':assert event[''ref'']==''refs/heads/codex/native-device-pcm-sdk-v1c-symbol-policy-20261030'' and event[''after'']==os.environ[''GITHUB_SHA''] and event.get(''deleted'',False) is False

        else:assert event.get(''inputs'') in (None,{})

        print(''Exact own-device-SDK public context accepted.'')

        PY

        '
