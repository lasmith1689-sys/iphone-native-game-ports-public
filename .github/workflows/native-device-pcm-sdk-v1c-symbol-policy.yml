        \ in row})\n partial=None\n if (output/'partial-result.json').exists():\n  partial=document(output/'partial-result.json');assert partial['wholeSDKProofComplete'] is False\n  summary,metadata=collect_document(partial,identities,commands,True)\n  if summary['rejectedUnits']:failure='invalid-partial-unit-receipt';exit_code=1\n if exit_code==0 and not timed_out and not failure:\n  full=document(output/'result.json');assert partial is not None and full['units']==partial['units']\n  summary,metadata=collect_document(full,identities,commands,False)\n exact_sources()\nexcept Exception as exc:failure='report-collection-'+type(exc).__name__+': '+str(exc)[:512];exit_code=1\npassed=exit_code==0 and not timed_out and not failure\nif not passed:summary['status']='proof-not-passed';summary['wholeSDKProofComplete']=False\ndiagnostics=[];remaining=49152\nfor path in [base/'driver.stderr']+sorted(output.glob('*.stderr')):\n if path.is_file() and not path.is_symlink() and path.stat().st_size:\n  count=min(4096,remaining,path.stat().st_size)\n\
        \  with path.open('rb') as handle:handle.seek(-count,2);raw=handle.read(count)\n  diagnostics.append('=== '+path.name+' (bounded tail) ===\\n'+raw.decode('utf-8',errors='replace'));remaining-=len(raw)\n  if remaining<=0:break\nstatus.update(status='passed' if passed else 'failed',recipeExitCode=exit_code,timedOut=timed_out,failure=failure,SDKCompileAuditPassed=passed)\ndef bundle():\n values={'status.json':status,'result-summary.json':summary,'metadata-summary.json':metadata,'commands-summary.json':commands}\n payload={name:(json.dumps(value,indent=2)+'\\n').encode() for name,value in values.items()};payload['diagnostics.txt']='\\n'.join(diagnostics).encode();return payload\npayload=bundle()\nif any(len(raw)>196608 for raw in payload.values()) or sum(map(len,payload.values()))>393216:\n passed=False;exit_code=1;failure='selected-report-size-budget';status.update(status='failed',recipeExitCode=1,failure=failure,SDKCompileAuditPassed=False)\n summary={'status':'proof-not-passed','wholeSDKProofComplete':False,'completedUnits':[],'completedUnitsDroppedByBudget':len(summary.get('completedUnits',[])),'actualIPhoneRuntime':False};metadata={};commands=commands[:64];diagnostics=['Selected\
