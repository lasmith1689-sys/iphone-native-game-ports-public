    - id: upload
      name: Upload only five bounded selected reports
      if: always() && steps.guard.outcome == 'success' && steps.stage0.outcome == 'success' && steps.stage1.outcome == 'success' && steps.stage2.outcome == 'success' && steps.proof.outcome != 'skipped'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: own-device-pcm-sdk-symbol-v1c-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/ngp-native-device-pcm-sdk-symbol-v1c/reports/status.json

          ${{ runner.temp }}/ngp-native-device-pcm-sdk-symbol-v1c/reports/result-summary.json

          ${{ runner.temp }}/ngp-native-device-pcm-sdk-symbol-v1c/reports/metadata-summary.json

          ${{ runner.temp }}/ngp-native-device-pcm-sdk-symbol-v1c/reports/commands-summary.json

          ${{ runner.temp }}/ngp-native-device-pcm-sdk-symbol-v1c/reports/diagnostics.txt'
        if-no-files-found: error
        retention-days: 1
        compression-level: 6
        include-hidden-files: false
        archive: true
    - id: final
      name: Require SDK audit and selected report upload success
      if: always()
      shell: bash
      run: 'set -euo pipefail

        test ''${{ steps.proof.outcome }}'' = ''success''

        test ''${{ steps.upload.outcome }}'' = ''success''

        '
