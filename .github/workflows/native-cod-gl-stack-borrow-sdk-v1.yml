    - name: Retain bounded public support raw diagnostics
      id: capture
      shell: bash
      if: always()
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),4226)\nassert len(raw)==4225\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='bbd0b3fc5192fe1836e8c4b9ac34d045070d740b79c5a0df2ea3a3c0cacfa3aa'\n\
        try:exec(compile(raw,'<owned-gl-composition-v1-capture>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-stack-borrow-v1').absolute()\n\
