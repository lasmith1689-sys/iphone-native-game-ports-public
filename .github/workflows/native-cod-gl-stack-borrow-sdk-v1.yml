      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),58404)\nassert len(raw)==58403\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='59745ac91a5b2d5201699a8cf78c7fed26eafd4f046b429aae8d4fd6895d6766'\n\
        try:exec(compile(raw,'<owned-gl-composition-v1-inspect>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-stack-borrow-v1').absolute()\n\
        \ if root.is_dir() and not root.is_symlink():\n  output=root/'runner-program-inspect.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
