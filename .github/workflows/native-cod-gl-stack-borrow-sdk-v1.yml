name: Own GL stack and uncertain borrow SDK syntax/link diagnostic
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/native-cod-gl-stack-borrow-sdk-v1-20261104
    paths:
    - .github/workflows/native-cod-gl-stack-borrow-sdk-v1.yml
permissions:
  contents: read
concurrency:
  group: native-cod-gl-stack-borrow-sdk-v1
  cancel-in-progress: false
jobs:
  cod-gl-stack-borrow-v1:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private
      == false && github.ref == 'refs/heads/codex/native-cod-gl-stack-borrow-sdk-v1-20261104'
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
    - name: Pin matching public GL4ES and in-place Apple SDK
      id: prepare
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),21179)\nassert len(raw)==21178\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='6bd030f8fc66db791c6d1d001b3c7680538ae1d43fbd59bef42fe24df404f236'\n\
        try:exec(compile(raw,'<owned-gl-composition-v1-prepare>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-stack-borrow-v1').absolute()\n\
        \ if root.is_dir() and not root.is_symlink():\n  output=root/'runner-program-prepare.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
        PY\n"
    - name: Materialize version4 header_sources
      id: header_sources
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),8509)\nassert len(raw)==8508\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='5335ed3cd1822c6fd1afb113010d92b11674a8bde53cbedd7994659183cd6167'\n\
        try:exec(compile(raw,'<owned-gl-composition-v1-header_sources>','exec'),{'__name__':'__main__'})\nfinally:\n\
        \ root=pathlib.Path('.work/cod-gl-stack-borrow-v1').absolute()\n if root.is_dir() and not root.is_symlink():\n\
        \  output=root/'runner-program-header_sources.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
        PY\n"
    - name: Materialize version4 dispatch_source
      id: dispatch_source
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),10537)\nassert len(raw)==10536\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='818634b3d031bad26da9aab243dcd82d23be25ec598b4ec77a60f871ecac5b25'\n\
