name: Own single-owner native join Mac ARM64 and unsigned iPhone SDK proof
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/native-join-sdk-v1-20261028
    paths:
    - .github/workflows/native-join-sdk-v1.yml
permissions:
  contents: read
concurrency:
  group: native-join-sdk-v1
  cancel-in-progress: false
jobs:
  native-os:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-join-sdk-v1-20261028' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
    - name: Require isolated public generic-source context
      id: prepare
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json,os,pathlib,re\nassert os.environ['GITHUB_REPOSITORY']=='lasmith1689-sys/iphone-native-game-ports-public' and os.environ['GITHUB_REF']=='refs/heads/codex/native-join-sdk-v1-20261028'\nassert os.environ['GITHUB_EVENT_NAME'] in ('push','workflow_dispatch')\nassert re.fullmatch('[0-9a-f]{40}',os.environ['GITHUB_SHA'])\nevent=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())\nassert event['repository']['private'] is False and event['repository']['full_name']=='lasmith1689-sys/iphone-native-game-ports-public'\nif os.environ['GITHUB_EVENT_NAME']=='push':\n assert event['after']==os.environ['GITHUB_SHA'] and event.get('deleted',False) is False\nroot=pathlib.Path('.work/native-join-sdk-v1').absolute()\nassert not root.exists() and not any(p.is_symlink() for p in (root,*root.parents))\n(root/'chunks').mkdir(parents=True)\nprint('Own generic host/heap/key/join source and synthetic fixtures only; no recovered engine input\
        \ or SDK export.')\n\nPY\n"
    - name: Stage own generic source fragment 1
      id: stage0
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        p=pathlib.Path(''.work/native-join-sdk-v1/chunks/0000.b64'')

        assert p.parent.is_dir() and not p.exists()

        p.write_text('''')

        PY

        '
    - name: Stage own generic source fragment 2
      id: stage1
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        p=pathlib.Path(''.work/native-join-sdk-v1/chunks/0001.b64'')

        assert p.parent.is_dir() and not p.exists()

        p.write_text('''')

        PY

        '
    - name: Stage own generic source fragment 3
      id: stage2
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        p=pathlib.Path(''.work/native-join-sdk-v1/chunks/0002.b64'')

        assert p.parent.is_dir() and not p.exists()

        p.write_text('''')

        PY

        '
    - name: Stage own generic source fragment 4
      id: stage3
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        p=pathlib.Path(''.work/native-join-sdk-v1/chunks/0003.b64'')

        assert p.parent.is_dir() and not p.exists()

        p.write_text('''')

        PY

        '
    - name: Authenticate exact complete generic source closure
      id: assemble
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,pathlib,zlib\nroot=pathlib.Path('.work/native-join-sdk-v1').absolute();source=root/'source'\nassert root.is_dir() and not source.exists() and not root.is_symlink()\nparts=sorted((root/'chunks').glob('*.b64'));assert [p.name for p in parts]==['0000.b64', '0001.b64', '0002.b64', '0003.b64']\npacked=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)\nassert len(packed)==28625 and hashlib.sha256(packed).hexdigest()=='a8aac220bd5958230446e8d50f5c8452d48f55956ddc34166bc7b89706adceae'\nd=zlib.decompressobj();data=d.decompress(packed,87506)\nassert len(data)==87505 and d.eof and not d.unused_data and not d.unconsumed_tail\nrows=json.loads(data);manifest={'host64_owned.c': {'bytes': 8141, 'sha256': '485e07231e7d7a3e2455f41d473fd6c9e6d77ba372e0cc811188a947c70252fa'}, 'host64_owned.h': {'bytes': 3399, 'sha256': '8c5f217b836c622109c3cd459ee0e2846f0a284254e6a5522e08b3c520340695'}, 'native_heap.c': {'bytes':\
        \ 3077, 'sha256': '021dacf07e245e80884f23b95506c647e5797e2cd8f3f0b44d086e57e96aee35'}, 'native_heap.h': {'bytes': 2123, 'sha256': '44e0993477e7f35a38c377bbda2b4069f3ac995663d0f29c6c6702ce6e5d836b'}, 'native_key.c': {'bytes': 12863, 'sha256': '86afac3360fcfd09dacb95482ee19d7c80bda21257fd7d634cb84bdec62e610a'}, 'native_key.h': {'bytes': 4131, 'sha256': '53227988766806c096444f5427d78d22c505ec108cf9ef6e315efebad169d515'}, 'native_join.c': {'bytes': 9727, 'sha256': 'cda7e4e8c249d5b66c593ebfa35f4d69da04ba1e49978d88f18043873c795d20'}, 'native_join.h': {'bytes': 2897, 'sha256': '51ce560f9b42d22e2f081d41f945b4c16c3ed61b07c901c4684779a755271fc5'}, 'metadata.py': {'bytes': 2713, 'sha256': 'da4f0b6284f4f2d53dbfd17dc8045d7ac56105e9aa5029a49237d1b6a853936b'}, 'probe_join.c': {'bytes': 10339, 'sha256': '4102795f5f5004da1d05db6aa6c422bc53803475b88266af1c6b1c371d3dec85'}, 'run_sdk.py': {'bytes': 6037, 'sha256': '71f2565aa0b5abd1804f45a56c3772f51015ce9d49639dbbd850e7e4a9faf068'}};assert set(rows)==set(manifest)\n\
        decoded={}\nfor name,row in manifest.items():\n assert name==pathlib.PurePosixPath(name).name and '/' not in name and chr(92) not in name\n b=base64.b64decode(rows[name],validate=True);assert len(b)==row['bytes'] and hashlib.sha256(b).hexdigest()==row['sha256']\n decoded[name]=b\nsource.mkdir()\nfor name,b in decoded.items():(source/name).write_bytes(b)\n(root/'source-closure.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+chr(10))\nprint(json.dumps({'sourceFiles':len(manifest),'sourceHashes':{n:r['sha256'] for n,r in manifest.items()},'gameInputsIncluded':False}))\n\nPY\n"
    - name: Actual native Mac ARM64 tests and unsigned iPhone SDK library
      id: build
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib,subprocess,sys

        root=pathlib.Path(''.work/native-join-sdk-v1'').absolute()

        p=subprocess.run([sys.executable,str(root/''source/run_sdk.py'')],cwd=root,timeout=540)

        assert p.returncode==0,''Actual SDK and native fixture gates must pass''

        PY

        '
    - name: Require actual outcomes and unchanged source hashes
      id: final
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import hashlib,json,pathlib

        root=pathlib.Path(''.work/native-join-sdk-v1'').absolute();manifest=json.loads((root/''source-closure.json'').read_text())

        for name,row in manifest.items():assert hashlib.sha256((root/''source''/name).read_bytes()).hexdigest()==row[''sha256'']

        result=json.loads((root/''output/result.json'').read_text());assert result[''status'']==''passed''

        assert result[''sourceHashes'']=={n:v[''sha256''] for n,v in manifest.items()}

        assert result[''actualAppleSDKUsed''] and result[''productionGenericDarwinBackendCompiled'']

        assert result[''actualMacIsolatedCases'']==7 and result[''exactProductionCUnits'']==4 and result[''fixtureExcludedFromIPhoneLibrary'']

        assert len(result[''iosExports''])==38 and result[''strictKeyDeleteBeforeHeapRelease''] and result[''actualSameJoinReentryRejectedCalls'']==5

        assert result[''beforeAndAfterCommitRetentionDistinguished''] and result[''actualCheckedReadWriteCopyAtomicDenied''] and not result[''OSPageProtectionClaimed'']

        assert result[''sourceFLSOrLocaleDestructorAdmitted''] is False and result[''nativePointerKeyOrThreadIdentityValuesPrinted''] is False

        for name in (''gameInputsIncluded'',''gameExecuted'',''physicalIPhoneExecuted'',''developerIdentityUsed'',''SDKExported'',''artifactsUploaded''):assert result[name] is False

        print(json.dumps({''status'':''passed'',''iosLibrarySha256'':result[''iosLibrarySha256''],''actualNativeMacARM64'':result[''actualNativeMacARM64''],''gameReady'':False}))


        PY

        '
