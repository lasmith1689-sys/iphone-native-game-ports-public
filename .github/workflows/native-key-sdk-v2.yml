name: Generic native key Mac ARM64 and unsigned iPhone SDK proof
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/native-key-sdk-v2-20261028
    paths:
    - .github/workflows/native-key-sdk-v2.yml
permissions:
  contents: read
concurrency:
  group: native-key-sdk-v2
  cancel-in-progress: false
jobs:
  native-os:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-key-sdk-v2-20261028' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
    - name: Require isolated public generic-source context
      id: prepare
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json,os,pathlib,re\nassert os.environ['GITHUB_REPOSITORY']=='lasmith1689-sys/iphone-native-game-ports-public' and os.environ['GITHUB_REF']=='refs/heads/codex/native-key-sdk-v2-20261028'\nassert os.environ['GITHUB_EVENT_NAME'] in ('push','workflow_dispatch')\nassert re.fullmatch('[0-9a-f]{40}',os.environ['GITHUB_SHA'])\nevent=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())\nassert event['repository']['private'] is False and event['repository']['full_name']=='lasmith1689-sys/iphone-native-game-ports-public'\nif os.environ['GITHUB_EVENT_NAME']=='push':\n assert event['after']==os.environ['GITHUB_SHA'] and event.get('deleted',False) is False\nroot=pathlib.Path('.work/native-key-sdk-v2').absolute()\nassert not root.exists() and not any(p.is_symlink() for p in (root,*root.parents))\n(root/'chunks').mkdir(parents=True)\nprint('Generic OS source and synthetic fixtures only; no private engine inputs, secrets, artifacts\
        \ or SDK export.')\n\nPY\n"
    - name: Stage own generic source fragment 1
      id: stage0
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        p=pathlib.Path(''.work/native-key-sdk-v2/chunks/0000.b64'')

        assert p.parent.is_dir() and not p.exists()

        p.write_text('''')

        PY

        '
    - name: Stage own generic source fragment 2
      id: stage1
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        p=pathlib.Path(''.work/native-key-sdk-v2/chunks/0001.b64'')

        assert p.parent.is_dir() and not p.exists()

        p.write_text('''')

        PY

        '
    - name: Stage own generic source fragment 3
      id: stage2
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib

        p=pathlib.Path(''.work/native-key-sdk-v2/chunks/0002.b64'')

        assert p.parent.is_dir() and not p.exists()

        p.write_text('''')

        PY

        '
    - name: Authenticate exact complete generic source closure
      id: assemble
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,pathlib,zlib\nroot=pathlib.Path('.work/native-key-sdk-v2').absolute();source=root/'source'\nassert root.is_dir() and not source.exists() and not root.is_symlink()\nparts=sorted((root/'chunks').glob('*.b64'));assert [p.name for p in parts]==['0000.b64', '0001.b64', '0002.b64']\npacked=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)\nassert len(packed)==17823 and hashlib.sha256(packed).hexdigest()=='71560c69e22790cc8a3e0265a924b70338859fdcbec842e1dd6e8ba087454d15'\nd=zlib.decompressobj();data=d.decompress(packed,50885)\nassert len(data)==50884 and d.eof and not d.unused_data and not d.unconsumed_tail\nrows=json.loads(data);manifest={'native_key.c': {'bytes': 12863, 'sha256': '86afac3360fcfd09dacb95482ee19d7c80bda21257fd7d634cb84bdec62e610a'}, 'native_key.h': {'bytes': 4131, 'sha256': '53227988766806c096444f5427d78d22c505ec108cf9ef6e315efebad169d515'}, 'metadata.py': {'bytes': 2713, 'sha256': 'da4f0b6284f4f2d53dbfd17dc8045d7ac56105e9aa5029a49237d1b6a853936b'},\
        \ 'probe_key.c': {'bytes': 12520, 'sha256': 'eec5eb34649b2f612f5a40bd38341e750cab34c0ef60521d05d5e56d9f1e44a7'}, 'run_sdk.py': {'bytes': 5857, 'sha256': '038a904766c028443d4a482a8fe5598bc9760f75f3c0600f43e1252457a71fa2'}};assert set(rows)==set(manifest)\ndecoded={}\nfor name,row in manifest.items():\n assert name==pathlib.PurePosixPath(name).name and '/' not in name and chr(92) not in name\n b=base64.b64decode(rows[name],validate=True);assert len(b)==row['bytes'] and hashlib.sha256(b).hexdigest()==row['sha256']\n decoded[name]=b\nsource.mkdir()\nfor name,b in decoded.items():(source/name).write_bytes(b)\n(root/'source-closure.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+chr(10))\nprint(json.dumps({'sourceFiles':len(manifest),'sourceHashes':{n:r['sha256'] for n,r in manifest.items()},'gameInputsIncluded':False}))\n\nPY\n"
    - name: Actual native Mac ARM64 tests and unsigned iPhone SDK library
      id: build
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import pathlib,subprocess,sys

        root=pathlib.Path(''.work/native-key-sdk-v2'').absolute()

        p=subprocess.run([sys.executable,str(root/''source/run_sdk.py'')],cwd=root,timeout=540)

        assert p.returncode==0,''Actual SDK and native fixture gates must pass''

        PY

        '
    - name: Require actual outcomes and unchanged source hashes
      id: final
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import hashlib,json,pathlib

        root=pathlib.Path(''.work/native-key-sdk-v2'').absolute();manifest=json.loads((root/''source-closure.json'').read_text())

        for name,row in manifest.items():assert hashlib.sha256((root/''source''/name).read_bytes()).hexdigest()==row[''sha256'']

        result=json.loads((root/''output/result.json'').read_text());assert result[''status'']==''passed''

        assert result[''sourceHashes'']=={n:v[''sha256''] for n,v in manifest.items()}

        assert result[''actualAppleSDKUsed''] and result[''productionGenericDarwinBackendCompiled'']

        assert result[''actualPthreadThreadExitCallbacks'']==2 and result[''actualFailedPthreadExitCleanupRetained'']==1

        assert result[''actualFailedPthreadExitRetirementRetained'']==1 and result[''externalPayloadsNeverFreedByKey''] and result[''fixtureOwnerDrainedMappings'']==7

        assert result[''sourceFLSOrLocaleDestructorAdmitted''] is False and result[''nativePointerKeyOrThreadIdentityValuesPrinted''] is False

        for name in (''gameInputsIncluded'',''gameExecuted'',''physicalIPhoneExecuted'',''developerIdentityUsed'',''SDKExported'',''artifactsUploaded''):assert result[name] is False

        print(json.dumps({''status'':''passed'',''iosLibrarySha256'':result[''iosLibrarySha256''],''actualNativeMacARM64'':result[''actualNativeMacARM64''],''gameReady'':False}))


        PY

        '
