name: Quest 3 APK / Fuji 1976
on:
  # Build after each source change on the isolated public game branch.
  push:
    branches: [quest3/grand-prix-time-machine]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Source, geometry, and packaging tests
        shell: bash
        run: |
          PYTHONPATH=GrandPrixTimeMachine_Quest3_Godot python3 -m unittest discover -s GrandPrixTimeMachine_Quest3_Godot/tests -p "test_*.py" -v 2>&1 | tee source_tests.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GrandPrixTimeMachine_source_diagnostics
          path: source_tests.log
          if-no-files-found: warn

  build-quest-apk:
    # Only package source that has passed the independent test gate.
    needs: verify-source
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.3
    defaults:
      run:
        shell: bash
        working-directory: GrandPrixTimeMachine_Quest3_Godot
    steps:
      - uses: actions/checkout@v4
      - name: Configure Godot Android export templates and JDK
        run: |
          set -eu
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          # Godot CI builds the image under /root; GitHub sets HOME=/github/home.
          cp -a /root/.local/share/godot/export_templates/4.6.3.stable "$HOME/.local/share/godot/export_templates/"
          cp /root/.config/godot/editor_settings-4.6.tres "$HOME/.config/godot/"
          test -s "$HOME/.local/share/godot/export_templates/4.6.3.stable/android_debug.apk"
          grep -F 'export/android/java_sdk_path' "$HOME/.config/godot/editor_settings-4.6.tres"
          test -x /usr/lib/android-sdk/platform-tools/adb
      - name: Install Python for APK verification and Windows installer ZIP
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y --no-install-recommends python3
          python3 --version
      - name: Install official pinned OpenXR Vendors 5.1 addon (build-only)
        run: |
          python3 - <<'PY2'
          from hashlib import sha256
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from zipfile import ZipFile
          url = 'https://github.com/GodotVR/godot_openxr_vendors/releases/download/5.1.0-stable/godotopenxrvendorsaddon.zip'
          digest = '6a838dbdf4115549e4511ebee0da9a5dcc8f9f6258d4cc2f2ee57a907a3e2911'
          with urlopen(Request(url, headers={'User-Agent':'GrandPrix-TimeMachine-build'}),timeout=120) as resp:
              archive = resp.read()
          assert sha256(archive).hexdigest() == digest, 'Unexpected OpenXR plugin bytes: aborting'
          count = 0
          with ZipFile(BytesIO(archive)) as z:
              for member in z.infolist():
                  name = member.filename.replace('\\', '/')
                  marker = 'addons/godotopenxrvendors/'
                  index = name.find(marker)
                  if index < 0 or member.is_dir():
                      continue
                  suffix = name[index + len(marker):]
                  target = Path('addons/godotopenxrvendors') / suffix
                  assert '..' not in target.parts
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(member))
                  count += 1
          assert count > 4, 'OpenXR addon did not contain expected files'
          assert list(Path('addons/godotopenxrvendors').rglob('*.gdextension')), 'Missing vendor GDExtension'
          print('Verified official OpenXR Vendors 5.1 addon:', count, 'files')
          PY2
      - name: Prepare Godot Android Gradle template for Meta manifest
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          from zipfile import ZipFile
          template = Path.home()/'.local/share/godot/export_templates/4.6.3.stable/android_source.zip'
          assert template.is_file(), 'Missing 4.6.3 Gradle source template'
          target = Path('android/build')
          target.mkdir(parents=True, exist_ok=True)
          with ZipFile(template) as z:
              z.extractall(target)
          (target/'.gdignore').touch()
          (target.parent/'.build_version').write_text('4.6.3.stable\n')
          assert (target/'gradlew').is_file(), 'Gradle template missing gradlew'
          (target/'gradlew').chmod(0o755)
          print('Android Gradle build template prepared')
          PY2
      - name: Show build environment
        run: |
          mkdir -p build
          godot --version 2>&1 | tee build/godot-version.log
          java -version 2>&1 | tee build/java-version.log
          env | grep -E '^(ANDROID_HOME|ANDROID_SDK_ROOT|GODOT_VERSION|GODOT_BIN)=' || true
      - name: Godot import and GDScript parser validation
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit --verbose 2>&1 | tee build/godot-import.log
          # Godot can exit 0 even with parser errors; treat them as a hard stop.
          if grep -E 'SCRIPT ERROR: Parse Error|SCRIPT ERROR: Compile Error|Failed to load script' build/godot-import.log; then
            echo 'GDScript compiler reported errors.'
            exit 1
          fi
      - name: Run headless scene startup smoke test
        run: |
          set -o pipefail
          timeout 40s godot --headless --path . --quit-after 90 2>&1 | tee build/godot-startup.log
          # Hardware XR is unavailable in CI. Reject Godot script runtime failures only.
          if grep -E 'SCRIPT ERROR:|Invalid call|Invalid access|Attempt to call function|Cannot call method' build/godot-startup.log; then
            echo 'Godot headless startup reported runtime errors.'
            exit 1
          fi
      - name: Export Android ARM64 OpenXR APK
        run: |
          set -o pipefail
          godot --headless --path . --export-debug "Quest3" build/GrandPrixTimeMachine_Quest3.apk 2>&1 | tee build/godot-export.log
          test -s build/GrandPrixTimeMachine_Quest3.apk
          python3 tools/verify_apk.py build/GrandPrixTimeMachine_Quest3.apk | tee build/apk-verification.json
          # Never ship an APK if Android's cryptographic signature wasn't verified.
          SIGNER="$(command -v apksigner || true)"
          if [ -z "$SIGNER" ]; then
            SIGNER="$(find "${ANDROID_HOME:-/usr/lib/android-sdk}/build-tools" -type f -name apksigner -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SIGNER" ]; then
            echo 'ERROR: Android apksigner is missing; refusing to release unverified APK.' | tee build/apksigner.log
            exit 1
          fi
          "$SIGNER" verify --verbose build/GrandPrixTimeMachine_Quest3.apk 2>&1 | tee build/apksigner.log
          # Export is not considered MR-capable unless native Vendors code was packaged.
          python3 - <<'PY2'
          from zipfile import ZipFile
          with ZipFile('build/GrandPrixTimeMachine_Quest3.apk') as z:
              vendors = [n for n in z.namelist() if n.endswith('.so') and 'vendor' in n.lower()]
              print('Native Vendors GDExtension libraries:', vendors)
              assert vendors, 'No native OpenXR Vendors library embedded; reject MR candidate APK'
          PY2
          sha256sum build/GrandPrixTimeMachine_Quest3.apk > build/SHA256SUMS.txt
      - name: Package Windows one-click Quest installer
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('.')
          files = {
              root/'build/GrandPrixTimeMachine_Quest3.apk': 'GrandPrixTimeMachine_Quest3.apk',
              root/'build/SHA256SUMS.txt': 'SHA256SUMS.txt',
              root/'install/INSTALL_ON_QUEST3.cmd': 'INSTALL_ON_QUEST3.cmd',
              root/'install/INSTALL_ON_QUEST3.ps1': 'INSTALL_ON_QUEST3.ps1',
              root/'install/READ_ME_FIRST.txt': 'READ_ME_FIRST.txt',
          }
          dest = root/'build/GrandPrixTimeMachine_Quest3_Easy_Install.zip'
          with ZipFile(dest,'w',ZIP_DEFLATED,compresslevel=6) as archive:
              for path,name in files.items():
                  if not path.is_file():
                      raise SystemExit(f'Installer asset missing: {path}')
                  archive.write(path,name)
          with ZipFile(dest) as archive:
              assert archive.testzip() is None
              assert set(archive.namelist()) == set(files.values())
          print(f'Complete Quest Easy Install kit: {dest}, bytes={dest.stat().st_size}')
          PY2
      - name: Upload logs (even for failed exports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GrandPrixTimeMachine_build_diagnostics
          path: |
            GrandPrixTimeMachine_Quest3_Godot/build/*.log
          if-no-files-found: warn
      - name: Upload Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: GrandPrixTimeMachine_Quest3_v0.8_Easy_Install
          path: |
            GrandPrixTimeMachine_Quest3_Godot/build/GrandPrixTimeMachine_Quest3.apk
            GrandPrixTimeMachine_Quest3_Godot/build/SHA256SUMS.txt
            GrandPrixTimeMachine_Quest3_Godot/build/GrandPrixTimeMachine_Quest3_Easy_Install.zip
          if-no-files-found: error
