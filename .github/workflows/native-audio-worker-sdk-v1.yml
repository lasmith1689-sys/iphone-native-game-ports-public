name: 'Native audio worker: real Mac voices and genuine iPhone broker SDK'
'on':
  push:
    branches:
    - codex/native-audio-worker-sdk-v1-20261105
    paths:
    - .github/workflows/native-audio-worker-sdk-v1.yml
    - native/platform/native-audio-worker-sdk-v1-20261105/**
permissions:
  contents: read
concurrency:
  group: native-audio-worker-sdk-v1
  cancel-in-progress: false
jobs:
  native-audio-worker:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-audio-worker-sdk-v1-20261105' && github.event_name == 'push'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
    - name: Authenticate twenty own support files
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 -B - <<'PY'\nimport hashlib,json,os,pathlib,re,urllib.request\nassert os.environ['GITHUB_REPOSITORY']=='lasmith1689-sys/iphone-native-game-ports-public' and os.environ['GITHUB_REF']=='refs/heads/codex/native-audio-worker-sdk-v1-20261105'\nassert os.environ['GITHUB_EVENT_NAME']=='push'\nsha=os.environ['GITHUB_SHA'];assert re.fullmatch('[0-9a-f]{40}',sha)\ne=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text());assert e['repository']['full_name']=='lasmith1689-sys/iphone-native-game-ports-public' and e['repository']['private'] is False and e['after']==sha and e['ref']=='refs/heads/codex/native-audio-worker-sdk-v1-20261105' and not e.get('deleted',False)\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-audio-worker-proof';assert not root.exists() and not any(p.is_symlink() for p in(root,*root.parents))\nsource=root/'source';source.mkdir(parents=True);manifest={'ngp_audio_shared_impl_tokens_v1.c': {'bytes': 149, 'sha256':\
        \ 'fa5a4d118fcf01e6d0ff93ba351359f751e970b68028ee25d2d2210206c06d0b'}, 'ngp_voice_service_v1.c': {'bytes': 25572, 'sha256': '0b84cb7b64cd0e7a47090e420b9fe0e6915584ad20b21bf2efac6af2b243def9'}, 'ngp_voice_tokens_v1.c': {'bytes': 7632, 'sha256': 'e21be2c2fee27452c76b3a433490bc32831a6014cc02332d143af0d4a8051415'}, 'ngp_positional_provider_v1.c': {'bytes': 8043, 'sha256': '701ef9cc3b94d64c40db678287d87feef7ffa10c7b0be8ee73a5391c5a4ed7bf'}, 'ngp_audio_worker_runtime_v1.c': {'bytes': 7230, 'sha256': 'baabbadd9cf8576120423364709c7f9e8b254d745e675c6cdb4df69599ed0e39'}, 'ngp_device_mixer_render_v1.c': {'bytes': 3163, 'sha256': 'dee442897e3eebd8faccba7fcef9f075e5f19a8fa473c2f0282c79810ba8818e'}, 'ngp_device_mixer_v1.m': {'bytes': 17003, 'sha256': '66a2d0cffcab69af74d9f6df6cc7d986db0c33130f9ee1a80345fae8307d5683'}, 'ngp_audio_worker_broker_v1.m': {'bytes': 674, 'sha256': '5222b83fc4c5a56b7d2ad68361f7faacec8e1e4f5181f36a0b138ccb29872798'}, 'ngp_audio_shared_profile_v1.h': {'bytes': 577, 'sha256':\
        \ '8ad2671d8f30595b5f2acfddcea086f4fcd278d9bf0121fd92afba57c429d397'}, 'ngp_voice_service_v1.h': {'bytes': 5102, 'sha256': 'e849cc4a659286c53dc9b93741979d97544317a262a391318a5c11377ce5fae3'}, 'ngp_voice_tokens_v1.h': {'bytes': 2125, 'sha256': 'a44169deb9401e5cff1dd9b6d26fe7982fd66a0c467b17835d9b374ff5ef9fb5'}, 'ngp_positional_provider_v1.h': {'bytes': 2336, 'sha256': '213629d542a8cf0d630cdc371041e8f94254cf0165eed7a382c39fa48119107a'}, 'ngp_audio_worker_runtime_v1.h': {'bytes': 2038, 'sha256': '90db6c7962c167a962bddd2f943a01ffbd34d78d42986c6967c73471e8561a27'}, 'ngp_device_mixer_render_v1.h': {'bytes': 1266, 'sha256': 'aab3377efd6d3a4b016134d8e8f14b256f9d77ec1cc02d1b0b571f5a22d77baf'}, 'ngp_device_mixer_v1.h': {'bytes': 1917, 'sha256': 'dc660184abf5efe81d31ea443fa4413307a9230eb90641846ad3d5b67eceac61'}, 'ngp_voice_gain_balance_v2.h': {'bytes': 1507, 'sha256': '3ff607a8db4cf14646bf6e4c91a6474d3a7f6508cc14318b85c6a6628b6590c9'}, 'fixture_real.c': {'bytes': 5684, 'sha256': 'aa58936ebc51141a69740ce1ee795bff7c332da839d183acc97d211b638c2ee2'},\
        \ 'inspect_image.py': {'bytes': 3901, 'sha256': '408e13fcb27838d5eea161491eb538e2a91cdd5ccecf84416191390d712efa52'}, 'run_sdk.py': {'bytes': 8457, 'sha256': 'a02f9633bc75fc11b2d77ce469771759ebf0b5166b6981470e319f5c742c4ef1'}, 'README.md': {'bytes': 1082, 'sha256': 'b6a453047b27a271e4fdfc16d1ef177992155790724cb3da6b427297e1665bf8'}}\nfor name,w in manifest.items():\n assert name==pathlib.PurePosixPath(name).name and w['bytes']<100000\n with urllib.request.urlopen('https://raw.githubusercontent.com/'+'lasmith1689-sys/iphone-native-game-ports-public'+'/'+sha+'/'+'native/platform/native-audio-worker-sdk-v1-20261105'+'/'+name,timeout=45) as response:raw=response.read(w['bytes']+1)\n assert len(raw)==w['bytes'] and hashlib.sha256(raw).hexdigest()==w['sha256']\n (source/name).write_bytes(raw)\n(root/'reviewed-source-closure.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+chr(10))\nprint('Authenticated twenty own support files; no recovered source, assets or build secret.')\n\
        PY\n"
    - name: Run real Mac voices and repeat genuine iPhone broker objects
      shell: bash
      run: 'set -euo pipefail

        umask 077

        python3 -B - <<''PY''

        import os,pathlib,subprocess,sys

        root=pathlib.Path(os.environ[''RUNNER_TEMP''])/''native-audio-worker-proof''

        p=subprocess.run([sys.executable,''-B'',str(root/''source/run_sdk.py''),''--output'',str(root/''output'')],timeout=1000)

        assert p.returncode==0,''Actual Mac voice join and genuine iPhone broker build must pass''

        PY

        '
    - name: Require actual backend and exact SDK results
      shell: bash
      run: "set -euo pipefail\npython3 -B - <<'PY'\nimport hashlib,json,os,pathlib\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-audio-worker-proof';out=root/'output';closure=json.loads((root/'reviewed-source-closure.json').read_text());assert closure==json.loads((out/'source-identities.json').read_text())\nfor name,w in closure.items():\n raw=(root/'source'/name).read_bytes();assert len(raw)==w['bytes'] and hashlib.sha256(raw).hexdigest()==w['sha256']\nr=json.loads((out/'result.json').read_text());assert r['status']=='own-audio-worker-real-Mac-and-genuine-iPhone-broker-SDK-passed' and r['SDKVersion']=='27.1'\nfor name in('actualSDKUsed','actualVoiceBackendLinked','deviceBrokerAndBridgeCompiled','brokerIsSyntheticInMacFixture','repeatedWholeObjectsAndStackUsageIdentical'):assert r[name] is True\nfor name in('privateGameCodeIncluded','physicalDeviceStarted','iPhoneExecuted','gameExecuted','developerSigned','installable'):assert r[name] is False\nassert r['nativeMacOutcome']['actualVoiceLoans']==77\
        \ and r['nativeMacOutcome']['verifiedPCMFrames']==224 and len(r['objects'])==9\nfiles=list(out.rglob('*'));assert len(files)<300 and all(not p.is_symlink()for p in files)and sum(p.stat().st_size for p in files if p.is_file())<64*1024*1024\nprint(json.dumps({'status':r['status'],'nativeMacOutcome':r['nativeMacOutcome'],'SDKVersion':r['SDKVersion'],'physicalDeviceStarted':False}))\nPY\n"
    - name: Retain bounded own build evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-audio-worker-sdk-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/native-audio-worker-proof/output
        if-no-files-found: error
        retention-days: 1
        compression-level: 6
        include-hidden-files: false
        archive: true
