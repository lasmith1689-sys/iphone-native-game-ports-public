    - name: Retain bounded public support raw diagnostics
      id: capture
      shell: bash
      if: always()
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),4227)\nassert len(raw)==4226\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='5f5bcfe6ea07f40d2ef443cfad0425ea2925b32bb375c444cb3c1fdfaa73bbc2'\n\
        try:exec(compile(raw,'<owned-gl-composition-v1-capture>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-stack-borrow-v1a').absolute()\n\
