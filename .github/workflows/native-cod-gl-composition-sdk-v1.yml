name: Own measured GL worker and C-safe capsule SDK syntax/link diagnostic
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/native-cod-gl-composition-sdk-v1-20261101
    paths:
    - .github/workflows/native-cod-gl-composition-sdk-v1.yml
permissions:
  contents: read
concurrency:
  group: native-cod-gl-composition-sdk-v1
  cancel-in-progress: false
jobs:
  cod-gl-composition-v1:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.ref == 'refs/heads/codex/native-cod-gl-composition-sdk-v1-20261101'
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
    - name: Pin matching public GL4ES and in-place Apple SDK
      id: prepare
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),21185)\nassert len(raw)==21184\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='59a9683cbf846f89e1a7a73a3aa28ca95839f3af4a94e316086b37501d68ae1f'\n\
        try:exec(compile(raw,'<owned-gl-composition-v1-prepare>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-composition-v1').absolute()\n\
        \ if root.is_dir() and not root.is_symlink():\n  output=root/'runner-program-prepare.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
        PY\n"
    - name: Materialize version4 header_sources
      id: header_sources
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),7765)\nassert len(raw)==7764\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='99da28a5c427dbbd784d07b7cb61bdf4816f44f0c308b9827579c45d0f031c22'\n\
        try:exec(compile(raw,'<owned-gl-composition-v1-header_sources>','exec'),{'__name__':'__main__'})\nfinally:\n\
        \ root=pathlib.Path('.work/cod-gl-composition-v1').absolute()\n if root.is_dir() and not root.is_symlink():\n\
        \  output=root/'runner-program-header_sources.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
        PY\n"
    - name: Materialize version4 dispatch_source
      id: dispatch_source
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),10536)\nassert len(raw)==10535\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='d1bd1272ab766e0c59d6b2f471dff6e3a4278819404ee2b795c1a4c2c9ff52d5'\n\
        try:exec(compile(raw,'<owned-gl-composition-v1-dispatch_source>','exec'),{'__name__':'__main__'})\nfinally:\n\
        \ root=pathlib.Path('.work/cod-gl-composition-v1').absolute()\n if root.is_dir() and not root.is_symlink():\n\
        \  output=root/'runner-program-dispatch_source.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
        PY\n"
    - name: Materialize version4 backend_sources
      id: backend_sources
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),6349)\nassert len(raw)==6348\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='50bfb9e6d77df2c041cf140ec5f1bddb968a0158ff09d0615b6f97a59357a629'\n\
        try:exec(compile(raw,'<owned-gl-composition-v1-backend_sources>','exec'),{'__name__':'__main__'})\nfinally:\n\
        \ root=pathlib.Path('.work/cod-gl-composition-v1').absolute()\n if root.is_dir() and not root.is_symlink():\n\
        \  output=root/'runner-program-backend_sources.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
        PY\n"
    - name: Materialize version4 uikit_sources
      id: uikit_sources
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),10605)\nassert len(raw)==10604\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='2035ed93636761784ec59ab4b81faa741c5e8b6b8ebaf712efe97ba56767810b'\n\
        try:exec(compile(raw,'<owned-gl-composition-v1-uikit_sources>','exec'),{'__name__':'__main__'})\nfinally:\n\
        \ root=pathlib.Path('.work/cod-gl-composition-v1').absolute()\n if root.is_dir() and not root.is_symlink():\n\
        \  output=root/'runner-program-uikit_sources.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
        PY\n"
    - name: Materialize unchanged own DXT and owned profile sources
      id: codec_profile_sources
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),9657)\nassert len(raw)==9656\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='8ef29edf40a92d6f505fcc6416c7407a96f09224f753693bf14c6e618190621e'\n\
        try:exec(compile(raw,'<owned-gl-composition-v1-codec_profile_sources>','exec'),{'__name__':'__main__'})\n\
        finally:\n root=pathlib.Path('.work/cod-gl-composition-v1').absolute()\n if root.is_dir() and not root.is_symlink():\n\
        \  output=root/'runner-program-codec_profile_sources.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
        PY\n"
    - name: Materialize only own canonical worker and capsule
      id: composition_sources
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),15107)\nassert len(raw)==15106\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='a26a1b43023dc4ac355c7487ab36f191cebf2a07af7eb90c2060bc0d84ac0d5d'\n\
        try:exec(compile(raw,'<owned-v12b-composition_sources>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-composition-v1').absolute()\n\
        \ if root.is_dir() and not root.is_symlink():\n  output=root/'runner-program-composition_sources.py'\n \
        \ assert not output.is_symlink();output.write_bytes(raw)\nPY\n"
    - name: Materialize bounded raw classic binder diagnostic readers
      id: classic_reader_sources
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),9748)\nassert len(raw)==9747\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='939fe435463badc558240f0bebb0bdbdaa1ee3d88de489a9a37162995c690ba4'\n\
        try:exec(compile(raw,'<owned-v12b-classic_reader_sources>','exec'),{'__name__':'__main__'})\nfinally:\n\
        \ root=pathlib.Path('.work/cod-gl-composition-v1').absolute()\n if root.is_dir() and not root.is_symlink():\n\
        \  output=root/'runner-program-classic_reader_sources.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
        PY\n"
    - name: Compile native version4 bridge and exact matching private state helper
      id: build
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),42828)\nassert len(raw)==42827\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='c2f8b0e54c30ceffbb95a96e7b49a1b45d44b5082300eb7d5ba6042ee5b1976c'\n\
        try:exec(compile(raw,'<owned-gl-composition-v1-build>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-composition-v1').absolute()\n\
        \ if root.is_dir() and not root.is_symlink():\n  output=root/'runner-program-build.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
        PY\n"
    - name: Inspect production closure and real version4 dyld exports
      id: inspect
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),49020)\nassert len(raw)==49019\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='9837d72f6b2153873703eb98d8c5a7b4ddca2c51e9b7db3dee97f4f1aaa1d65c'\n\
        try:exec(compile(raw,'<owned-gl-composition-v1-inspect>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-composition-v1').absolute()\n\
        \ if root.is_dir() and not root.is_symlink():\n  output=root/'runner-program-inspect.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
        PY\n"
    - name: Retain bounded public support raw diagnostics
      id: capture
      shell: bash
      if: always()
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),4233)\nassert len(raw)==4232\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='4c1251341ad449d02f4a659e0ab9fedb111fda7bf61a6f6d43f14863f8186a0a'\n\
        try:exec(compile(raw,'<owned-gl-composition-v1-capture>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-composition-v1').absolute()\n\
        \ if root.is_dir() and not root.is_symlink():\n  output=root/'runner-program-capture.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
        PY\n"
    - name: Upload diagnostic raw closure, never installable
      id: raw_upload
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: cod-gl-abi11b-raw-${{ github.run_id }}-${{ github.run_attempt }}
        path: .work/cod-gl-composition-v1-raw/
        retention-days: 1
        if-no-files-found: error
        include-hidden-files: true
        compression-level: 6
