name: Generic native C-scope Mac and unsigned iPhone SDK proof
'on':
  push:
    branches:
    - codex/native-scope-component-v1-20261029
    paths:
    - .github/workflows/native-scope-component-v1.yml
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: generic-native-scope-component-v1
  cancel-in-progress: false
jobs:
  scope-component:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-scope-component-v1-20261029' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
    - id: guard
      name: Require exact public proof context
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import json,os,re

        from pathlib import Path

        assert os.environ[''GITHUB_REPOSITORY'']==''lasmith1689-sys/iphone-native-game-ports-public'' and os.environ[''GITHUB_REF'']==''refs/heads/codex/native-scope-component-v1-20261029''

        kind=os.environ[''GITHUB_EVENT_NAME''];assert kind in (''push'',''workflow_dispatch'')

        assert re.fullmatch(''[a-f0-9]{40}'',os.environ[''GITHUB_SHA''])

        event=json.loads(Path(os.environ[''GITHUB_EVENT_PATH'']).read_bytes())

        assert event[''repository''][''full_name'']==''lasmith1689-sys/iphone-native-game-ports-public'' and event[''repository''][''private''] is False

        if kind==''push'':assert event[''ref'']==''refs/heads/codex/native-scope-component-v1-20261029'' and event[''after'']==os.environ[''GITHUB_SHA''] and event.get(''deleted'',False) is False

        else:assert event.get(''inputs'') in (None,{})

        print(''Exact generic own-scope proof context accepted.'')

        PY

        '
    - id: stagepart
      name: Stage first inline own source segment
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import os

        from pathlib import Path

        path=Path(os.environ[''RUNNER_TEMP'']).resolve()/''ngp-scope-v1-part1.txt''

        assert not path.exists()

        with path.open(''xb'') as output:output.write(''''.encode(''ascii''))

        print(''First exact own-source segment staged; final hashes remain required.'')

        PY

        '
    - id: stage
      name: Verify and stage five exact own sources
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,os,zlib\nfrom pathlib import Path\npayload=(Path(os.environ['RUNNER_TEMP']).resolve()/'ngp-scope-v1-part1.txt').read_text(encoding='ascii')+''\n\
        identities={'cod_stack_scope_v15.c': {'bytes': 6103, 'sha256': '8453c55289f4b7703f98d3f3c45c9755e2b18c9f7ab5c9e6ccf6976e8e9ee24c'}, 'cod_stack_scope_v15.h': {'bytes': 3293, 'sha256': '841d44106467d36d1673f6df63d33382c8012ad52acb37b4af170f4068ba8f16'}, 'test_scope_v15.c': {'bytes': 10976, 'sha256': 'a0524d91fd6f3bc32b5a6c63b58420785b46e2fe987afd13ca1330cab52f254d'}, 'scope_apple_inspect.py': {'bytes': 13051, 'sha256': '9d9275ccd1d072a68a99794f0dcfeb4924c046521f524a6a62d74e9a54d15c29'}, 'run_apple.py': {'bytes': 8593, 'sha256': '9a55ce751405e8bd0d6050cb6812fb947f5a6782617dad0afa824106ebf6b621'}}\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'ngp-scope-public-v1'\nassert not base.exists();base.mkdir(mode=0o700);source=base/'source';source.mkdir(mode=0o700)\ndecoder=zlib.decompressobj();packed=decoder.decompress(base64.b64decode(payload,validate=True),131073)\nassert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail and len(packed)<=131072\nfiles=json.loads(packed);assert\
        \ set(files)==set(identities) and len(files)==5\nfor name,text in files.items():\n assert '/' not in name and '\\\\' not in name and name not in ('.','..') and isinstance(text,str)\n raw=text.encode('utf-8');wanted=identities[name]\n assert len(raw)<=65536 and len(raw)==wanted['bytes'] and hashlib.sha256(raw).hexdigest()==wanted['sha256']\n (source/name).write_bytes(raw)\nassert sum(r['bytes'] for r in identities.values())==42016\n(base/'source-manifest.json').write_text(json.dumps(identities,sort_keys=True)+'\\n')\nprint('Exact five own-source files staged: 42016 bytes.')\nPY\n"
    - id: proof
      name: Run exact owned scope proof
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport hashlib,json,os,signal,subprocess,sys\nfrom pathlib import Path\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'ngp-scope-public-v1'\nsource=base/'source';output=base/'build';reports=base/'reports';reports.mkdir(mode=0o700)\nidentities={'cod_stack_scope_v15.c': {'bytes': 6103, 'sha256': '8453c55289f4b7703f98d3f3c45c9755e2b18c9f7ab5c9e6ccf6976e8e9ee24c'}, 'cod_stack_scope_v15.h': {'bytes': 3293, 'sha256': '841d44106467d36d1673f6df63d33382c8012ad52acb37b4af170f4068ba8f16'}, 'test_scope_v15.c': {'bytes': 10976, 'sha256': 'a0524d91fd6f3bc32b5a6c63b58420785b46e2fe987afd13ca1330cab52f254d'}, 'scope_apple_inspect.py': {'bytes': 13051, 'sha256': '9d9275ccd1d072a68a99794f0dcfeb4924c046521f524a6a62d74e9a54d15c29'}, 'run_apple.py': {'bytes': 8593, 'sha256': '9a55ce751405e8bd0d6050cb6812fb947f5a6782617dad0afa824106ebf6b621'}}\nassert {p.name for p in source.iterdir()}==set(identities)\nfor name,wanted in identities.items():\n p=source/name;assert\
        \ p.is_file() and not p.is_symlink()\n raw=p.read_bytes();assert len(raw)==wanted['bytes'] and hashlib.sha256(raw).hexdigest()==wanted['sha256']\nfor name in ('status.json', 'result-summary.json', 'frames-summary.json', 'commands-summary.json', 'diagnostics.txt'):(reports/name).write_text('' if name.endswith('.txt') else '{}\\n')\nstatus={'status':'started','ownSourceFiles':5,'iPhoneRuntime':False,'recoveredCodeExecuted':False,'actualHostIntegration':False,'actualSPOrV2Admission':False}\n(reports/'status.json').write_text(json.dumps(status,indent=2)+'\\n')\nclean={'PATH':'/usr/bin:/bin:/usr/sbin:/sbin','HOME':str(base),'TMPDIR':str(base)+'/', 'LANG':'C','LC_ALL':'C'}\nexit_code=1;timed_out=False;failure=''\ntry:\n with (base/'driver.stdout').open('wb') as stdout,(base/'driver.stderr').open('wb') as stderr:\n  child=subprocess.Popen([sys.executable,str(source/'run_apple.py'),'--output',str(output)],env=clean,stdout=stdout,stderr=stderr,start_new_session=True)\n  try:exit_code=child.wait(timeout=900)\n\
        \  except subprocess.TimeoutExpired:\n   timed_out=True;failure='owned-proof-process-group-timeout';os.killpg(child.pid,signal.SIGTERM)\n   try:child.wait(timeout=3)\n   except subprocess.TimeoutExpired:os.killpg(child.pid,signal.SIGKILL);child.wait(timeout=3)\nexcept Exception as exc:failure=type(exc).__name__+': '+str(exc)[:512]\n\"\"\"Bounded selected-report sanitizer, inlined verbatim into the workflow.\"\"\"\ndef collect_document(data,identities,allow_partial):\n import hashlib,re\n api={'_cod_scope_'+n+'_v15' for n in ('worker_open','worker_close','root_begin','root_finish','engine_check','trap_target','callback_prebody','begin','finish')}\n families={'bootstrap','module_admit','module_release','ui_admit','ui_release','cgame_admit','cgame_release','game_export','vm_call','platform_poll','platform_stop','input_enqueue','core_target','exit_registry'}\n hot={'_valid':set(),'_retain':{'_valid'},'_cod_scope_engine_check_v15':{'_valid'},'_cod_scope_trap_target_v15':{'_cod_scope_engine_check_v15'},'_cod_scope_callback_prebody_v15':{'_valid'},\n\
        \  '_cod_scope_begin_v15':{'_valid','_retain','_cod_scope_engine_check_v15','_cod_scope_callback_prebody_v15','_memcpy','___memcpy_chk'},'_cod_scope_finish_v15':{'_valid','_retain'}}\n allowed_imports={'_bzero','___bzero','_memcpy','_memset','___memcpy_chk','___memset_chk','___stack_chk_fail','___stack_chk_guard','_pthread_threadid_np','_pthread_create','_pthread_join','_printf','_setjmp','__setjmp','_longjmp','dyld_stub_binder'}\n def hash_ok(s):assert isinstance(s,str) and re.fullmatch('[0-9a-f]{64}',s);return s\n def sdk_word(text):\n  m=re.fullmatch(r'([1-9][0-9]*)\\.([0-9]+)(?:\\.([0-9]+))?',text);assert m;a,b,c=map(int,(m[1],m[2],m[3] or '0'));assert a<65536 and b<256 and c<256;return a<<16|b<<8|c\n def metadata(m,platform,sdk,require_apis):\n  assert isinstance(m['bytes'],int) and 32<=m['bytes']<=8388608;hash_ok(m['sha256'])\n  assert m['filetype']==(6 if platform==2 else 2) and m['dependencies']==['/usr/lib/libSystem.B.dylib']\n  assert m['platform']==[dict(platform=platform,minOS=0x1a0000\
        \ if platform==2 else 0xf0000,sdk=sdk)]\n  assert len(m['uuid'])==1 and re.fullmatch('[0-9a-f]{32}',m['uuid'][0]) and m['uuid'][0]!='0'*32\n  assert set(m['imports'])<=allowed_imports and '_pthread_threadid_np' in m['imports']\n  if require_apis:\n   assert not m['signatures'] and set(m['exports'])==set(m['strongAPIs'])==set(m['exportTrie'])==api\n   assert m['strongAPIs']==m['exportTrie'] and len(set(m['strongAPIs'].values()))==9\n  return {k:m[k] for k in ('bytes','sha256','filetype','platform','dependencies','uuid','signatures','imports','exports','strongAPIs','exportTrie','code')}\n def route(p):\n  assert isinstance(p['start'],int) and 0<=p['start']<1<<64\n  raw=bytes.fromhex(p['bytes']);assert raw and len(raw)%4==0 and len(raw)<=65536\n  assert len(p['calls'])<=32 and len(p['conditionalBranches'])<=128\n  for c in p['calls']:assert set(c)=={'offset','target','address'} and isinstance(c['offset'],int) and 0<=c['offset']<len(raw) and c['offset']%4==0 and isinstance(c['target'],str)\
        \ and len(c['target'])<=128\n  return dict(start=p['start'],bytes=len(raw),codeSha256=hashlib.sha256(raw).hexdigest(),calls=p['calls'],conditionalBranches=p['conditionalBranches'])\n def machine(m,negative):\n  assert m['status']=='exact-hot-direct-graph-and-fourteen-distinct-C-catch-machine-routes-pass' and m['actualStackAdmission'] is False and m['expectedMissingRestore'] is negative\n  assert set(m['hot'])==set(hot) and set(m['catches'])==families\n  cold={'_cod_scope_worker_open_v15','_cod_scope_worker_close_v15','_cod_scope_root_begin_v15','_cod_scope_root_finish_v15','_actual_owner'};assert set(m['coldActualOwner'])==cold\n  for name,p in m['hot'].items():assert {x['target'] for x in p['calls']}<=hot[name]|{'___stack_chk_fail'}\n  for name,p in m['coldActualOwner'].items():assert sum(x['target']==('_pthread_threadid_np' if name=='_actual_owner' else '_actual_owner') for x in p['calls'])==1\n  for name,p in m['catches'].items():\n   calls=p['calls'];begin=[x['offset'] for x\
        \ in calls if x['target']=='_cod_scope_begin_v15'];setjmps=[x['offset'] for x in calls if x['target'] in ('_setjmp','__setjmp')];finish=[x['offset'] for x in calls if x['target']=='_cod_scope_finish_v15'];descend=[x['offset'] for x in calls if x['target']=='_descend_and_trap']\n   assert len(begin)==len(setjmps)==len(descend)==1 and begin[0]<setjmps[0]<descend[0]\n   if negative:assert not finish\n   else:assert len(finish)==1 and setjmps[0]<finish[0] and any(setjmps[0]<b<finish[0] for b in p['conditionalBranches'])\n  assert len({p['start'] for p in m['catches'].values()})==14\n  return dict(status=m['status'],expectedMissingRestore=negative,hot={n:route(p) for n,p in m['hot'].items()},coldActualOwner={n:route(p) for n,p in m['coldActualOwner'].items()},catches={n:route(p) for n,p in m['catches'].items()},actualStackAdmission=False)\n assert data['sources']==identities and data['iPhoneRuntime'] is False and data['actualHostIntegration'] is False\n results=data['results'];assert\
        \ set(results)<={'mac-positive','mac-missing-restore','iphone-compile-only'}\n if 'mac-missing-restore' in results:assert 'mac-positive' in results\n if 'iphone-compile-only' in results:assert {'mac-positive','mac-missing-restore'}<=set(results)\n complete=data['wholeProofComplete'] is True\n if not allow_partial:assert complete\n if complete:assert set(results)=={'mac-positive','mac-missing-restore','iphone-compile-only'} and data['status']=='own-scope-Mac-positive-negative-foreign-owner-and-unsigned-iPhone-SDK-proof-pass' and data['recoveredCodeExecuted'] is False and data['actualSPOrV2Admission'] is False\n summary=dict(status='complete-own-scope-proof' if complete else 'partial-own-scope-proof',completeTargets=[],iPhoneRuntime=False,recoveredCodeExecuted=False,actualHostIntegration=False,actualSPOrV2Admission=False);frame_summary={}\n for label,e in results.items():\n  iphone=label=='iphone-compile-only';identity=e['identity'];expected='arm64-apple-ios26.0' if iphone else 'arm64-apple-macos15.0'\n\
        \  assert identity['sourceHashes']==identities and identity['target']==expected and identity['repeatedCodeAndFramesMatch'] is True and identity['stateBytes']==128 and identity['snapshotBytes']==104 and identity['actualSPOrV2Admission'] is False\n  sdk=sdk_word(identity['SDK']);hash_ok(identity['compilerSha256']);assert isinstance(identity['compilerVersion'],str) and len(identity['compilerVersion'])<=8192\n  assert set(identity['frames'])=={'core','fixture'} and set(identity['flags'])=={'core','fixture'}\n  for rows in identity['frames'].values():assert isinstance(rows,dict) and 1<=len(rows)<=256 and all(isinstance(n,str) and len(n)<=128 and isinstance(v,int) and 0<=v<=1048576 for n,v in rows.items())\n  assert set(identity['frames']['fixture'])>=families and len(identity['frames']['core'])==12 and max(identity['frames']['core'].values())<=512\n  frame_summary[label]={k:identity[k] for k in ('target','SDK','compilerSha256','compilerVersion','flags','frames','code','objectBuildVersions','repeatedCodeAndFramesMatch','stateBytes','snapshotBytes')}\n\
        \  entry=dict(binary=metadata(e['binary'],2 if iphone else 1,sdk,iphone),machine=machine(e['machine'],False if iphone else label=='mac-missing-restore'))\n  if iphone:\n   assert e['executed'] is False and e['unsigned'] is True\n   entry['linkedFixtureProof']=metadata(e['linkedFixtureProof'],2,sdk,True)\n   for name,address in e['linkedFixtureProof']['strongAPIs'].items():\n    routes=e['machine']['hot']|e['machine']['coldActualOwner'];assert routes[name]['start']==address\n   entry.update(executed=False,unsigned=True)\n  else:\n   negative=label=='mac-missing-restore';r=e['runtime'];assert e['actualOwnedARM64ChildExecuted'] is True and e['realDarwinForeignOwnerFixture'] is True\n   assert r['status']==('failed' if negative else 'passed') and r['failure']==('bootstrap ancestor' if negative else '') and r['cases']==(9 if negative else 170) and r['markers']==(1 if negative else 16) and r['catchFamiliesExecuted']==(1 if negative else 14) and r['families']==14 and r['stateBytes']==128\
        \ and r['snapshotBytes']==104 and r['recoveredCodeExecuted'] is False\n   entry.update(runtime=r,actualOwnedARM64ChildExecuted=True,realDarwinForeignOwnerFixture=True)\n  summary[label]=entry;summary['completeTargets'].append(label)\n return summary,frame_summary\n\ncommands=[];summary={'status':'proof-not-passed','completeTargets':[],'iPhoneRuntime':False,'recoveredCodeExecuted':False,'actualHostIntegration':False,'actualSPOrV2Admission':False};frames={}\ntry:\n if (output/'commands.json').is_file():\n  path=output/'commands.json';assert path.stat().st_size<=131072;raw=json.loads(path.read_bytes());assert isinstance(raw,list) and len(raw)<=64\n  commands=[{k:r[k] for k in ('label','returncode','timeout','timeoutSeconds') if k in r} for r in raw]\n partial=output/'partial-result.json';prefix={}\n if partial.is_file():\n  assert partial.stat().st_size<=2*1024*1024;data=json.loads(partial.read_bytes());assert set(data['results'])<={'mac-positive','mac-missing-restore','iphone-compile-only'}\n\
        \  for label in ('mac-positive','mac-missing-restore','iphone-compile-only'):\n   if label not in data['results']:continue\n   attempt=dict(data,results={**prefix,label:data['results'][label]},wholeProofComplete=False)\n   try:candidate,candidate_frames=collect_document(attempt,identities,True)\n   except Exception as exc:failure='partial-report-'+type(exc).__name__+': '+str(exc)[:512];exit_code=1;break\n   prefix[label]=data['results'][label];summary=candidate;frames=candidate_frames\n if exit_code==0 and not timed_out and not failure:\n  path=output/'result.json';assert path.is_file() and path.stat().st_size<=2*1024*1024\n  full=json.loads(path.read_bytes());assert full['results']==prefix\n  summary,frames=collect_document(full,identities,False)\nexcept Exception as exc:failure='report-collection-'+type(exc).__name__+': '+str(exc)[:512];exit_code=1\npassed=exit_code==0 and not timed_out and not failure\nif not passed:summary['status']='proof-not-passed'\n(reports/'commands-summary.json').write_text(json.dumps(commands,indent=2)+'\\\
        n')\n(reports/'result-summary.json').write_text(json.dumps(summary,indent=2)+'\\n')\n(reports/'frames-summary.json').write_text(json.dumps(frames,indent=2)+'\\n')\ndiagnostics=[];remaining=49152\nselected=[base/'driver.stderr']+sorted(output.glob('*.stderr'))+sorted(output.glob('*owned-child.stdout'))\nfor path in selected:\n if path.is_file() and path.stat().st_size:\n  raw=path.read_bytes()[-min(4096,remaining):];diagnostics.append('=== '+path.name+' (bounded tail) ===\\n'+raw.decode('utf-8',errors='replace'));remaining-=len(raw)\n  if remaining<=0:break\n(reports/'diagnostics.txt').write_text('\\n'.join(diagnostics))\nstatus.update(status='passed' if passed else 'failed',recipeExitCode=exit_code,timedOut=timed_out,failure=failure,actualMacAndSDKProofPassed=passed)\n(reports/'status.json').write_text(json.dumps(status,indent=2)+'\\n')\nassert {p.name for p in reports.iterdir()}==set(('status.json', 'result-summary.json', 'frames-summary.json', 'commands-summary.json', 'diagnostics.txt'))\n\
        assert all(p.is_file() and not p.is_symlink() and p.stat().st_size<=196608 for p in reports.iterdir())\nassert sum(p.stat().st_size for p in reports.iterdir())<=393216\nprint(json.dumps(status));raise SystemExit(0 if passed else 1)\nPY\n"
    - id: upload
      name: Upload only bounded selected reports
      if: always() && steps.guard.outcome == 'success' && steps.stage.outcome == 'success' && steps.proof.outcome != 'skipped'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: generic-scope-component-v1-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/ngp-scope-public-v1/reports/status.json

          ${{ runner.temp }}/ngp-scope-public-v1/reports/result-summary.json

          ${{ runner.temp }}/ngp-scope-public-v1/reports/frames-summary.json

          ${{ runner.temp }}/ngp-scope-public-v1/reports/commands-summary.json

          ${{ runner.temp }}/ngp-scope-public-v1/reports/diagnostics.txt'
        if-no-files-found: error
        retention-days: 1
        compression-level: 6
        include-hidden-files: false
        archive: true
    - id: final
      name: Require proof and selected report upload success
      if: always()
      shell: bash
      run: 'set -euo pipefail

        test ''${{ steps.proof.outcome }}'' = ''success''

        test ''${{ steps.upload.outcome }}'' = ''success''

        '
