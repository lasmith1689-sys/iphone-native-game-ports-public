    - name: Inspect production closure and real version4 dyld exports
      id: inspect
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),58405)\nassert len(raw)==58404\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='884dce23faa393112d7877015863f2eebe07fcb8c195cea4a46a55111a81229b'\n\
        try:exec(compile(raw,'<owned-gl-composition-v1-inspect>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-stack-borrow-v1b').absolute()\n\
        \ if root.is_dir() and not root.is_symlink():\n  output=root/'runner-program-inspect.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
