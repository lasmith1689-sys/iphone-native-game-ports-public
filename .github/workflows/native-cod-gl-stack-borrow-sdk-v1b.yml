    - name: Upload diagnostic raw closure, never installable
      id: raw_upload
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: cod-gl-abi11b-raw-${{ github.run_id }}-${{ github.run_attempt }}
        path: .work/cod-gl-stack-borrow-v1b-raw/
        retention-days: 1
        if-no-files-found: error
        include-hidden-files: true
        compression-level: 6
