name: Own GL stack and uncertain borrow SDK syntax/link diagnostic
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/native-cod-gl-stack-borrow-sdk-v1b-20261104
    paths:
    - .github/workflows/native-cod-gl-stack-borrow-sdk-v1b.yml
permissions:
  contents: read
concurrency:
  group: native-cod-gl-stack-borrow-sdk-v1
  cancel-in-progress: false
jobs:
  cod-gl-stack-borrow-v1b:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private
      == false && github.ref == 'refs/heads/codex/native-cod-gl-stack-borrow-sdk-v1b-20261104'
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
    - name: Pin matching public GL4ES and in-place Apple SDK
      id: prepare
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),21181)\nassert len(raw)==21180\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='44850655ff41ad4a1b68232ea274f4206b73474f19c7b30a3b0c32fef91606cb'\n\
        try:exec(compile(raw,'<owned-gl-composition-v1-prepare>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-stack-borrow-v1b').absolute()\n\
        \ if root.is_dir() and not root.is_symlink():\n  output=root/'runner-program-prepare.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
        PY\n"
    - name: Materialize version4 header_sources
      id: header_sources
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),8510)\nassert len(raw)==8509\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='24a8bcb327af140dc51720e46a090033f70e328e70f62ee885710b1b20351bef'\n\
        try:exec(compile(raw,'<owned-gl-composition-v1-header_sources>','exec'),{'__name__':'__main__'})\nfinally:\n\
        \ root=pathlib.Path('.work/cod-gl-stack-borrow-v1b').absolute()\n if root.is_dir() and not root.is_symlink():\n\
        \  output=root/'runner-program-header_sources.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
        PY\n"
    - name: Materialize version4 dispatch_source
      id: dispatch_source
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),10538)\nassert len(raw)==10537\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='c6b12ab5943a064136982a76135090aeb9bead634dc61297ad9e679ffa5749b9'\n\
        try:exec(compile(raw,'<owned-gl-composition-v1-dispatch_source>','exec'),{'__name__':'__main__'})\nfinally:\n\
