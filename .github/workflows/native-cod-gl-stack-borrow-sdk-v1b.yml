        try:exec(compile(raw,'<owned-gl-composition-v1-build>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-stack-borrow-v1b').absolute()\n\
        \ if root.is_dir() and not root.is_symlink():\n  output=root/'runner-program-build.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
