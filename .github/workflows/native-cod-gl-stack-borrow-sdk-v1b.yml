      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),45352)\nassert len(raw)==45351\
