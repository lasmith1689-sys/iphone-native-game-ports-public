name: Own power lease v1d SDK and native C diagnostic
permissions: {}
concurrency:
  group: own-power-lease-v1d
  cancel-in-progress: false
'on':
  push:
    branches:
    - codex/native-power-lease-v1d-20261031
    paths:
    - .github/workflows/native-power-lease-v1d.yml
  workflow_dispatch: {}
jobs:
  probe:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-power-lease-v1d-20261031' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
    - id: guard
      name: Require exact dedicated public source context
      shell: bash
      run: 'set -euo pipefail

        python3 -B - <<''PY''

        import json,os,re,stat

        from pathlib import Path

        assert os.environ[''GITHUB_REPOSITORY'']==''lasmith1689-sys/iphone-native-game-ports-public'' and os.environ[''GITHUB_REF'']==''refs/heads/codex/native-power-lease-v1d-20261031''

        assert re.fullmatch(''[0-9a-f]{40}'',os.environ[''GITHUB_SHA''])

        event=Path(os.environ[''GITHUB_EVENT_PATH'']);st=event.lstat();assert stat.S_ISREG(st.st_mode) and not event.is_symlink() and st.st_size<=262144

        d=json.loads(event.read_bytes());assert d[''repository''][''full_name'']==''lasmith1689-sys/iphone-native-game-ports-public'' and d[''repository''][''private''] is False

        assert os.environ[''GITHUB_EVENT_NAME''] in (''push'',''workflow_dispatch'')

        if os.environ[''GITHUB_EVENT_NAME'']==''push'':assert d[''ref'']==os.environ[''GITHUB_REF''] and d[''after'']==os.environ[''GITHUB_SHA''] and d.get(''deleted'',False) is False

        else:assert d.get(''inputs'') in (None,{})

        PY

        '
    - id: stage0
      name: Materialize exact own source group 1
      shell: bash
      run: "set -euo pipefail\npython3 -B - <<'PY'\nimport ast,base64,hashlib,os,zlib\nfrom pathlib import Path,PurePosixPath\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'native-power-lease-v1d';source=base/'source';assert not base.exists();base.mkdir(mode=0o700);source.mkdir(mode=0o700)\npayload={'power_parse.py': '',\
        \ 'power_policy.py': '',\
        \ 'native/aot/platform_init/v1/platform_init_v1.h': '',\
        \ 'native/platform/cod-gl-ios/input-v3-bind-v3/cod_uikit_input_v3.h': '',\
        \ 'source/native_worker_checkpoint.h': ''}\nidentities={'power_parse.py': {'bytes': 16260, 'sha256': '6cf9567cd4615f5fb1870555d106f31dd0113a5822fb4ce41e079dfab9ad69f3'}, 'power_policy.py': {'bytes': 3566, 'sha256': 'eac0d06add7bf0df0a1e6d73c0d6e110c55bd4bc0b99ff1786fdd1ea1980e81d'}, 'native/aot/platform_init/v1/platform_init_v1.h': {'bytes': 3438, 'sha256': 'f8cd0b0386afe74254594259855381ce537a8e18a1f9b9ab0017029b518b60ae'}, 'native/platform/cod-gl-ios/input-v3-bind-v3/cod_uikit_input_v3.h':\
        \ {'bytes': 1831, 'sha256': '7cbb097906666c249eada88817fd7a55da55d4d19b7675c26f7fcac4f2f504d0'}, 'source/native_worker_checkpoint.h': {'bytes': 725, 'sha256': 'c56cc2473c08ab125e316a3d888e84d00e41c6c5f27842bd6b4e4520fbabb4e0'}}\nassert set(payload)==set(identities)\nfor name,text in payload.items():\n path=PurePosixPath(name);assert not path.is_absolute() and '..' not in path.parts and ':' not in name and chr(92) not in name\n decoder=zlib.decompressobj();body=decoder.decompress(base64.b64decode(text,validate=True),65537);assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail and len(body)<=65536\n assert len(body)==identities[name]['bytes'] and hashlib.sha256(body).hexdigest()==identities[name]['sha256']\n if name.endswith('.py'):ast.parse(body)\n target=source.joinpath(*path.parts);assert not target.exists();target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(body)\nPY\n"
    - id: stage1
      name: Materialize exact own source group 2
      shell: bash
      run: "set -euo pipefail\npython3 -B - <<'PY'\nimport ast,base64,hashlib,os,zlib\nfrom pathlib import Path,PurePosixPath\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'native-power-lease-v1d';source=base/'source';assert base.is_dir() and source.is_dir()\npayload={'run_power.py': '',\
        \ 'source/ngp_power_core_v1.c': '',\
        \ 'bounded_process.py': '',\
        \ 'source/ngp_power_lease_v1.h': '',\
        \ 'power_protocol.py': '', 'native/platform/cod-gl-ios/input-v3-bind-v3/cod_input_queue_v2.h': ''}\n\
        identities={'run_power.py': {'bytes': 12947, 'sha256': '4b604de86d3ce16005e6bfa9e067aa0e14e6c552dbaa5528f49121143032833f'}, 'source/ngp_power_core_v1.c': {'bytes': 9299, 'sha256': 'c7dc5312f6358d705973eee20fe1a206dc05edc71e12465434b5e3e9084f5439'}, 'bounded_process.py': {'bytes': 3293, 'sha256': 'ce89924f280c180fe0ca9e6d68c45c4174bd5fe37d0aa93d94b0222d9b5c366a'}, 'source/ngp_power_lease_v1.h': {'bytes': 2141, 'sha256': 'c2af3409c22ef1c425fc259f80f303266e154bb66225f592b84f0768d2363dbd'}, 'power_protocol.py': {'bytes': 1003, 'sha256': '0e34dbad227bb259fa245c1d879f0d91fb38cb12ded86235e70cf89b0878429a'}, 'native/platform/cod-gl-ios/input-v3-bind-v3/cod_input_queue_v2.h': {'bytes': 898, 'sha256': '5db009917ace7802c60294a418d4e39c36bcbbf594cbf637986125d7df61b88b'}}\nassert set(payload)==set(identities)\nfor name,text in payload.items():\n path=PurePosixPath(name);assert not path.is_absolute() and '..' not in path.parts and ':' not in name and chr(92) not in name\n decoder=zlib.decompressobj();body=decoder.decompress(base64.b64decode(text,validate=True),65537);assert\
        \ decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail and len(body)<=65536\n assert len(body)==identities[name]['bytes'] and hashlib.sha256(body).hexdigest()==identities[name]['sha256']\n if name.endswith('.py'):ast.parse(body)\n target=source.joinpath(*path.parts);assert not target.exists();target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(body)\nPY\n"
    - id: stage2
      name: Materialize exact own source group 3
      shell: bash
      run: "set -euo pipefail\npython3 -B - <<'PY'\nimport ast,base64,hashlib,os,zlib\nfrom pathlib import Path,PurePosixPath\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'native-power-lease-v1d';source=base/'source';assert base.is_dir() and source.is_dir()\npayload={'power_metadata.py': '',\
        \ 'source/ngp_power_uikit_v1.m': '',\
        \ 'fixture/test_power_core_v1.c': '',\
        \ 'upload_guard.py': '',\
        \ 'native/platform/cod-gl-ios/input-v1/cod_input_queue_v1.h': '',\
        \ 'source/native_worker_checkpoint.c': '', 'source/ngp_power_core_private_v1.h': ''}\n\
        identities={'power_metadata.py': {'bytes': 8828, 'sha256': '38fa4bd9a0037ec682e6cdd51eaf9015fffadb9dff44f553b5b550790cd6eb79'}, 'source/ngp_power_uikit_v1.m': {'bytes': 6596, 'sha256': '63bdb8c71f261f52999bb19154175db54edac7a39d4cbf8c773dae9f5879082f'}, 'fixture/test_power_core_v1.c': {'bytes': 5240, 'sha256': '4b47dc85daf199b1e8e7f0bd1753a215a4393bffeadcf068417ae551c20d750e'}, 'upload_guard.py': {'bytes': 3024, 'sha256': 'b520dd7698dae280152030b0006b31e2d070f7e8bac700a3f61ede6146a85256'}, 'native/platform/cod-gl-ios/input-v1/cod_input_queue_v1.h': {'bytes': 1938, 'sha256': '29547c1f4172dd105ab211192a86a0845c97328a9cc9c162434175749580c5fd'}, 'source/native_worker_checkpoint.c': {'bytes': 922, 'sha256': '0b03a4539ee3da31978421a4df231f41fb0f811b162ec7d81cfc0ea3c1ee72d0'}, 'source/ngp_power_core_private_v1.h': {'bytes': 659, 'sha256': '8fb1c3b7c7c44f61222c2007f57563b81004441528b8208d6273a5d01ffb4073'}}\nassert set(payload)==set(identities)\nfor name,text in payload.items():\n path=PurePosixPath(name);assert\
        \ not path.is_absolute() and '..' not in path.parts and ':' not in name and chr(92) not in name\n decoder=zlib.decompressobj();body=decoder.decompress(base64.b64decode(text,validate=True),65537);assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail and len(body)<=65536\n assert len(body)==identities[name]['bytes'] and hashlib.sha256(body).hexdigest()==identities[name]['sha256']\n if name.endswith('.py'):ast.parse(body)\n target=source.joinpath(*path.parts);assert not target.exists();target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(body)\nPY\n"
    - id: build
      name: Compile own device library and run bounded own Mac C fixture
      shell: bash
      run: "set -euo pipefail\npython3 -B - <<'PY'\nimport hashlib,json,os,stat,subprocess,sys\nfrom pathlib import Path\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'native-power-lease-v1d';source=base/'source';identities={'bounded_process.py': {'bytes': 3293, 'sha256': 'ce89924f280c180fe0ca9e6d68c45c4174bd5fe37d0aa93d94b0222d9b5c366a'}, 'fixture/test_power_core_v1.c': {'bytes': 5240, 'sha256': '4b47dc85daf199b1e8e7f0bd1753a215a4393bffeadcf068417ae551c20d750e'}, 'native/aot/platform_init/v1/platform_init_v1.h': {'bytes': 3438, 'sha256': 'f8cd0b0386afe74254594259855381ce537a8e18a1f9b9ab0017029b518b60ae'}, 'native/platform/cod-gl-ios/input-v1/cod_input_queue_v1.h': {'bytes': 1938, 'sha256': '29547c1f4172dd105ab211192a86a0845c97328a9cc9c162434175749580c5fd'}, 'native/platform/cod-gl-ios/input-v3-bind-v3/cod_input_queue_v2.h': {'bytes': 898, 'sha256': '5db009917ace7802c60294a418d4e39c36bcbbf594cbf637986125d7df61b88b'}, 'native/platform/cod-gl-ios/input-v3-bind-v3/cod_uikit_input_v3.h': {'bytes':\
        \ 1831, 'sha256': '7cbb097906666c249eada88817fd7a55da55d4d19b7675c26f7fcac4f2f504d0'}, 'power_metadata.py': {'bytes': 8828, 'sha256': '38fa4bd9a0037ec682e6cdd51eaf9015fffadb9dff44f553b5b550790cd6eb79'}, 'power_parse.py': {'bytes': 16260, 'sha256': '6cf9567cd4615f5fb1870555d106f31dd0113a5822fb4ce41e079dfab9ad69f3'}, 'power_policy.py': {'bytes': 3566, 'sha256': 'eac0d06add7bf0df0a1e6d73c0d6e110c55bd4bc0b99ff1786fdd1ea1980e81d'}, 'power_protocol.py': {'bytes': 1003, 'sha256': '0e34dbad227bb259fa245c1d879f0d91fb38cb12ded86235e70cf89b0878429a'}, 'run_power.py': {'bytes': 12947, 'sha256': '4b604de86d3ce16005e6bfa9e067aa0e14e6c552dbaa5528f49121143032833f'}, 'source/native_worker_checkpoint.c': {'bytes': 922, 'sha256': '0b03a4539ee3da31978421a4df231f41fb0f811b162ec7d81cfc0ea3c1ee72d0'}, 'source/native_worker_checkpoint.h': {'bytes': 725, 'sha256': 'c56cc2473c08ab125e316a3d888e84d00e41c6c5f27842bd6b4e4520fbabb4e0'}, 'source/ngp_power_core_private_v1.h': {'bytes': 659, 'sha256': '8fb1c3b7c7c44f61222c2007f57563b81004441528b8208d6273a5d01ffb4073'},\
        \ 'source/ngp_power_core_v1.c': {'bytes': 9299, 'sha256': 'c7dc5312f6358d705973eee20fe1a206dc05edc71e12465434b5e3e9084f5439'}, 'source/ngp_power_lease_v1.h': {'bytes': 2141, 'sha256': 'c2af3409c22ef1c425fc259f80f303266e154bb66225f592b84f0768d2363dbd'}, 'source/ngp_power_uikit_v1.m': {'bytes': 6596, 'sha256': '63bdb8c71f261f52999bb19154175db54edac7a39d4cbf8c773dae9f5879082f'}, 'upload_guard.py': {'bytes': 3024, 'sha256': 'b520dd7698dae280152030b0006b31e2d070f7e8bac700a3f61ede6146a85256'}}\nassert {x.relative_to(source).as_posix() for x in source.rglob('*') if x.is_file()}==set(identities)\nfor name,pin in identities.items():\n path=source/name;st=path.lstat();assert stat.S_ISREG(st.st_mode) and not path.is_symlink() and st.st_nlink==1\n b=path.read_bytes();assert len(b)==pin['bytes'] and hashlib.sha256(b).hexdigest()==pin['sha256']\nenv=dict(os.environ,NGP_POWER_SOURCE_IDS=json.dumps(identities,sort_keys=True),PYTHONDONTWRITEBYTECODE='1')\nresult=subprocess.run([sys.executable,'-B',str(source/'run_power.py'),'--output',str(base/'out')],env=env,timeout=540)\n\
        raise SystemExit(result.returncode)\nPY\n"
    - id: retention
      name: Verify fixed own archive/context/source/member whitelist
      if: always() && steps.stage2.outcome == 'success'
      shell: bash
      run: "set -euo pipefail\npython3 -B - <<'PY'\nimport hashlib,json,os,sys\nfrom pathlib import Path\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'native-power-lease-v1d';source=base/'source';identities={'bounded_process.py': {'bytes': 3293, 'sha256': 'ce89924f280c180fe0ca9e6d68c45c4174bd5fe37d0aa93d94b0222d9b5c366a'}, 'fixture/test_power_core_v1.c': {'bytes': 5240, 'sha256': '4b47dc85daf199b1e8e7f0bd1753a215a4393bffeadcf068417ae551c20d750e'}, 'native/aot/platform_init/v1/platform_init_v1.h': {'bytes': 3438, 'sha256': 'f8cd0b0386afe74254594259855381ce537a8e18a1f9b9ab0017029b518b60ae'}, 'native/platform/cod-gl-ios/input-v1/cod_input_queue_v1.h': {'bytes': 1938, 'sha256': '29547c1f4172dd105ab211192a86a0845c97328a9cc9c162434175749580c5fd'}, 'native/platform/cod-gl-ios/input-v3-bind-v3/cod_input_queue_v2.h': {'bytes': 898, 'sha256': '5db009917ace7802c60294a418d4e39c36bcbbf594cbf637986125d7df61b88b'}, 'native/platform/cod-gl-ios/input-v3-bind-v3/cod_uikit_input_v3.h': {'bytes': 1831, 'sha256':\
        \ '7cbb097906666c249eada88817fd7a55da55d4d19b7675c26f7fcac4f2f504d0'}, 'power_metadata.py': {'bytes': 8828, 'sha256': '38fa4bd9a0037ec682e6cdd51eaf9015fffadb9dff44f553b5b550790cd6eb79'}, 'power_parse.py': {'bytes': 16260, 'sha256': '6cf9567cd4615f5fb1870555d106f31dd0113a5822fb4ce41e079dfab9ad69f3'}, 'power_policy.py': {'bytes': 3566, 'sha256': 'eac0d06add7bf0df0a1e6d73c0d6e110c55bd4bc0b99ff1786fdd1ea1980e81d'}, 'power_protocol.py': {'bytes': 1003, 'sha256': '0e34dbad227bb259fa245c1d879f0d91fb38cb12ded86235e70cf89b0878429a'}, 'run_power.py': {'bytes': 12947, 'sha256': '4b604de86d3ce16005e6bfa9e067aa0e14e6c552dbaa5528f49121143032833f'}, 'source/native_worker_checkpoint.c': {'bytes': 922, 'sha256': '0b03a4539ee3da31978421a4df231f41fb0f811b162ec7d81cfc0ea3c1ee72d0'}, 'source/native_worker_checkpoint.h': {'bytes': 725, 'sha256': 'c56cc2473c08ab125e316a3d888e84d00e41c6c5f27842bd6b4e4520fbabb4e0'}, 'source/ngp_power_core_private_v1.h': {'bytes': 659, 'sha256': '8fb1c3b7c7c44f61222c2007f57563b81004441528b8208d6273a5d01ffb4073'},\
        \ 'source/ngp_power_core_v1.c': {'bytes': 9299, 'sha256': 'c7dc5312f6358d705973eee20fe1a206dc05edc71e12465434b5e3e9084f5439'}, 'source/ngp_power_lease_v1.h': {'bytes': 2141, 'sha256': 'c2af3409c22ef1c425fc259f80f303266e154bb66225f592b84f0768d2363dbd'}, 'source/ngp_power_uikit_v1.m': {'bytes': 6596, 'sha256': '63bdb8c71f261f52999bb19154175db54edac7a39d4cbf8c773dae9f5879082f'}, 'upload_guard.py': {'bytes': 3024, 'sha256': 'b520dd7698dae280152030b0006b31e2d070f7e8bac700a3f61ede6146a85256'}}\nfor name,pin in identities.items():\n b=(source/name).read_bytes();assert len(b)==pin['bytes'] and hashlib.sha256(b).hexdigest()==pin['sha256']\nsys.path.insert(0,str(source));from upload_guard import verify\ncontext={k:os.environ[k] for k in ('GITHUB_REPOSITORY','GITHUB_REF','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT')};context['purpose']='native-power-lease-v1d-20261031-1'\nr=verify(base/'out',identities,context);print(json.dumps(dict(memberCount=r['memberCount'],complete=r['complete'])))\n\
        PY\n"
    - id: upload
      name: Retain two exact reviewed diagnostic paths
      if: always() && steps.retention.outcome == 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: own-power-lease-v1d-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/native-power-lease-v1d/out/artifact.zip

          ${{ runner.temp }}/native-power-lease-v1d/out/upload-manifest.json'
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
        include-hidden-files: false
    - id: final
      name: Require both phases and exact retention
      if: always()
      shell: bash
      run: 'set -euo pipefail

        test ''${{ steps.build.outcome }}'' = ''success''

        test ''${{ steps.retention.outcome }}'' = ''success''

        test ''${{ steps.upload.outcome }}'' = ''success''

        '
