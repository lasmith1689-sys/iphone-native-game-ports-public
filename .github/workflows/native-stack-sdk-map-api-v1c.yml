name: Generic native stack public SDK map API capability
'on':
  push:
    branches:
    - codex/native-stack-sdk-map-api-v1c-20261029
    paths:
    - .github/workflows/native-stack-sdk-map-api-v1c.yml
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: generic-stack-map-api-v1c
  cancel-in-progress: false
jobs:
  api-capability:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-stack-sdk-map-api-v1c-20261029' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
    - id: guard
      name: Require exact public context
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import json,os,re

        from pathlib import Path

        assert os.environ[''GITHUB_REPOSITORY'']==''lasmith1689-sys/iphone-native-game-ports-public'' and os.environ[''GITHUB_REF'']==''refs/heads/codex/native-stack-sdk-map-api-v1c-20261029''

        kind=os.environ[''GITHUB_EVENT_NAME''];assert kind in (''push'',''workflow_dispatch'')

        assert re.fullmatch(''[a-f0-9]{40}'',os.environ[''GITHUB_SHA''])

        event=json.loads(Path(os.environ[''GITHUB_EVENT_PATH'']).read_bytes())

        assert event[''repository''][''full_name'']==''lasmith1689-sys/iphone-native-game-ports-public'' and event[''repository''][''private''] is False

        if kind==''push'':assert event[''ref'']==''refs/heads/codex/native-stack-sdk-map-api-v1c-20261029'' and event[''after'']==os.environ[''GITHUB_SHA''] and event.get(''deleted'',False) is False

        else:assert event.get(''inputs'') in (None,{})

        print(''Exact public SDK API capability context accepted.'')

        PY

        '
    - id: stage
      name: Stage exact own SDK API candidate
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,os,zlib\nfrom pathlib import Path\npayload={'ngp_native_stack_v1.h': '',\
        \ 'ngp_native_stack_sp_v1.h': '', 'ngp_native_stack_platform_v1.c': '',\
        \ 'run_apple.py': '',\
        \ 'baseline_platform.c': ''};identities={'ngp_native_stack_v1.h':\
        \ {'bytes': 1968, 'sha256': '5f6484557ec01d79ed700fa8ebecfcfc2bd7ae5de52271717afce36db87776ad'}, 'ngp_native_stack_sp_v1.h': {'bytes': 529, 'sha256': 'e47630d1b2656c36be9ea085961fa2acbf749b134533f57e4a14363eaa5c04cf'}, 'ngp_native_stack_platform_v1.c': {'bytes': 5931, 'sha256': 'f8ed39ea1f651a4b03738e8394f0e11f276524b4a9aa3ec114081b6c5f924940'}, 'run_apple.py': {'bytes': 19874, 'sha256': '22e0173436639975526b03f6bccdfe1a6241ab0462c6e4632c07b4e7d28ff715'}, 'baseline_platform.c': {'bytes': 5361, 'sha256': 'ab1b834f1ceac8b1dc8174e585b99977ed0a0086ef682c3e7f8a683eec0ff24b'}}\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'ngp-stack-api-v1c';assert not base.exists();base.mkdir(mode=0o700)\nsource=base/'source';source.mkdir(mode=0o700)\nassert set(payload)==set(identities) and len(payload)==5\nfor name,encoded in payload.items():\n assert '/' not in name and '\\\\' not in name and name not in ('.','..')\n decoder=zlib.decompressobj();raw=decoder.decompress(base64.b64decode(encoded,validate=True),65537)\n\
        \ assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail and len(raw)<=65536\n assert len(raw)==identities[name]['bytes'] and hashlib.sha256(raw).hexdigest()==identities[name]['sha256']\n (source/name).write_bytes(raw)\nprint('Five exact own-source/API-check files staged.')\nPY\n"
    - id: probe
      name: Compile public APIs and compare Mac code only
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nfrom pathlib import Path\nimport hashlib,importlib.util,json,os,platform,subprocess,sys\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'ngp-stack-api-v1c';source=base/'source';build=base/'build';reports=base/'reports'\nbuild.mkdir(mode=0o700);reports.mkdir(mode=0o700)\nidentities={'ngp_native_stack_v1.h': {'bytes': 1968, 'sha256': '5f6484557ec01d79ed700fa8ebecfcfc2bd7ae5de52271717afce36db87776ad'}, 'ngp_native_stack_sp_v1.h': {'bytes': 529, 'sha256': 'e47630d1b2656c36be9ea085961fa2acbf749b134533f57e4a14363eaa5c04cf'}, 'ngp_native_stack_platform_v1.c': {'bytes': 5931, 'sha256': 'f8ed39ea1f651a4b03738e8394f0e11f276524b4a9aa3ec114081b6c5f924940'}, 'run_apple.py': {'bytes': 19874, 'sha256': '22e0173436639975526b03f6bccdfe1a6241ab0462c6e4632c07b4e7d28ff715'}, 'baseline_platform.c': {'bytes': 5361, 'sha256': 'ab1b834f1ceac8b1dc8174e585b99977ed0a0086ef682c3e7f8a683eec0ff24b'}};result={};commands=[];failure='';passed=False\nenv={'PATH':'/usr/bin:/bin:/usr/sbin:/sbin','HOME':str(base),'TMPDIR':str(base)+'/',\
        \ 'LANG':'C','LC_ALL':'C'}\nfor name in ('status.json', 'capability.json', 'diagnostics.txt'):(reports/name).write_text('' if name.endswith('.txt') else '{}\\n')\ndef run(label,argv):\n try:p=subprocess.run(list(map(str,argv)),env=env,capture_output=True,timeout=90)\n except subprocess.TimeoutExpired as e:\n  (build/(label+'.stderr')).write_bytes((e.stderr or b'')[-8192:]);commands.append({'label':label,'timeout':True});raise\n (build/(label+'.stdout')).write_bytes(p.stdout);(build/(label+'.stderr')).write_bytes(p.stderr)\n commands.append({'label':label,'returncode':p.returncode});assert p.returncode==0,(label,p.returncode)\n return p.stdout\ntry:\n assert platform.system()=='Darwin' and platform.machine()=='arm64','Actual native ARM64 Mac required for SDK capability compile'\n assert {p.name for p in source.iterdir()}==set(identities)\n for name,wanted in identities.items():\n  p=source/name;assert p.is_file() and not p.is_symlink();raw=p.read_bytes();assert len(raw)==wanted['bytes']\
        \ and hashlib.sha256(raw).hexdigest()==wanted['sha256']\n spec=importlib.util.spec_from_file_location('own_stack_recipe',source/'run_apple.py');recipe=importlib.util.module_from_spec(spec);spec.loader.exec_module(recipe)\n assert run('arm64-capability',['/usr/sbin/sysctl','-n','hw.optional.arm64']).strip()==b'1'\n translated=subprocess.run(['/usr/sbin/sysctl','-n','sysctl.proc_translated'],env=env,capture_output=True,timeout=10)\n assert translated.returncode in (0,1) and translated.stdout.strip() in (b'',b'0')\n for target,sdk,triple,plat,minimum in [('mac','macosx','arm64-apple-macos15.0',1,0xf0000),('iphone','iphoneos','arm64-apple-ios26.0',2,0x1a0000)]:\n  clang=Path(run(target+'-clang',['/usr/bin/xcrun','--sdk',sdk,'--find','clang']).decode().strip())\n  sdkpath=Path(run(target+'-sdk',['/usr/bin/xcrun','--sdk',sdk,'--show-sdk-path']).decode().strip())\n  version=run(target+'-sdk-version',['/usr/bin/xcrun','--sdk',sdk,'--show-sdk-version']).decode().strip()\n  if target=='iphone':assert\
        \ int(version.split('.')[0])>=27\n  compiler_version=run(target+'-clang-version',[clang,'--version']).decode()\n  flags=['-target',triple,'-isysroot',str(sdkpath),'-std=c11','-O0','-g0','-Wall','-Wextra','-Werror','-Werror=implicit-function-declaration','-fno-inline','-fno-lto','-fno-optimize-sibling-calls','-fstack-usage','-fvisibility=hidden','-DNGP_STACK_SHARED','-I'+str(source)]\n  obj=build/(target+'-candidate.o');run(target+'-candidate-compile',[clang,*flags,'-c',source/'ngp_native_stack_platform_v1.c','-o',obj])\n  meta=recipe.macho(obj,1,plat,minimum);frames=recipe.stack_rows(obj.with_suffix('.su'))\n  record={'compilerSha256':hashlib.sha256(clang.read_bytes()).hexdigest(),'compilerVersion':compiler_version,'sdkVersion':version,'target':triple,'flags':flags,'objectSha256':meta['sha256'],'objectCodeHashes':meta['code'],'frames':frames,'imports':meta['imports']}\n  if target=='mac':\n   baseline=build/'mac-baseline.o';run('mac-baseline-compile',[clang,*flags,'-c',source/'baseline_platform.c','-o',baseline])\n\
        \   oldmeta=recipe.macho(baseline,1,1,minimum);assert oldmeta['code']==meta['code'] and recipe.stack_rows(baseline.with_suffix('.su'))==frames\n   assert '_mach_vm_region' in meta['imports'] and '_vm_region_64' not in meta['imports']\n   record['MacCodeAndFrameByteHashEquivalentToV1b']=True\n  else:\n   assert '_vm_region_64' in meta['imports'] and '_mach_vm_region' not in meta['imports']\n   lib=build/'libown-stack-map-api.dylib';run('iphone-api-link',[clang,'-target',triple,'-isysroot',sdkpath,'-dynamiclib','-fno-lto','-Wl,-no_adhoc_codesign','-Wl,-install_name,@rpath/libown-stack-map-api.dylib',obj,'-o',lib])\n   linked=recipe.macho(lib,6,2,minimum,unsigned=True);assert set(linked['exports'])=={'_ngp_stack_v1_query_current'}\n   assert '_vm_region_64' in linked['imports'] and '_mach_vm_region' not in linked['imports']\n   record['unsignedLibrary']={k:linked[k] for k in ('filetype','platform','dependencies','uuid','signatures','encryption64','exports','imports','sha256','bytes')}\n\
        \   record['publicSDKDeclarationsAndPointerWidthAssertionsCompiled']=True\n  result[target]=record\n passed=True\nexcept Exception as exc:failure=type(exc).__name__+': '+str(exc)[:1024]\ndiagnostics=[];remaining=49152\nfor path in sorted(build.glob('*.stderr')):\n if path.stat().st_size:\n  raw=path.read_bytes()[-min(8192,remaining):];diagnostics.append('=== '+path.name+' ===\\n'+raw.decode(errors='replace'));remaining-=len(raw)\n  if remaining<=0:break\nif failure:diagnostics.append(failure)\n(reports/'diagnostics.txt').write_text('\\n'.join(diagnostics))\n(reports/'capability.json').write_text(json.dumps({'targets':result,'commands':commands,'sourceFiles':identities,'nativeCodeExecuted':False,'iPhoneRuntimeUnproved':True},indent=2)+'\\n')\nstatus={'status':'passed' if passed else 'failed','failure':failure,'scope':'installed-public-SDK-API-compile-and-link-only','nativeCodeExecuted':False,'physicalIPhoneTest':False}\n(reports/'status.json').write_text(json.dumps(status,indent=2)+'\\\
        n')\nassert {p.name for p in reports.iterdir()}==set(('status.json', 'capability.json', 'diagnostics.txt')) and all(p.stat().st_size<=131072 for p in reports.iterdir())\nprint(json.dumps(status));raise SystemExit(0 if passed else 1)\nPY\n"
    - id: upload
      name: Upload selected bounded reports only
      if: always() && steps.guard.outcome == 'success' && steps.stage.outcome == 'success' && steps.probe.outcome != 'skipped'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: generic-stack-map-api-v1c-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/ngp-stack-api-v1c/reports/status.json

          ${{ runner.temp }}/ngp-stack-api-v1c/reports/capability.json

          ${{ runner.temp }}/ngp-stack-api-v1c/reports/diagnostics.txt'
        if-no-files-found: error
        retention-days: 1
        compression-level: 6
        include-hidden-files: false
        archive: true
    - id: final
      name: Require compile and report success
      if: always()
      shell: bash
      run: 'set -euo pipefail

        test ''${{ steps.probe.outcome }}'' = ''success''

        test ''${{ steps.upload.outcome }}'' = ''success''

        '
