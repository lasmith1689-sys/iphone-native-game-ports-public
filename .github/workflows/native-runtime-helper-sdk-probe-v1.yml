name: Own synthetic runtime-helper SDK probe; no execution
permissions: {}
concurrency:
  group: own-runtime-helper-probe-v1
  cancel-in-progress: false
'on':
  push:
    branches:
    - codex/runtime-helper-sdk-probe-v1-20261031
    paths:
    - .github/workflows/native-runtime-helper-sdk-probe-v1.yml
  workflow_dispatch: {}
jobs:
  probe:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private == false && github.ref == 'refs/heads/codex/runtime-helper-sdk-probe-v1-20261031' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
    - id: guard
      name: Require exact dedicated public context
      shell: bash
      run: 'set -euo pipefail

        python3 -B - <<''PY''

        import json,os,re,stat

        from pathlib import Path

        assert os.environ[''GITHUB_REPOSITORY'']==''lasmith1689-sys/iphone-native-game-ports-public'' and os.environ[''GITHUB_REF'']==''refs/heads/codex/runtime-helper-sdk-probe-v1-20261031''

        assert re.fullmatch(''[0-9a-f]{40}'',os.environ[''GITHUB_SHA''])

        eventpath=Path(os.environ[''GITHUB_EVENT_PATH'']);st=eventpath.lstat();assert stat.S_ISREG(st.st_mode) and not eventpath.is_symlink() and st.st_size<=262144

        event=json.loads(eventpath.read_bytes());assert event[''repository''][''full_name'']==''lasmith1689-sys/iphone-native-game-ports-public'' and event[''repository''][''private''] is False

        kind=os.environ[''GITHUB_EVENT_NAME''];assert kind in (''push'',''workflow_dispatch'')

        if kind==''push'':assert event[''ref'']==''refs/heads/codex/runtime-helper-sdk-probe-v1-20261031'' and event[''after'']==os.environ[''GITHUB_SHA''] and event.get(''deleted'',False) is False

        else:assert event.get(''inputs'') in (None,{})

        print(''Exact dedicated own-source probe context accepted.'')

        PY

        '
    - id: stage
      name: Stage four exact self-authored sources
      shell: bash
      run: "set -euo pipefail\npython3 -B - <<'PY'\nimport ast,base64,hashlib,os,stat,zlib\nfrom pathlib import Path,PurePosixPath\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'native-runtime-helper-sdk-probe-v1';assert not base.exists();base.mkdir(mode=0o700);source=base/'source';source.mkdir(mode=0o700)\npayload={'helper_probe.c': '', 'probe_policy.py': '',\
        \ 'probe_parse.py': '',\
        \ 'run_probe.py': ''}\n\
        identities={'helper_probe.c': {'bytes': 781, 'sha256': '8c5dd9e7a1d51cab86366c4d87fb2b1d7d33c4b142b8824202565f536e324b2b'}, 'probe_policy.py': {'bytes': 1473, 'sha256': '14a8d33b03ec56a1435821e33b7000cc52905336b9908883f0044fcf2a3002f2'}, 'probe_parse.py': {'bytes': 13676, 'sha256': '15ea38f6de2402946ca1dc79d172f95ebd109bcedaec4add41988e5b1b73137f'}, 'run_probe.py': {'bytes': 13302, 'sha256': 'b9c52b4abf5a65c4cdd59da9d0c2f4de2ccabd7d2a38810d3a7b182717cba7e7'}}\nassert set(payload)==set(identities)==set(('helper_probe.c', 'probe_policy.py', 'probe_parse.py', 'run_probe.py'))\nfor name,text in payload.items():\n path=PurePosixPath(name);assert path.name==name and not path.is_absolute() and name not in ('','.','..') and ':' not in name and chr(92) not in name\n decoder=zlib.decompressobj();body=decoder.decompress(base64.b64decode(text,validate=True),65537);assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail and len(body)<=65536\n assert len(body)==identities[name]['bytes']\
        \ and hashlib.sha256(body).hexdigest()==identities[name]['sha256']\n if name.endswith('.py'):ast.parse(body)\n target=source/name;assert not target.exists();target.write_bytes(body)\nassert {x.name for x in source.iterdir()}==set(identities)\nfor name,wanted in identities.items():\n target=source/name;st=target.lstat();assert stat.S_ISREG(st.st_mode) and not target.is_symlink() and not getattr(st,'st_file_attributes',0)&1024 and st.st_nlink==1\n body=target.read_bytes();assert len(body)==wanted['bytes'] and hashlib.sha256(body).hexdigest()==wanted['sha256']\nprint('Four exact public-safe own-source files staged; no recovered or vendor payload.')\nPY\n"
    - id: build
      name: Compile and link own diagnostic; never execute probe
      shell: bash
      run: "set -euo pipefail\npython3 -B - <<'PY'\nimport hashlib,json,os,subprocess,sys\nfrom pathlib import Path\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'native-runtime-helper-sdk-probe-v1';source=base/'source';identities={'helper_probe.c': {'bytes': 781, 'sha256': '8c5dd9e7a1d51cab86366c4d87fb2b1d7d33c4b142b8824202565f536e324b2b'}, 'probe_policy.py': {'bytes': 1473, 'sha256': '14a8d33b03ec56a1435821e33b7000cc52905336b9908883f0044fcf2a3002f2'}, 'probe_parse.py': {'bytes': 13676, 'sha256': '15ea38f6de2402946ca1dc79d172f95ebd109bcedaec4add41988e5b1b73137f'}, 'run_probe.py': {'bytes': 13302, 'sha256': 'b9c52b4abf5a65c4cdd59da9d0c2f4de2ccabd7d2a38810d3a7b182717cba7e7'}}\nassert {x.name for x in source.iterdir()}==set(identities)\nfor name,wanted in identities.items():\n body=(source/name).read_bytes();assert len(body)==wanted['bytes'] and hashlib.sha256(body).hexdigest()==wanted['sha256']\nenv=dict(os.environ,NGP_PROBE_SOURCE_IDS=json.dumps(identities,sort_keys=True),PYTHONDONTWRITEBYTECODE='1')\n\
        result=subprocess.run([sys.executable,'-B',str(source/'run_probe.py'),'--output',str(base/'out')],env=env,timeout=540)\nraise SystemExit(result.returncode)\nPY\n"
    - id: upload
      name: Retain only bounded own diagnostic artifacts and metadata
      if: always() && steps.guard.outcome == 'success' && steps.stage.outcome == 'success' && steps.build.outcome != 'skipped'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: own-runtime-helper-probe-v1-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/probe.o

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/probe-repeat.o

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/probe.su

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/probe-repeat.su

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/libNgpRuntimeHelperProbeV1.dylib

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/summary.json

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/commands.json

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/tools.json

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/native-metadata.json

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/sdk-export-metadata.json

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/retention.json

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/host-arm64.stdout

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/host-arm64.stderr

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/host-translated.stdout

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/host-translated.stderr

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/developer.stdout

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/developer.stderr

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/sdk-path.stdout

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/sdk-path.stderr

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/sdk-version.stdout

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/sdk-version.stderr

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/find-clang.stdout

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/find-clang.stderr

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/find-nm.stdout

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/find-nm.stderr

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/compiler-version.stdout

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/compiler-version.stderr

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/driver.stdout

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/driver.stderr

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/compile.stdout

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/compile.stderr

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/repeat.stdout

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/repeat.stderr

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/link.stdout

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/link.stderr

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/nm-imports.stdout

          ${{ runner.temp }}/native-runtime-helper-sdk-probe-v1/out/artifact/logs/nm-imports.stderr'
        if-no-files-found: error
        retention-days: 1
        compression-level: 6
        include-hidden-files: false
        archive: true
    - id: final
      name: Require build and selected artifact retention
      if: always()
      shell: bash
      run: 'set -euo pipefail

        test ''${{ steps.build.outcome }}'' = ''success''

        test ''${{ steps.upload.outcome }}'' = ''success''

        '
