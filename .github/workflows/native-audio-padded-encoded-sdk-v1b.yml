b6d26fe7982fd66a0c467b17835d9b374ff5ef9fb5'}, 'ngp_wave_pcm_v1.c': {'bytes': 2380, 'sha256': '8cf23893a883b8708859bb433fac17e1995e1a007ee522a0a1ef3fda0edefcc9'}, 'ngp_wave_pcm_v1.h': {'bytes': 740, 'sha256': '2487b4b14b72cc99bad51dee2748c216babd06fa4979d84a37545a582da92c07'}, 'fixture_cases.h': {'bytes': 292, 'sha256': '650057650ca62d0c097c948021d58fdd7d34403407e292972a9d0618f5dbc13e'}, 'fixture_composed.c': {'bytes': 17796, 'sha256': 'e2a0f36a1d84cfd2be096d01a1ccd03c817a459e27e0d15b26fbff03c003fe45'}, 'fixture_fault.c': {'bytes': 5562, 'sha256': '56c2e9533f343d21fb567da60aa46120f7c97c4a40f1c627d22a2f0d6fc2c322'}, 'fixture_main.c': {'bytes': 11935, 'sha256': '940dfc3d2ac3a6d4a3a1d52b84e8943d3040c3cea62b799a0acd820e0e74eaa6'}, 'mono44100.mp3': {'bytes': 10031, 'sha256': '7f5d0343bd7011a1d73d790ad42ee2db7e34a3e01978b82c1269d608b2442542'}, 'stereo22050.mp3': {'bytes': 5224, 'sha256': '942070d4068191a50c72d692139b2478b48178fd944ee797daac965fff1ada00'}, 'stereo44100.mp3': {'bytes': 15046, 'sha256': '9a85978ed4c71b6f48d7311367e71f9f58717c008991a84ef21dc4b2e0545e97'}, 'test_fault.h': {'bytes': 682, 'sha256': 'a037148dfe205dc2d141c1d514836c30372d1f3590691950703ce71f76229dfe'}, 'test_fault_control.c': {'bytes': 2562, 'sha256': '3ad470703d977492c91a6074d72aa0210ea6b9f5864b97e80e0549becfa5b966'}, 'test_prefix.c': {'bytes': 186, 'sha256': 'aa991f33ef46bf9b65020ea9ed7748091445d2a48ce701e272e44c70b5b17dcf'}, 'test_shared.c': {'bytes': 288, 'sha256': '46b9bf502cfd66a9c2b83169dde3c603e169d082b5351d4d1c1a5329e8178de6'}, 'test_voice.c': {'bytes': 304, 'sha256': 'f4df06bf6b0378f6fed161b48c4964846a26487ea1643e46228c4bbb81c1c2ab'}, 'unsupported48000.mp3': {'bytes': 14976, 'sha256': '46fb00a21f9ba6f52ac8a86290bf8fc82d30e417616d99e607d1c1e2d02b42cd'}, 'wave16.wav': {'bytes': 65580, 'sha256': '1751892ad6b6c3ae824e0c3b0f6497bc9e8c69f9e60ecb37d3715084ca7b558c'}, 'wave8.wav': {'bytes': 8262, 'sha256': 'dfe6ec48f2ffb6655cc4c12a0e41c329ccf36aedefc9c40f4276163232e8357a'}, 'run_sdk.py': {'bytes': 16594, 'sha256': '4c91b88cdcbf968b06caca3cc1c9fca14506700eb1be5bad1272f5925d1f15c6'}, 'common.py': {'bytes': 2408, 'sha256': '99226b07ff0706ce9eeb763feaa6c4b1edd1858551c3f1ebc2b86a481479e1cd'}, 'bounded_process.py': {'bytes': 5157, 'sha256': 'c169f87e017f01565821f84a204e3a4f53ab88ee37833fa5aa7ff898e56434d2'}, 'image_checks.py': {'bytes': 4871, 'sha256': 'd7219b05fe4c7e9f4eeaf6c0ed582f2b58e7ca03d69f28cb3864adb330289a25'}, 'inspect_image.py': {'bytes': 3901, 'sha256': '408e13fcb27838d5eea161491eb538e2a91cdd5ccecf84416191390d712efa52'}, 'retain.py': {'bytes': 2969, 'sha256': '38d2b0270543a6c3a9a9ccfe786542372231a18bfca96d7c6cfc3c0cc2f74e62'}, 'README.md': {'bytes': 890, 'sha256': 'dab4b7034494c1a7fa6c386797ad64092f80b1c2f9acfa312cb63b782a11c5fe'}, 'expected_outcomes.json': {'bytes': 755, 'sha256': '3ec72ec74a7bfd82694d9621576f541a3857e7f9460ad019b743a585f55ae1c2'}, 'manifest.json': {'bytes': 8128, 'sha256': 'bcfe4f56d6f9ff86ac908695adcc8da611ddd84bba6feb9fbc0bdaa6f3ff293a'}};started=time.monotonic();total=0
        for name,w in manifest.items():
         assert name==pathlib.PurePosixPath(name).name and w['bytes']<1024*1024
         remain=180-(time.monotonic()-started);assert remain>0
         with urllib.request.urlopen('https://raw.githubusercontent.com/lasmith1689-sys/iphone-native-game-ports-public/'+sha+'/native/platform/native-audio-padded-encoded-sdk-v1b-20261106/'+name,timeout=min(30,remain)) as response:b=response.read(w['bytes']+1)
         assert len(b)==w['bytes'] and hashlib.sha256(b).hexdigest()==w['sha256'];total+=len(b);assert total<1024*1024
         (source/name).write_bytes(b)
        (root/'reviewed-public-closure.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
        print('Authenticated58OWN files; complete16TU component and partitioned composition tests.')
        PY
    - name: Compile complete16TU SDK repeats and capture finite Mac composition
      shell: bash
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/native-padded-encoded-sdk-v1b-proof"
        python3 -B "$root/source/run_sdk.py" --execute --output "$root/probe"
    - name: Retain bounded raw outputs even when capture fails
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/native-padded-encoded-sdk-v1b-proof"
        if [ -d "$root/probe" ] && [ -f "$root/source/retain.py" ]; then
          python3 -B "$root/source/retain.py" --source "$root/probe" --output "$root/artifact"
        else
          echo 'No owned capture directory was produced.'
        fi
    - name: Upload OWN padded encoded evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-padded-encoded-sdk-v1b-${{ github.run_id }}-${{
          github.run_attempt }}
        path: ${{ runner.temp }}/native-padded-encoded-sdk-v1b-proof/artifact
        if-no-files-found: warn
        retention-days: 1
        compression-level: 6
