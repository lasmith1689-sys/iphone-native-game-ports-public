name: Own padded encoded voice SDK and finite Mac composition
'on':
  push:
    branches:
    - codex/native-audio-padded-encoded-sdk-v1b-20261106
    paths:
    - .github/workflows/native-audio-padded-encoded-sdk-v1b.yml
    - native/platform/native-audio-padded-encoded-sdk-v1b-20261106/**
permissions:
  contents: read
concurrency:
  group: native-padded-encoded-sdk-v1
  cancel-in-progress: false
jobs:
  cooperative-wait:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' &&
      github.event.repository.private == false && github.ref == 'refs/heads/codex/native-audio-padded-encoded-sdk-v1b-20261106'
      && github.event_name == 'push'
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
    - name: Authenticate58OWN support and test files
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        python3 -B - <<'PY'
        import hashlib,json,os,pathlib,re,time,urllib.request
        assert os.environ['GITHUB_REPOSITORY']=='lasmith1689-sys/iphone-native-game-ports-public' and os.environ['GITHUB_REF']=='refs/heads/codex/native-audio-padded-encoded-sdk-v1b-20261106' and os.environ['GITHUB_EVENT_NAME']=='push'
        sha=os.environ['GITHUB_SHA'];assert re.fullmatch('[0-9a-f]{40}',sha)
        e=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text());assert e['repository']['full_name']=='lasmith1689-sys/iphone-native-game-ports-public' and e['repository']['private'] is False and e['after']==sha and e['ref']=='refs/heads/codex/native-audio-padded-encoded-sdk-v1b-20261106' and not e.get('deleted',False)
        root=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()/'native-padded-encoded-sdk-v1b-proof';assert not root.exists()
        source=root/'source';source.mkdir(parents=True);manifest={'ngp_audio_catalog_v1.c': {'bytes': 10359, 'sha256': '782dbb81631ad50949404e30569c20241cc81ad9225e51202cf708b30d5fe4f4'}, 'ngp_audio_catalog_v1.h': {'bytes': 2276, 'sha256': '31925ebb56262fef15ac3005fc8cce7803c2d34278db7e4cb90c27324531a5f8'}, 'ngp_audio_shared_implementation_v1.c': {'bytes': 315, 'sha256': '696d991be6cf39957f4503d970dd1b87b3ed3d16c7bcc2e89ee08756d39f0d7b'}, 'ngp_audio_shared_profile_v1.h': {'bytes': 577, 'sha256': '8ad2671d8f30595b5f2acfddcea086f4fcd278d9bf0121fd92afba57c429d397'}, 'ngp_audio_stop_os_v1.c': {'bytes': 1158, 'sha256': '1a5fdffced3f1b1a10358b61cc763f2c71db3c9f6377b0022a1f5e0eb32b4d49'}, 'ngp_audio_stop_os_v1.h': {'bytes': 577, 'sha256': '3ffd8cb6bc63e700ced41e5db7d4eaf8b1edd1447da278b9510ca1971bf3ee2b'}, 'ngp_audio_stop_terminal_v1.c': {'bytes': 582, 'sha256': 'd95e670adcc51437fa0a5619f7aaed4a15463d81ca39111384f793ebca49ae8e'}, 'ngp_audio_stop_terminal_v1.h': {'bytes': 588, 'sha256': '50167e8c19048a8cfa214ddf727988e91f15cf6783480e420a888a9eaf5e95d5'}, 'ngp_audio_worker_broker_v1.m': {'bytes': 1214, 'sha256': 'daab3b849a8dc3de325790f1e8717e94f1bc668d46aaa7cb6330051901b6a2cb'}, 'ngp_audio_worker_runtime_v1.c': {'bytes': 16186, 'sha256': '519e25f619a199d630a325c3a9a13035ead99d5f4bff2eb4c00405b469c54588'}, 'ngp_audio_worker_runtime_v1.h': {'bytes': 3701, 'sha256': 'ffbb835f803ca7c8f787f2647d712fcb51d73664927d6ce490a90b5282b33196'}, 'ngp_device_mixer_render_v1.c': {'bytes': 3163, 'sha256': 'dee442897e3eebd8faccba7fcef9f075e5f19a8fa473c2f0282c79810ba8818e'}, 'ngp_device_mixer_render_v1.h': {'bytes': 1266, 'sha256': 'aab3377efd6d3a4b016134d8e8f14b256f9d77ec1cc02d1b0b571f5a22d77baf'}, 'ngp_device_mixer_v1.h': {'bytes': 2916, 'sha256': '13f8f5842b9a39fe2c4b4111669a621e1d3f9a5a35588ae6f943fd2209816c17'}, 'ngp_device_mixer_v1.m': {'bytes': 21221, 'sha256': 'e1b7e62d9e810d6e5b6c06903d2fe9a98daaba5a2d3dfeb4d525caf9c12326d6'}, 'ngp_encoded_voice_bind_v1.c': {'bytes': 10459, 'sha256': 