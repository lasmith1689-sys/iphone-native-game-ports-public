name: 'Native retained counter bridge: genuine SDK and Mac tests'
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/native-counter-bridge-sdk-v1-20261105
    paths:
    - .github/workflows/native-counter-bridge-sdk-v1.yml
    - native/platform/native-counter-bridge-sdk-v1-20261105/**
permissions:
  contents: read
concurrency:
  group: native-counter-bridge-sdk-v1
  cancel-in-progress: false
jobs:
  native-counter:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private
      == false && github.ref == 'refs/heads/codex/native-counter-bridge-sdk-v1-20261105' && (github.event_name ==
      'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
    - name: Authenticate exact own support closure
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'PY'\nimport hashlib,json,os,pathlib,re,urllib.request\nassert\
        \ os.environ['GITHUB_REPOSITORY']=='lasmith1689-sys/iphone-native-game-ports-public'\nassert os.environ['GITHUB_REF']=='refs/heads/codex/native-counter-bridge-sdk-v1-20261105'\n\
        assert os.environ['GITHUB_EVENT_NAME'] in ('push','workflow_dispatch')\nsha=os.environ['GITHUB_SHA'];assert\
        \ re.fullmatch('[0-9a-f]{40}',sha)\nevent=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())\n\
        assert event['repository']['full_name']=='lasmith1689-sys/iphone-native-game-ports-public' and event['repository']['private']\
        \ is False\nif os.environ['GITHUB_EVENT_NAME']=='push':assert event['after']==sha and not event.get('deleted',False)\n\
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-counter-bridge-proof'\nassert not root.exists() and\
        \ not any(p.is_symlink() for p in (root,*root.parents))\nsource=root/'source';source.mkdir(parents=True)\n\
        manifest={'div64.c': {'bytes': 1896, 'sha256': '8c55970261190564bd625b2d6ab9d643078b77a0124c6e60fb2ce7b2b3266dd0'},\
        \ 'monotonic.c': {'bytes': 1318, 'sha256': 'ac36c65a30eae875ea4da4c9e2622662cb21abc0fb4d256ee2944a8e95d7d41d'},\
        \ 'provider_darwin.c': {'bytes': 443, 'sha256': 'e0252920dc4667e33a1f5e14cab0f9a53155830adad0464f599d87ae131f3730'},\
        \ 'virtual_counter.c': {'bytes': 1834, 'sha256': 'd2d7af441567dfabf3b2f3672a19624cf79cb92fef752b954d52f1bd766ce5da'},\
        \ 'host64.c': {'bytes': 6836, 'sha256': '144f495c374b41e1337918adf5a9112efcc2e697ac49383f1374bd931215822e'},\
        \ 'native_required.c': {'bytes': 1995, 'sha256': 'aec2d7940d72b8be4adefd388c0bd2fb09ca3bc28338d441634911d4fbf97bf3'},\
        \ 'native_dispatch.c': {'bytes': 4658, 'sha256': '9ca9a1799c7cb864fac47571aa3c11bc891a9dd136b148bd988640511bfb5b4a'},\
        \ 'native_counter_required.c': {'bytes': 4283, 'sha256': 'ee3af63d6f684ba4fc657a1687dbdbe596d79b3a53a9e8da76b37f4331e2f80f'},\
        \ 'div64.h': {'bytes': 751, 'sha256': 'fda9705395aa9de858304f24c65919abd20fc255badfd6d44e661a3d2b1cd0bd'},\
        \ 'monotonic.h': {'bytes': 1194, 'sha256': '1bb2bd273bacb7edd830e0720f97d425b4aec4545fe261ef2163bb8727692b40'},\
        \ 'provider_windows.c': {'bytes': 517, 'sha256': 'e8c120c606759609dac5e7cd0cfdc432960199161d5e987ea47619d435e56c94'},\
        \ 'virtual_counter.h': {'bytes': 987, 'sha256': '0f26f9c87eba6dab0a44cc1bd9ec913a169b0ac674071188de67800701f19f47'},\
        \ 'cpu64.h': {'bytes': 23713, 'sha256': 'dd2cd98ae5ce002e0589b50c729c5a692ab2a661a7de39397e97a8dd4360c1ac'},\
        \ 'native_dispatch.h': {'bytes': 2190, 'sha256': '6b6f21cbdc73b43371e77f4b18954a9191515c0ffb88651fb6b38a6d8dfd7b02'},\
        \ 'native_required.h': {'bytes': 1294, 'sha256': '99484c143fad92dc6e4bc3b7183d90a1026a9113eb7f65737eb2f670a8941df9'},\
        \ 'host64.h': {'bytes': 2694, 'sha256': 'eb55e8d79e165562a4845a7bc34dfeb95bdbc43970c864446edeaf0280228fe7'},\
        \ 'local_compile_declarations.h': {'bytes': 498, 'sha256': '9ae6b6e0ff5de665c3f4c614895f07a271f24a7dd3265d88955dc283f5b07d78'},\
        \ 'native_counter_required.h': {'bytes': 2172, 'sha256': '7950064b6a22a85da418cce716d0d6a1abefeefe0b2c8229f41a7f6a9d120cfd'},\
        \ 'test_bridge.c': {'bytes': 11608, 'sha256': '02be7d2a8b877ae77901e5b5b42cbe41b6ce9473389bdcbedb0bd8ac68e50425'},\
        \ 'vectors.inc': {'bytes': 311373, 'sha256': '8a6d88fce5e471efdd642b95a9ac46428cb2a5d67428bc9bb3ab706951fcc06d'},\
        \ 'counter_provider_fixture.c': {'bytes': 698, 'sha256': '7d47ddca891e298cb49cefa63a28137f6149b0376c428b91dc8192fba915367e'},\
        \ 'run_sdk.py': {'bytes': 7403, 'sha256': '30ed893371810fa7b3fdabb0cce19c862b7976814266dc240c461b26fbecf6b5'},\
        \ 'README.md': {'bytes': 2152, 'sha256': 'a94977c53916e15727d74fababae96f22eee0214f348b913be021271b45603f4'}}\n\
        for name,row in manifest.items():\n assert name==pathlib.PurePosixPath(name).name and row['bytes']<524288\n\
        \ url='https://raw.githubusercontent.com/'+'lasmith1689-sys/iphone-native-game-ports-public'+'/'+sha+'/'+'native/platform/native-counter-bridge-sdk-v1-20261105'+'/'+name\n\
        \ with urllib.request.urlopen(url,timeout=45) as response:data=response.read(row['bytes']+1)\n assert len(data)==row['bytes']\
        \ and hashlib.sha256(data).hexdigest()==row['sha256'],name\n (source/name).write_bytes(data)\n(root/'reviewed-source-closure.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\\\
        n')\nprint('Authenticated23 own support files; no game source, assets, private credentials or build secret.')\n\
        \nPY\n"
    - name: Compile genuine SDK objects and run Mac native worker tests
      shell: bash
      run: 'set -euo pipefail

        umask 077

        python3 - <<''PY''

        import os,pathlib,subprocess,sys

        root=pathlib.Path(os.environ[''RUNNER_TEMP''])/''native-counter-bridge-proof''

        p=subprocess.run([sys.executable,str(root/''source/run_sdk.py''),''--output'',str(root/''output'')],timeout=540)

        assert p.returncode==0,''Actual SDK and Mac native outcomes must pass''


        PY

        '
    - name: Require actual repeated SDK objects and native outcomes
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'PY'\nimport hashlib,json,os,pathlib\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-counter-bridge-proof';out=root/'output'\n\
        manifest=json.loads((root/'reviewed-source-closure.json').read_text())\nfor name,row in manifest.items():\n\
        \ p=root/'source'/name;assert p.stat().st_size==row['bytes'] and hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256']\n\
        r=json.loads((out/'result.json').read_text())\nassert r['status']=='retained-counter-sdk-and-native-host-tests-passed'\
        \ and r['AppleSDKUsed'] is True and r['repeatedObjectsIdentical'] is True and len(r['objects'])==8\nassert\
        \ set(r['nativeMacTests'])=={'controlled','real-clock'}\nfor name in ('gameCodeIncluded','iPhoneExecuted','gameExecuted','signed','installable'):assert\
        \ r[name] is False\nfiles=list(out.rglob('*'));assert len(files)<250 and all(not p.is_symlink() for p in\
        \ files) and sum(p.stat().st_size for p in files if p.is_file())<10*1024*1024\nprint(json.dumps({'status':r['status'],'SDKVersion':r['SDKVersion'],'archive':r['archive'],'iPhoneExecuted':False}))\n\
        \nPY\n"
    - name: Upload bounded support evidence
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-counter-bridge-sdk-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/native-counter-bridge-proof/output
        if-no-files-found: error
        retention-days: 1
        compression-level: 6
        include-hidden-files: false
        archive: true
