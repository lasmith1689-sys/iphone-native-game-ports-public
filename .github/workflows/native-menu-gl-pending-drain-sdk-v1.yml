name: Native menu completed-list drain SDK tests
'on':
  push:
    branches: [codex/native-menu-gl-pending-drain-sdk-v1-20261107]
permissions:
  contents: read
concurrency:
  group: native-menu-gl-pending-drain-sdk-v1
  cancel-in-progress: false
jobs:
  sdk:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.ref == 'refs/heads/codex/native-menu-gl-pending-drain-sdk-v1-20261107' && github.event_name == 'push'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 1
        submodules: false
        lfs: false
    - name: Verify fixed public support inputs
      shell: bash
      run: |
        python3 - <<'PY'
        import hashlib,pathlib
        pins = {'menu-gl-source.json': '07bf7feed0cbe2170be9074ff8a406c447983bb003c8399f400ba7112764454e', 'menu-gl-source.zip': '18eaa9ae695b8c8d134b72694909fd9306db7d2830bf32fc54de69bad7751cea', 'sdk_build.py': '5ead42f3e5fb5f396aaee6853cf7550bc3499e7cc9be08a71e2c981ca7b75deb'}
        for name, expected in pins.items():
            assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected, name
        PY
    - name: Compile the coherent support cohort and run synthetic boundary tests
      run: python3 -B sdk_build.py
    - name: Retain objects layout dumps and test receipts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-menu-gl-pending-drain-sdk-v1
        path: sdk-result
        if-no-files-found: error
        retention-days: 7
        compression-level: 6
