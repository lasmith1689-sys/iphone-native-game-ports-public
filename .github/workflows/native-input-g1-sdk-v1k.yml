    - id: final
      name: Require actual audit and selected report upload
      if: always()
      shell: bash
      run: 'set -euo pipefail

        test ''${{ steps.proof.outcome }}'' = ''success''

        test ''${{ steps.upload.outcome }}'' = ''success''

        test ''${{ steps.retain.outcome }}'' = ''success''

        if test ''${{ steps.retain.outputs.available }}'' = ''true''; then test ''${{ steps.object_upload.outcome }}'' = ''success''; fi

        test ''${{ steps.library_retain.outcome }}'' = ''success''

        if test ''${{ steps.library_retain.outputs.available }}'' = ''true''; then test ''${{ steps.library_upload.outcome }}'' = ''success''; fi

        '
