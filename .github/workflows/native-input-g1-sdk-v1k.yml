        \ dict(available=False,reason='child tool ownership unconfirmed')\n  assert row.get('exitCode') is None or type(row['exitCode']) is int\n  assert type(row['argv']) is list and 1<=len(row['argv'])<=128 and all(type(a) is str and 0<len(a)<=4096 and not any(c in a for c in '\\0\\r\\n') for a in row['argv'])\n  if 'elapsedSeconds' in row:assert type(row['elapsedSeconds']) in (int,float) and math.isfinite(row['elapsedSeconds']) and 0<=row['elapsedSeconds']<=1200\n  for key in ('stdout','stderr'):\n   if key in row:assert type(row[key]) is dict and set(row[key])=={'bytes','sha256'} and type(row[key]['bytes']) is int and 0<=row[key]['bytes']<=1048576 and type(row[key]['sha256']) is str and re.fullmatch('[0-9a-f]{64}',row[key]['sha256'])\n by_label={r['label']:r for r in commands};link=by_label.get('link')\n if link is None or link['exitCode']!=0:return dict(available=False,reason='link not successful')\n assert summary['scope']=='own-G1-physical-iPhone-SDK-source-only' and summary['sourceIdentities']==identities\
        \ and summary['SDK']['target']==TARGET\n word=summary['SDK']['versionWord'];assert type(word) is int and 27<<16<=word<1<<32\n private=output/'private-build';no_reparse(private,True);library=private/LIBRARY;exports=private/'exports.txt';argv=link['argv'];assert len(argv)>=9;clang,sdk=argv[0],argv[4];assert PurePosixPath(clang).is_absolute() and PurePosixPath(sdk).is_absolute()\n objects=[private/'unit0.o',private/'unit1.o'];frameworks=[flag for name in FRAMEWORKS for flag in ('-framework',name)]\n expected=[clang,'-target',TARGET,'-isysroot',sdk,*LINK_FLAGS,'-Wl,-install_name,'+INSTALL_NAME,'-Wl,-exported_symbols_list,'+str(exports),*map(str,objects),*frameworks,'-lobjc','-o',str(library)]\n assert argv==expected,'exact selected link flags/objects/output'\n for i,unit in enumerate((C_UNIT,UIKIT_UNIT)):\n  flags=['-target',TARGET,'-isysroot',sdk,*COMMON_FLAGS,*((OBJC_FLAGS) if i else ())]\n  for label,destination in (('compile-'+str(i),objects[i]),('repeat-'+str(i),private/('unit'+str(i)+'-repeat.o'))):\n\
