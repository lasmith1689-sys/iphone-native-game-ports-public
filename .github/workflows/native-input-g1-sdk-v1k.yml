name: Own G1 input unsigned physical iPhone SDK audit only
'on':
  push:
    branches:
    - codex/native-input-g1-sdk-v1k-20261031
    paths:
    - .github/workflows/native-input-g1-sdk-v1k.yml
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: own-input-g1-sdk-v1
  cancel-in-progress: false
jobs:
  g1-sdk:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-input-g1-sdk-v1k-20261031' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
    - id: guard
      name: Require exact dedicated public context
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import json,os,re

        from pathlib import Path

        assert os.environ[''GITHUB_REPOSITORY'']==''lasmith1689-sys/iphone-native-game-ports-public'' and os.environ[''GITHUB_REF'']==''refs/heads/codex/native-input-g1-sdk-v1k-20261031''

        kind=os.environ[''GITHUB_EVENT_NAME''];assert kind in (''push'',''workflow_dispatch'')

        assert re.fullmatch(''[a-f0-9]{40}'',os.environ[''GITHUB_SHA''])

        event=json.loads(Path(os.environ[''GITHUB_EVENT_PATH'']).read_bytes())

        assert event[''repository''][''full_name'']==''lasmith1689-sys/iphone-native-game-ports-public'' and event[''repository''][''private''] is False

        if kind==''push'':assert event[''ref'']==''refs/heads/codex/native-input-g1-sdk-v1k-20261031'' and event[''after'']==os.environ[''GITHUB_SHA''] and event.get(''deleted'',False) is False

        else:assert event.get(''inputs'') in (None,{})

        print(''Exact own-G1 public context accepted.'')

        PY

        '
    - id: stage0
      name: Stage exact nested own-source chunk 1
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,os,stat,zlib\nfrom pathlib import Path,PurePosixPath\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'native-input-g1-sdk-v1k'\nassert not base.exists();base.mkdir(mode=0o700);source=base/'source';source.mkdir(mode=0o700)\npayload={'g1_sdk_inspect.py': '',\
        \ 'g1_sdk_policy.py': '',\
        \ 'native/aot/platform_init/v1/platform_init_v1.h': ''}\n\
        identities={'g1_sdk_inspect.py': {'bytes': 14150, 'sha256': '6f4f5d6d4ea7bda2c5d28e66be1be562cf9b771c6a08d48ef8c606784affbe94'}, 'g1_sdk_policy.py': {'bytes': 10084, 'sha256': 'f59e6eb20708155ddd894ba34aa1732c956aad2f7a0e4309a5240ce5d9ba27a0'}, 'native/aot/platform_init/v1/platform_init_v1.h': {'bytes': 3438, 'sha256': 'f8cd0b0386afe74254594259855381ce537a8e18a1f9b9ab0017029b518b60ae'}}\nfor name,text in payload.items():\n p=PurePosixPath(name);assert name and not p.is_absolute() and all(x not in ('','.','..') for x in name.split('/')) and '\\\\' not in name and ':' not in name\n decoder=zlib.decompressobj();data=decoder.decompress(base64.b64decode(text,validate=True),65537)\n assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail and len(data)<=65536\n expected=identities[name];assert len(data)==expected['bytes'] and hashlib.sha256(data).hexdigest()==expected['sha256']\n target=source/name;assert target.resolve().is_relative_to(source.resolve()) and not target.exists()\n\
        \ target.parent.mkdir(parents=True,exist_ok=True)\n for part in (target.parent,*target.parent.parents):\n  st=part.lstat();assert not stat.S_ISLNK(st.st_mode) and not getattr(st,'st_file_attributes',0)&1024\n with target.open('xb') as f:f.write(data)\nprint('Exact G1 own-source chunk 1/3 staged.')\nPY\n"
    - id: stage1
      name: Stage exact nested own-source chunk 2
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,os,stat,zlib\nfrom pathlib import Path,PurePosixPath\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'native-input-g1-sdk-v1k'\nsource=base/'source';assert base.is_dir() and source.is_dir() and not base.is_symlink() and not source.is_symlink()\npayload={'native/platform/cod-gl-ios/input-v1/cod_input_queue_v1.h': '',\
        \ 'native/platform/cod-gl-ios/input-v3-bind-v3/cod_input_queue_v2.c': '',\
        \ 'native/platform/cod-gl-ios/input-v3-bind-v3/cod_input_queue_v2.h': ''}\nidentities={'native/platform/cod-gl-ios/input-v1/cod_input_queue_v1.h': {'bytes': 1938, 'sha256': '29547c1f4172dd105ab211192a86a0845c97328a9cc9c162434175749580c5fd'}, 'native/platform/cod-gl-ios/input-v3-bind-v3/cod_input_queue_v2.c': {'bytes': 3950, 'sha256': 'efd787570343be9ad7c37844e2697c5abee53afe5011ba85776b03b4731c6256'}, 'native/platform/cod-gl-ios/input-v3-bind-v3/cod_input_queue_v2.h': {'bytes': 898, 'sha256': '5db009917ace7802c60294a418d4e39c36bcbbf594cbf637986125d7df61b88b'}}\n\
        for name,text in payload.items():\n p=PurePosixPath(name);assert name and not p.is_absolute() and all(x not in ('','.','..') for x in name.split('/')) and '\\\\' not in name and ':' not in name\n decoder=zlib.decompressobj();data=decoder.decompress(base64.b64decode(text,validate=True),65537)\n assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail and len(data)<=65536\n expected=identities[name];assert len(data)==expected['bytes'] and hashlib.sha256(data).hexdigest()==expected['sha256']\n target=source/name;assert target.resolve().is_relative_to(source.resolve()) and not target.exists()\n target.parent.mkdir(parents=True,exist_ok=True)\n for part in (target.parent,*target.parent.parents):\n  st=part.lstat();assert not stat.S_ISLNK(st.st_mode) and not getattr(st,'st_file_attributes',0)&1024\n with target.open('xb') as f:f.write(data)\nprint('Exact G1 own-source chunk 2/3 staged.')\nPY\n"
    - id: stage2
      name: Stage exact nested own-source chunk 3
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,os,stat,zlib\nfrom pathlib import Path,PurePosixPath\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'native-input-g1-sdk-v1k'\nsource=base/'source';assert base.is_dir() and source.is_dir() and not base.is_symlink() and not source.is_symlink()\npayload={'native/platform/cod-gl-ios/input-v3-bind-v3/cod_uikit_input_v3.h': '',\
