name: Own D1 Task4 unsigned iPhone SDK compile/link audit v1b
'on':
  push:
    branches:
    - codex/native-d1-task4-app-sdk-v1b-20261031
    paths:
    - .github/workflows/native-d1-task4-app-sdk-v1b.yml
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: own-d1-task4-app-sdk-v1b
  cancel-in-progress: false
jobs:
  app-sdk:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-d1-task4-app-sdk-v1b-20261031' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
    - id: guard
      name: Require exact dedicated public source context
      shell: bash
      run: 'set -euo pipefail

        python3 -B - <<''PY''

        import json,os,re

        from pathlib import Path

        assert os.environ[''GITHUB_REPOSITORY'']==''lasmith1689-sys/iphone-native-game-ports-public'' and os.environ[''GITHUB_REF'']==''refs/heads/codex/native-d1-task4-app-sdk-v1b-20261031''

        assert re.fullmatch(''[0-9a-f]{40}'',os.environ[''GITHUB_SHA''])

        kind=os.environ[''GITHUB_EVENT_NAME''];assert kind in (''push'',''workflow_dispatch'')

        raw=Path(os.environ[''GITHUB_EVENT_PATH'']).read_bytes();assert len(raw)<=1048576;event=json.loads(raw)

        assert event[''repository''][''full_name'']==''lasmith1689-sys/iphone-native-game-ports-public'' and event[''repository''][''private''] is False

        if kind==''push'':assert event[''ref'']==''refs/heads/codex/native-d1-task4-app-sdk-v1b-20261031'' and event[''after'']==os.environ[''GITHUB_SHA''] and event.get(''deleted'',False) is False

        else:assert event.get(''inputs'') in (None,{})

        print(''Exact dedicated public own-source context accepted; no product execution.'')

        PY

        '
