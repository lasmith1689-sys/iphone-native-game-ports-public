    - id: sdk
      name: Compile13 exact units and strict diagnostic link; run no product
      shell: bash
      continue-on-error: true
      run: 'set -euo pipefail

        python3 -B "${RUNNER_TEMP}/own-d1-task4-app-sdk-v1b/payload/tools/run_app_sdk.py" --output "${RUNNER_TEMP}/own-d1-task4-app-sdk-v1b/build"

        '
    - id: collect
      name: Validate source/context and retain only own bounded outputs
      if: always() && steps.guard.outcome == 'success' && steps.stage0.outcome == 'success' && steps.stage1.outcome == 'success' && steps.stage2.outcome == 'success' && steps.stage3.outcome == 'success' && steps.stage4.outcome == 'success' && steps.stage5.outcome == 'success' && steps.stage6.outcome == 'success' && steps.stage7.outcome == 'success' && steps.stage8.outcome == 'success' && steps.stage9.outcome == 'success' && steps.stage10.outcome == 'success'
      shell: bash
      run: "set -euo pipefail\npython3 -B - <<'PY'\nimport json,os,sys\nfrom pathlib import Path\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'own-d1-task4-app-sdk-v1b'\nsys.path.insert(0,str(base/'payload/tools'))\nfrom collect_app_sdk import collect\nstatus=collect(base/'build',base/'reports',json.loads((base/'context.json').read_bytes()))\nwith Path(os.environ['GITHUB_OUTPUT']).open('a',encoding='utf-8') as output:\n output.write('proof='+('true' if status['wholeSDKProofComplete'] else 'false')+'\\n')\n output.write('evidence='+('true' if (base/'reports/sdk-evidence.zip').is_file() else 'false')+'\\n')\n output.write('app='+('true' if (base/'reports/unsigned-app.zip').is_file() else 'false')+'\\n')\nprint(json.dumps(status))\nPY\n"
    - id: reports
      name: Upload only three bounded source-bound report JSON files
      if: always() && steps.collect.outcome == 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: own-d1-task4-app-v1b-reports-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/own-d1-task4-app-sdk-v1b/reports/status.json

          ${{ runner.temp }}/own-d1-task4-app-sdk-v1b/reports/artifact-manifest.json

          ${{ runner.temp }}/own-d1-task4-app-sdk-v1b/reports/archives.json'
        if-no-files-found: error
        retention-days: 1
        compression-level: 6
        include-hidden-files: false
        archive: true
    - id: evidence
      name: Upload exact own diagnostic objects/frames/provider byte archive
      if: always() && steps.collect.outcome == 'success' && steps.collect.outputs.evidence == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: own-d1-task4-app-v1b-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/own-d1-task4-app-sdk-v1b/reports/sdk-evidence.zip
        if-no-files-found: error
        retention-days: 1
        compression-level: 6
        include-hidden-files: false
        archive: true
    - id: app
      name: Upload exact unsigned own diagnostic app/resources archive
      if: always() && steps.collect.outcome == 'success' && steps.collect.outputs.app == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: own-d1-task4-app-v1b-app-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/own-d1-task4-app-sdk-v1b/reports/unsigned-app.zip
        if-no-files-found: error
        retention-days: 1
        compression-level: 6
        include-hidden-files: false
        archive: true
    - id: final
      name: Require complete SDK audit and all selected artifact uploads
      if: always()
      shell: bash
      run: 'set -euo pipefail

        test ''${{ steps.sdk.outcome }}'' = ''success''

        test ''${{ steps.collect.outcome }}'' = ''success''

        test ''${{ steps.collect.outputs.proof }}'' = ''true''

        test ''${{ steps.reports.outcome }}'' = ''success''

        test ''${{ steps.evidence.outcome }}'' = ''success''

        test ''${{ steps.app.outcome }}'' = ''success''

        '
