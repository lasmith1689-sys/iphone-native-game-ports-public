name: Generic native stack component Mac and iPhone SDK proof
'on':
  push:
    branches:
    - codex/native-stack-component-v2-20261029
    paths:
    - .github/workflows/native-stack-component-v2.yml
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: generic-native-stack-component-v2
  cancel-in-progress: false
jobs:
  stack-component:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-stack-component-v2-20261029' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
    - name: Require exact public repository and branch
      id: guard
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json,os,re\nfrom pathlib import Path\nassert os.environ['GITHUB_REPOSITORY']=='lasmith1689-sys/iphone-native-game-ports-public'\nassert os.environ['GITHUB_REF']=='refs/heads/codex/native-stack-component-v2-20261029'\nkind=os.environ['GITHUB_EVENT_NAME'];assert kind in ('push','workflow_dispatch')\nassert re.fullmatch('[a-f0-9]{40}',os.environ['GITHUB_SHA'])\nevent=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())\nassert event['repository']['full_name']=='lasmith1689-sys/iphone-native-game-ports-public' and event['repository']['private'] is False\nif kind=='push':\n assert event['ref']=='refs/heads/codex/native-stack-component-v2-20261029' and event['after']==os.environ['GITHUB_SHA'] and event.get('deleted',False) is False\nelse:\n assert event.get('inputs') in (None,{})\nprint('Exact generic public stack-proof context accepted.')\nPY\n"
    - name: Stage first inline public source segment
      id: stagepart
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        import os

        from pathlib import Path

        part=Path(os.environ[''RUNNER_TEMP'']).resolve()/''ngp-stack-v2-payload-part1.txt''

        assert not part.exists()

        with part.open(''xb'') as output:output.write(''''.encode(''ascii''))

        print(''Public source payload segment staged; final decode must verify all nine hashes.'')

        PY

        '
    - name: Stage exact reviewed own sources inline
      id: stage
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,os,zlib\nfrom pathlib import Path\npart=Path(os.environ['RUNNER_TEMP']).resolve()/'ngp-stack-v2-payload-part1.txt'\npayload=part.read_text(encoding='ascii')+''\n\
        identities={'ngp_native_stack_v1.h': {'bytes': 1968, 'sha256': '5f6484557ec01d79ed700fa8ebecfcfc2bd7ae5de52271717afce36db87776ad'}, 'ngp_native_stack_sp_v1.h': {'bytes': 529, 'sha256': 'e47630d1b2656c36be9ea085961fa2acbf749b134533f57e4a14363eaa5c04cf'}, 'ngp_native_stack_platform_v1.c': {'bytes': 5931, 'sha256': 'f8ed39ea1f651a4b03738e8394f0e11f276524b4a9aa3ec114081b6c5f924940'}, 'ngp_native_stack_v2.h': {'bytes': 1704, 'sha256': '5bc23d00eb370bd727b4231ff256053d26aaa5c70983a71b2f4edd445d158457'}, 'ngp_native_stack_v2.c': {'bytes': 4936, 'sha256': '740a1a7cf3ccbd45e9e8bec52b4227838114542980d8c01752f5359e1b6e6296'}, 'test_stack_v2.c': {'bytes': 15052, 'sha256': 'f070482c9549cf8ecb8e249cad7c131a2a443b8d1b38052045f11d83f289dae4'}, 'proof_model.py': {'bytes': 2745, 'sha256': '77d921f7f06bb49935ff73a32befa4b0610e2b811853d6d159c758809c54f1cb'}, 'apple_inspect.py': {'bytes': 10680, 'sha256': '04b5db99ccc5a82d1026a6c3f57764c9fccb1c60b6a9aba0051eaec143103433'}, 'run_apple.py': {'bytes': 8649,\
        \ 'sha256': 'c9c9398fe680841c4ab12fb04d9ce13e5dd23b01a19147077f35e4d6dd51d7a6'}}\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'ngp-stack-public-v2'\nassert not base.exists();base.mkdir(mode=0o700)\nsource=base/'source';source.mkdir(mode=0o700)\ndecoder=zlib.decompressobj();packed=decoder.decompress(base64.b64decode(payload,validate=True),131073)\nassert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail and len(packed)<=131072\nmaterial=json.loads(packed)\nassert set(material)==set(identities) and len(material)==9\nfor name,text in material.items():\n assert '/' not in name and '\\\\' not in name and name not in ('.','..')\n assert isinstance(text,str);raw=text.encode('utf-8');assert len(raw)<=65536\n expected=identities[name]\n assert len(raw)==expected['bytes'] and hashlib.sha256(raw).hexdigest()==expected['sha256']\n (source/name).write_bytes(raw)\nassert sum(v['bytes'] for v in identities.values())==52194\n(base/'source-manifest.json').write_text(json.dumps(identities,sort_keys=True)+'\\\
        n')\nprint(json.dumps({'status':'exact-nine-own-source-files-staged','files':9,'bytes':52194}))\nPY\n"
    - name: Run exact own Mac and unsigned iPhone component proof
      id: proof
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport hashlib,json,os,signal,subprocess,sys\nfrom pathlib import Path\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'ngp-stack-public-v2'\nsource=base/'source';output=base/'build';reports=base/'reports';reports.mkdir(mode=0o700)\nidentities={'ngp_native_stack_v1.h': {'bytes': 1968, 'sha256': '5f6484557ec01d79ed700fa8ebecfcfc2bd7ae5de52271717afce36db87776ad'}, 'ngp_native_stack_sp_v1.h': {'bytes': 529, 'sha256': 'e47630d1b2656c36be9ea085961fa2acbf749b134533f57e4a14363eaa5c04cf'}, 'ngp_native_stack_platform_v1.c': {'bytes': 5931, 'sha256': 'f8ed39ea1f651a4b03738e8394f0e11f276524b4a9aa3ec114081b6c5f924940'}, 'ngp_native_stack_v2.h': {'bytes': 1704, 'sha256': '5bc23d00eb370bd727b4231ff256053d26aaa5c70983a71b2f4edd445d158457'}, 'ngp_native_stack_v2.c': {'bytes': 4936, 'sha256': '740a1a7cf3ccbd45e9e8bec52b4227838114542980d8c01752f5359e1b6e6296'}, 'test_stack_v2.c': {'bytes': 15052, 'sha256': 'f070482c9549cf8ecb8e249cad7c131a2a443b8d1b38052045f11d83f289dae4'},\
        \ 'proof_model.py': {'bytes': 2745, 'sha256': '77d921f7f06bb49935ff73a32befa4b0610e2b811853d6d159c758809c54f1cb'}, 'apple_inspect.py': {'bytes': 10680, 'sha256': '04b5db99ccc5a82d1026a6c3f57764c9fccb1c60b6a9aba0051eaec143103433'}, 'run_apple.py': {'bytes': 8649, 'sha256': 'c9c9398fe680841c4ab12fb04d9ce13e5dd23b01a19147077f35e4d6dd51d7a6'}}\nassert {p.name for p in source.iterdir()}==set(identities)\nfor name,wanted in identities.items():\n p=source/name;assert p.is_file() and not p.is_symlink()\n raw=p.read_bytes();assert len(raw)==wanted['bytes'] and hashlib.sha256(raw).hexdigest()==wanted['sha256']\nfor name in ('status.json', 'result-summary.json', 'commands-summary.json', 'frames-summary.json', 'diagnostics.txt'):(reports/name).write_text('' if name.endswith('.txt') else '{}\\n')\nstatus={'status':'started','ownSourceFiles':9,'recoveredEngineExecuted':False,'physicalIPhoneTest':False}\n(reports/'status.json').write_text(json.dumps(status,indent=2)+'\\n')\nclean={'PATH':'/usr/bin:/bin:/usr/sbin:/sbin','HOME':str(base),'TMPDIR':str(base)+'/',\
        \ 'LANG':'C','LC_ALL':'C'}\nexit_code=1;timed_out=False;failure=''\ntry:\n with (base/'driver.stdout').open('wb') as stdout,(base/'driver.stderr').open('wb') as stderr:\n  child=subprocess.Popen([sys.executable,str(source/'run_apple.py'),'--output',str(output)],env=clean,stdout=stdout,stderr=stderr,start_new_session=True)\n  try:exit_code=child.wait(timeout=900)\n  except subprocess.TimeoutExpired:\n   timed_out=True;failure='owned-proof-process-group-timeout'\n   os.killpg(child.pid,signal.SIGTERM)\n   try:child.wait(timeout=3)\n   except subprocess.TimeoutExpired:os.killpg(child.pid,signal.SIGKILL);child.wait(timeout=3)\nexcept Exception as exc:failure=type(exc).__name__+': '+str(exc)[:512]\n\"\"\"Inline V2 matrix collector: retain completed counts without whole-job success.\"\"\"\ndef sanitize_catalog(target,count,data,record_sha):\n identity=data['identity'];assert identity['catalogCount']==count==data['catalogCount']\n assert count in (16,5204) and identity['target']==('arm64-apple-macos15.0'\
        \ if target=='mac' else 'arm64-apple-ios26.0')\n assert data['contextBytes']==184 and data['actualCodeAndFramesStableAfterMetadata'] is True\n assert data['actualEngineEntriesCovered']==0 and data['syntheticCapacityRecordsOnly'] is True and len(data['firstNineGuardDescriptors'])==9\n frames={'targetResultSha256':record_sha,'catalogCount':count,'certificateSha256':data['certificateSha256'],'recordDataSha256':data['recordDataSha256'],\n  'frames':identity['frames'],'firstNineGuardDescriptors':data['firstNineGuardDescriptors'],'contextBytes':184,'actualCodeAndFramesStableAfterMetadata':True,\n  'compilerSha256':identity['compilerSha256'],'compilerVersion':identity['compilerVersion'],'sdk':identity['sdk'],'sdkVersion':identity['sdkVersion'],\n  'target':identity['target'],'flags':identity['flags'],'linkFlags':identity['linkFlags']}\n output={'catalogCount':count,'contextBytes':184,'actualEngineEntriesCovered':0,'recordDataSha256':data['recordDataSha256'],'syntheticCapacityRecordsOnly':True}\n\
        \ if target=='mac':\n  for label in ('positive','negative'):\n   if label=='negative' and count==16:assert label not in data;continue\n   entry=data[label];r=entry['runtime'];assert entry['actualOwnedARM64ChildExecuted'] is True\n   assert r['platform']==2 and r['cases']>=(77 if label=='positive' else 62) and r['catalogRecords']==count and r['gateBytes']==184\n   assert r['status']==('passed' if label=='positive' else 'failed') and r['failure']==('' if label=='positive' else 'large-body-must-be-denied')\n   assert r['recoveredEngineExecuted'] is False and r['policyReserveIsFormalOSBound'] is False\n   machine=entry['machine'];assert len(machine['wrappers'])==9 and machine['actualReadonlyDescriptorBytesMatch'] is True\n   assert machine['catalogRecords']==count and machine['recordDataSha256']==data['recordDataSha256']\n   output[label]={'runtime':r,'actualOwnedARM64ChildExecuted':True,'sha256':entry['metadata']['sha256'],'bytes':entry['metadata']['bytes'],\n    'actualReadonlyRecordAndCatalogBytesMatch':True,'wrappers':[{'wrapper':w['wrapper'],'body':w['body'],'guardBeforeBody':w['guardBeforeBody'],\n\
        \     'expectedBypass':w['expectedBypass'],'actualSPCaptureInstructions':w['actualSPCaptureInstructions']} for w in machine['wrappers']]}\n else:\n  library=data['library'];proof=data['iPhoneLinkedFixtureProof'];assert data['iPhoneCodeExecuted'] is False and proof['executed'] is False\n  machine=proof['machine'];assert machine['actualReadonlyDescriptorBytesMatch'] is True and len(machine['wrappers'])==9\n  assert machine['catalogRecords']==count and machine['recordDataSha256']==data['recordDataSha256']\n  output.update(library={k:library[k] for k in ('filetype','platform','dependencies','uuid','signatures','encryption64','imports','exports','sha256','bytes')},\n   proofLibrarySha256=proof['metadata']['sha256'],linkedGuardedWrappers=[{'wrapper':w['wrapper'],'body':w['body'],'guardBeforeBody':w['guardBeforeBody']} for w in machine['wrappers']],\n   actualReadonlyRecordAndCatalogBytesMatch=True,iPhoneCodeExecuted=False)\n output['catalogComplete']=True;return output,frames\n\ncommands=[];result={'status':'proof-not-passed','recoveredEngineExecuted':False,'physicalIPhoneTest':False,'completeCatalogs':{}};frames={};targets={}\n\
        try:\n if (output/'commands.json').is_file():\n  raw=json.loads((output/'commands.json').read_bytes());assert isinstance(raw,list) and len(raw)<=100\n  for row in raw:commands.append({k:row[k] for k in ('label','returncode','timeout','timeoutSeconds') if k in row})\n for target in ('mac','iphone'):\n  path=output/target/'target-result.json'\n  if path.is_file():\n   assert path.stat().st_size<=2*1024*1024;raw=path.read_bytes();data=json.loads(raw)\n   assert data['target']==target and data['contextBytes']==184 and data['actualEngineEntriesCovered']==0 and data['ownComponentOnly'] is True\n   assert set(data['catalogs'])<=set(('16','5204'));result[target]={};frames[target]={};result['completeCatalogs'][target]=[]\n   for count in ('16','5204'):\n    if count in data['catalogs']:\n     summary,frame_summary=sanitize_catalog(target,int(count),data['catalogs'][count],hashlib.sha256(raw).hexdigest())\n     result[target][count]=summary;frames[target][count]=frame_summary;result['completeCatalogs'][target].append(int(count))\n\
        \   targets[target]=data\n if exit_code==0 and not timed_out and not failure:\n  path=output/'result.json';assert path.is_file() and path.stat().st_size<=2*1024*1024;full=json.loads(path.read_bytes())\n  assert full['status']=='own-V2-Mac-16-5204-and-iPhone-SDK-compile-pass' and full['onlyOwnComponent'] is True\n  assert full['recoveredEngineExecuted'] is False and full['physicalIPhoneTest'] is False and full['contextBytes']==184\n  assert full['targets']==targets and set(targets)=={'mac','iphone'} and all(set(t['catalogs'])=={'16','5204'} for t in targets.values())\n  assert full['inputs']=={name:wanted['sha256'] for name,wanted in identities.items()}\n  result.update({k:full[k] for k in ('status','onlyOwnComponent','recoveredEngineExecuted','physicalIPhoneTest','contextBytes','formalOpaqueOSStackProof','sameCodeFramesForBothCatalogCounts')})\nexcept Exception as exc:\n failure='report-collection-'+type(exc).__name__+': '+str(exc)[:512];exit_code=1;result['status']='proof-not-passed'\n\
        (reports/'commands-summary.json').write_text(json.dumps(commands,indent=2)+'\\n')\n(reports/'result-summary.json').write_text(json.dumps(result,indent=2)+'\\n')\n(reports/'frames-summary.json').write_text(json.dumps(frames,indent=2)+'\\n')\n\ndiagnostics=[]\nselected=[base/'driver.stderr']+sorted(output.glob('*.stderr'))+sorted(output.glob('mac-runtime-*.stdout'))\nremaining=49152\nfor path in selected:\n if path.is_file() and path.stat().st_size:\n  raw=path.read_bytes()[-min(4096,remaining):];text=raw.decode('utf-8',errors='replace')\n  diagnostics.append('=== '+path.name+' (bounded tail) ===\\n'+text);remaining-=len(raw)\n  if remaining<=0:break\n(reports/'diagnostics.txt').write_text('\\n'.join(diagnostics))\nstatus.update(status='passed' if exit_code==0 and not timed_out and not failure else 'failed',recipeExitCode=exit_code,timedOut=timed_out,failure=failure,actualMacAndSDKProofPassed=exit_code==0 and not timed_out and not failure)\n(reports/'status.json').write_text(json.dumps(status,indent=2)+'\\\
        n')\nassert {p.name for p in reports.iterdir()}==set(('status.json', 'result-summary.json', 'commands-summary.json', 'frames-summary.json', 'diagnostics.txt'))\nassert all(p.is_file() and not p.is_symlink() and p.stat().st_size<=196608 for p in reports.iterdir())\nassert sum(p.stat().st_size for p in reports.iterdir())<=393216\nprint(json.dumps(status))\nraise SystemExit(0 if status['status']=='passed' else 1)\nPY\n"
    - name: Upload only bounded selected reports
      id: upload
      if: always() && steps.guard.outcome == 'success' && steps.stage.outcome == 'success' && steps.proof.outcome != 'skipped'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: generic-stack-component-v2-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/ngp-stack-public-v2/reports/status.json

          ${{ runner.temp }}/ngp-stack-public-v2/reports/result-summary.json

          ${{ runner.temp }}/ngp-stack-public-v2/reports/commands-summary.json

          ${{ runner.temp }}/ngp-stack-public-v2/reports/frames-summary.json

          ${{ runner.temp }}/ngp-stack-public-v2/reports/diagnostics.txt'
        if-no-files-found: error
        retention-days: 1
        compression-level: 6
        include-hidden-files: false
        archive: true
    - name: Require actual proof and report upload success
      id: final
      if: always()
      shell: bash
      run: 'set -euo pipefail

        test ''${{ steps.proof.outcome }}'' = ''success''

        test ''${{ steps.upload.outcome }}'' = ''success''

        '
