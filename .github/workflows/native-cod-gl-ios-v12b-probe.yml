name: Native ABI12b owned CoD GL actual SDK compile/link candidate
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/native-cod-gl-ios-v12b-probe-20261031
    paths:
    - .github/workflows/native-cod-gl-ios-v12b-probe.yml
permissions:
  contents: read
concurrency:
  group: native-cod-gl-ios-v12b-probe
  cancel-in-progress: false
jobs:
  cod-gl-ios-v12b:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.ref == 'refs/heads/codex/native-cod-gl-ios-v12b-probe-20261031'
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
    - name: Pin matching public GL4ES and in-place Apple SDK
      id: prepare
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),21087)\nassert len(raw)==21086\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='343e82c8af025fd5d53b6d6e34255c1358c3546faad63ea10424813a2ba72196'\n\
        try:exec(compile(raw,'<owned-v12b-prepare>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-ios-v12b').absolute()\n\
        \ if root.is_dir() and not root.is_symlink():\n  output=root/'runner-program-prepare.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
        PY\n"
    - name: Materialize version4 header_sources
      id: header_sources
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),7759)\nassert len(raw)==7758\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='3d4f62434872fb2244097ae46b04b0c1cd03aad4aad37825365fd0d9f2366536'\n\
        try:exec(compile(raw,'<owned-v12b-header_sources>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-ios-v12b').absolute()\n\
        \ if root.is_dir() and not root.is_symlink():\n  output=root/'runner-program-header_sources.py'\n  assert\
        \ not output.is_symlink();output.write_bytes(raw)\nPY\n"
    - name: Materialize version4 dispatch_source
      id: dispatch_source
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),10530)\nassert len(raw)==10529\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='5dd90a74d13a243cb36424a108a23dba548fc7736e984050a76630c1d043f8f1'\n\
        try:exec(compile(raw,'<owned-v12b-dispatch_source>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-ios-v12b').absolute()\n\
        \ if root.is_dir() and not root.is_symlink():\n  output=root/'runner-program-dispatch_source.py'\n  assert\
        \ not output.is_symlink();output.write_bytes(raw)\nPY\n"
    - name: Materialize version4 backend_sources
      id: backend_sources
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),6343)\nassert len(raw)==6342\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='3332f91c11f09eeb3d86236205ffafd48b839644724c04542b7257c4e54f5c16'\n\
        try:exec(compile(raw,'<owned-v12b-backend_sources>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-ios-v12b').absolute()\n\
        \ if root.is_dir() and not root.is_symlink():\n  output=root/'runner-program-backend_sources.py'\n  assert\
        \ not output.is_symlink();output.write_bytes(raw)\nPY\n"
    - name: Materialize version4 uikit_sources
      id: uikit_sources
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),10599)\nassert len(raw)==10598\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='733547aa9ecd20844ac89da99d5fa83d27de5ac9dce7d71e1f1fe75552b6277f'\n\
        try:exec(compile(raw,'<owned-v12b-uikit_sources>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-ios-v12b').absolute()\n\
        \ if root.is_dir() and not root.is_symlink():\n  output=root/'runner-program-uikit_sources.py'\n  assert\
        \ not output.is_symlink();output.write_bytes(raw)\nPY\n"
    - name: Materialize unchanged own DXT and owned profile sources
      id: codec_profile_sources
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),9651)\nassert len(raw)==9650\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='dc4524af24efcc30ecbe0a8a21b198003c69bbd46ea6e30d884eacf4f79f9d27'\n\
        try:exec(compile(raw,'<owned-v12b-codec_profile_sources>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-ios-v12b').absolute()\n\
        \ if root.is_dir() and not root.is_symlink():\n  output=root/'runner-program-codec_profile_sources.py'\n\
        \  assert not output.is_symlink();output.write_bytes(raw)\nPY\n"
    - name: Compile native version4 bridge and exact matching private state helper
      id: build
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),31208)\nassert len(raw)==31207\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='ee37557d419150b07742219d37ef9606d643b30a2931ac48fe7531608c67557f'\n\
        try:exec(compile(raw,'<owned-v12b-build>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-ios-v12b').absolute()\n\
        \ if root.is_dir() and not root.is_symlink():\n  output=root/'runner-program-build.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
        PY\n"
    - name: Inspect production closure and real version4 dyld exports
      id: inspect
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),36047)\nassert len(raw)==36046\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='eb9f859a9143a9ea6f14cbd5d31a33f12ac7a25958ad4848def68b3e28bf3f9d'\n\
        try:exec(compile(raw,'<owned-v12b-inspect>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-ios-v12b').absolute()\n\
        \ if root.is_dir() and not root.is_symlink():\n  output=root/'runner-program-inspect.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
        PY\n"
    - name: Retain bounded public support raw diagnostics
      id: capture
      shell: bash
      if: always()
      run: "python3 - <<'PY'\nimport base64,hashlib,zlib,pathlib\nPAYLOAD=''\n\
        d=zlib.decompressobj();raw=d.decompress(base64.b64decode(PAYLOAD,validate=True),4139)\nassert len(raw)==4138\
        \ and d.eof and not d.unused_data and not d.unconsumed_tail and hashlib.sha256(raw).hexdigest()=='607292dd573e3b5668bf510c5fbc3bdf3acd1b9301ee738283949e2ba61668c4'\n\
        try:exec(compile(raw,'<owned-v12b-capture>','exec'),{'__name__':'__main__'})\nfinally:\n root=pathlib.Path('.work/cod-gl-ios-v12b').absolute()\n\
        \ if root.is_dir() and not root.is_symlink():\n  output=root/'runner-program-capture.py'\n  assert not output.is_symlink();output.write_bytes(raw)\n\
        PY\n"
    - name: Upload diagnostic raw closure, never installable
      id: raw_upload
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: cod-gl-abi11b-raw-${{ github.run_id }}-${{ github.run_attempt }}
        path: .work/cod-gl-ios-v12b-raw/
        retention-days: 1
        if-no-files-found: error
        include-hidden-files: true
        compression-level: 6
