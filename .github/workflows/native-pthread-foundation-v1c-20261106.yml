      run: "REPO='lasmith1689-sys/iphone-native-game-ports-public'\nBRANCH='codex/native-pthread-foundation-v1c-20261106'\nROOTNAME='native-pthread-foundation-bd444cff-4f0d-4446-8fe7-7702af4e4cab'\nCONTEXT='bd444cff-4f0d-4446-8fe7-7702af4e4cab'\nMANIFEST={'ngp_fls_v1.c': {'bytes': 10522, 'sha256': '03ab791f3d5b85f532b11942b7c4a6b3b32dc2fa7a73ae42e62a2c3a6f555f06'}, 'ngp_fls_v1.h': {'bytes': 3027, 'sha256': 'c7733e918d9d24716fde917c09b73b4ebf8246c1d2e97198b954e56decb5c09f'}, 'ngp_fls_protocol_v1.c': {'bytes': 1072, 'sha256': 'fe3470f1d3cd75d2a0cac667f5d0ea1a43d9950d626483ab7d2f594191d756ed'}, 'ngp_fls_protocol_v1.h': {'bytes': 968, 'sha256': 'eb4382bfd4668c42c7ef09a8598d973ca969dabbfa5141f82e388a29810894d6'}, 'ngp_worker_tag_v1.c': {'bytes': 1012, 'sha256': 'b19db518f435afb38c030bc0cf60e94976f6c80b82cdea250d58c896c7c9ca76'}, 'ngp_worker_tag_v1.h': {'bytes': 587, 'sha256': '82f3f4dabd6cff838d44d5b26bb3c0d416f73b3ed2dbcb7014639c80397af114'}, 'ngp_worker_tag_policy_v1.h': {'bytes': 399, 'sha256': '0cd1139e87905095e3789fe5854350c0e1ac6fd65f549778437b91557be2217c'}, 'ngp_fls_environment_v1.h': {'bytes': 1106, 'sha256': 'dd4f507d874efa1d08bee7ee407bf2bf6e71949caf27422d94e9989288264bae'}, 'synthetic_environment.c': {'bytes': 955, 'sha256': '39f520c0035640c41c2e7d01d9c7e9bc2190d1a2b18d18c6de5b1667f1bd2a69'}, 'synthetic_environment.h': {'bytes': 516, 'sha256': 'cdea5433b158860c212cce2bfd0be392c62fdb31e7954a1a3e39cc42b8abbe9a'}, 'fixture_pthread.c': {'bytes': 9778, 'sha256': 'f1f9ae4670c6f4e4c0462eab1f5f5410d118a093f5ee62d8a37c0e83f41f77d9'}, 'schedule.json': {'bytes': 577, 'sha256': '354f3a88c90d99bfd110a2282bc581c7f7b24afe6057527260b5ba7f75b267d6'}, 'run_apple.py': {'bytes': 10778, 'sha256': 'c1fd88d7a75e9981b2c109b04f4a44ae1c41316d354606f24da59e43745bb753'}, 'inspect_sdk.py': {'bytes': 5211, 'sha256': '7d1b075dfa732d7423b70baeee2883a517a5153c59af07f9ea87190440aafc83'}, 'README.md': {'bytes': 2226, 'sha256': '3fcdf6f66b3f69d1cb06e74db1c022c43023e9059ad536b1af90a698c3c23c90'}}\nBLOBS={'ngp_fls_v1.c': '', 'ngp_fls_v1.h': '', 'ngp_fls_protocol_v1.c': '', 'ngp_fls_protocol_v1.h': '', 'ngp_worker_tag_v1.c': '', 'ngp_worker_tag_v1.h': '', 'ngp_worker_tag_policy_v1.h': '', 'ngp_fls_environment_v1.h': '', 'synthetic_environment.c': '', 'synthetic_environment.h': '', 'fixture_pthread.c': '', 'schedule.json': '', 'run_apple.py': '', 'inspect_sdk.py': '', 'README.md': ''}\n\nimport base64,hashlib,json,math,os,pathlib,re,subprocess,sys\ndef strict(b):\n def pairs(items):\n  d={}\n  for k,v in items:\n   if k in d:raise ValueError('duplicate-key')\n   d[k]=v\n  return d\n def bad(v):raise ValueError('nonfinite')\n def number(s):\n  f=float(s)\n  if not math.isfinite(f):raise ValueError('nonfinite')\n  return f\n return json.loads(b,object_pairs_hook=pairs,parse_constant=bad,parse_float=number)\nassert os.environ['GITHUB_REPOSITORY']==REPO and os.environ['GITHUB_REF']=='refs/heads/'+BRANCH\nassert os.environ['GITHUB_EVENT_NAME']in('push','workflow_dispatch')\nsha=os.environ['GITHUB_SHA'];assert re.fullmatch('[0-9a-f]{40}',sha)\nevent=strict(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_bytes());assert event['repository']['full_name']==REPO and event['repository']['private']is False\nif os.environ['GITHUB_EVENT_NAME']=='push':assert event['after']==sha and event.get('deleted',False)is False\ntemp=pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True);root=temp/ROOTNAME\nassert not root.exists()and not any(p.is_symlink()for p in(temp,*temp.parents));root.mkdir();source=root/'source';source.mkdir();selected=root/'selected';selected.mkdir()\ngate='materialize';driverReaped=False;retirementUncertain=False;passed=False;collected={}\ndef pin(b):return dict(bytes=len(b),sha256=hashlib.sha256(b).hexdigest())\ndef save(name,obj):\n b=(json.dumps(obj,sort_keys=True,indent=2)+'\\n').encode();assert len(b)<=1048576;(selected/name).write_bytes(b)\ndef stable():\n assert set(p.name for p in source.iterdir())==set(MANIFEST)\n for n,row in MANIFEST.items():assert not(source/n).is_symlink()and pin((source/n).read_bytes())==row\ndef log_labels():\n labels={'clang-path','ar-path','nm-path','resource','mac-sdk','iphone-sdk','iphone-version','archive','archive-symbols','layout-primary','layout-repeat'}\n units=('ngp_fls_v1','ngp_fls_protocol_v1','ngp_worker_tag_v1')\n labels.update('compile-'+n for n in units+('synthetic-environment','fixture','testing-provider','testing-fixture','skip-callback','duplicate-callback','foreign-tracking'))\n labels.update('link-'+n for n in('production','testing','skip-callback','duplicate-callback','foreign-tracking'))\n labels.update('compile-'+r+'-'+n for r in('primary','repeat')for n in units)\n labels.update('native-production-'+n for n in('normal','capacity','owner-exit','callback-fail'))\n labels.update('native-testing-'+n for n in('create-fail','set-fail','clear-fail','delete-fail','late-exit'))\n labels.update('native-'+n+'-normal'for n in('skip-callback','duplicate-callback','foreign-tracking'))\n return labels\ndef failure():\n return dict(schema='native-pthread-foundation-public-wrapper-v1',status='failed',failedGate=gate,failureDetail='wrapper-refused-untrusted-or-uncertain-output',driverReaped=driverReaped,retirementUncertain=retirementUncertain,toolDescendantDrainProved=False,completed=[],SDKCompileProved=False,iphoneRuntimeProved=False,gameHostBindingProved=False)\ntry:\n for n,row in MANIFEST.items():\n  assert n==pathlib.PurePosixPath(n).name and 0<row['bytes']<=131072\n  b=base64.b64decode(BLOBS[n],validate=True);assert pin(b)==row;(source/n).write_bytes(b)\n stable();gate='driver'\n try:p=subprocess.run([sys.executable,'-B',str(source/'run_apple.py'),'--output',str(root/'output')],capture_output=True,timeout=600)\n except subprocess.TimeoutExpired:retirementUncertain=True;raise\n driverReaped=True;assert len(p.stdout)<=65536 and len(p.stderr)<=65536;stable();gate='collect'\n output=root/'output'\n for n in('result.json','source-identities.json','commands.json','metadata.json','frames.json'):\n  path=output/n;assert path.is_file()and not path.is_symlink()and path.stat().st_nlink==1 and path.stat().st_size<=1048576;b=path.read_bytes();strict(b);collected[n]=b\n result=strict(collected['result.json']);retirementUncertain=result.get('retirementUncertain')is True;assert result['retirementUncertain']is False and result['toolDescendantDrainProved']is False\n assert strict(collected['source-identities.json'])==MANIFEST\n assert result['status']in('passed','failed')and result['syntheticHost']is True and result['gameHostBindingProved']is False and result['iphoneRuntimeProved']is False\n commands=strict(collected['commands.json']);assert isinstance(commands,list)and len(commands)<=128\n seen=set();expectedLogs=set();total=sum(map(len,collected.values()));allowed=log_labels()\n for c in commands:\n  label=c['label'];assert label in allowed and label not in seen and type(c['exitCode'])is int and c['timeout']is False and type(c['elapsedSeconds'])in(int,float)and 0<=c['elapsedSeconds']<=600;seen.add(label)\n  for stream in('stdout','stderr'):\n   identity=c[stream];assert set(identity)=={'bytes','sha256'}and type(identity['bytes'])is int and 0<=identity['bytes']<=262144 and re.fullmatch('[0-9a-f]{64}',identity['sha256']);total+=identity['bytes'];assert total<=16777216\n   name=label+'.'+stream;expectedLogs.add(name);path=output/'logs'/name;assert path.is_file()and not path.is_symlink()and path.stat().st_nlink==1 and path.stat().st_size==identity['bytes']\n   with path.open('rb')as streamFile:b=streamFile.read(262145)\n   assert pin(b)==identity;collected['logs/'+name]=b\n logs=output/'logs';actualLogs=list(logs.iterdir())if logs.exists()else[];assert all(p.is_file()and not p.is_symlink()for p in actualLogs)and {p.name for p in actualLogs}==expectedLogs\n detail=result['failureDetail'];assert detail is None if result['status']=='passed'else isinstance(detail,str)and len(detail)<=1100\n completed=result['completed'];assert isinstance(completed,list)and len(completed)<=12\n for r in completed:assert set(r)=={'binary','mode','exitCode','receipt'}and isinstance(r['receipt'],str)and len(r['receipt'])<=1024\n if result['status']=='passed':\n  assert p.returncode==0 and result['SDKCompileProved']is True and len(completed)==12\n  meta=strict(collected['metadata.json']);assert len(meta['primary'])==len(meta['repeat'])==3 and len(meta['unboundOwnEnvironment'])==3\n  for repeat in('primary','repeat'):\n   for unit in('ngp_fls_v1','ngp_fls_protocol_v1','ngp_worker_tag_v1'):\n    name=repeat+'/'+repeat+'-'+unit+'.o';path=output/name;assert path.is_file()and not path.is_symlink()and path.stat().st_nlink==1 and path.stat().st_size<=4194304;collected[name]=path.read_bytes()\n  path=output/'libngp_fls.a';assert path.is_file()and not path.is_symlink()and path.stat().st_nlink==1 and path.stat().st_size<=4194304;collected['libngp_fls.a']=path.read_bytes();passed=True\n else:assert p.returncode!=0 and result['SDKCompileProved']is False\n assert sum(map(len,collected.values()))<=16777216\n pending=root/'candidate-selected';pending.mkdir()\n for n,b in collected.items():path=pending/n;path.parent.mkdir(exist_ok=True);path.write_bytes(b)\n selected.rmdir();pending.rename(selected)\nexcept BaseException:\n # Timeout/unreaped/uncertain or untrusted output never carries a child prefix.\n # No process discovery/killall or descendant-quiescence claim is made.\n passed=False;retirementUncertain=retirementUncertain or not driverReaped and gate=='driver' or gate=='collect'\n selected.mkdir(exist_ok=True);assert not any(selected.iterdir())\n for n,obj in {'result.json':failure(),'source-identities.json':MANIFEST,'commands.json':[],'metadata.json':{},'frames.json':{}}.items():save(n,obj)\nprint(json.dumps(dict(status='passed'if passed else'failed',context=CONTEXT,driverReaped=driverReaped,toolDescendantDrainProved=False)))\nraise SystemExit(0 if passed else 1)\n"
