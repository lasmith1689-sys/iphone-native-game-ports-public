        \ 'bytes': 11571}, 'src/CMakeLists.txt': {'sha256': '141450dea053a650fbf2e0a6d22f930eda7fa801563e59004ddb73daa85264ce',\
        \ 'bytes': 9559}, 'src/gl/attributes.h': {'sha256': 'c65c44765d2c00bb1f360f7ce51fcd7c0d2d25edd56e732810bb4421106f1467',\
        \ 'bytes': 5920}, 'src/gl/directstate.c': {'sha256': 'a805b7631f331a2437eeaa358037fc69fe42c9d9450800ecc04aac2944dde613',\
        \ 'bytes': 42219}, 'src/gl/loader.c': {'sha256': '62896167f73fe5fcb38acad339750f6cfbb4a7db2573df34415fb1b43c078bde',\
        \ 'bytes': 5241}, 'src/gl/loader.h': {'sha256': '3a3de23684db3957a3843850e5d3399ee9afb03b92bae6ea433aee74bd42f625',\
        \ 'bytes': 12059}, 'src/gl/init.c': {'sha256': '35804e977fb5bd3e8a7cdae192a95bfb93e89bbb201392f65daaecdd7d165969',\
        \ 'bytes': 24652}, 'include/GL/gl.h': {'sha256': 'd03e03f7874502bcb5125dac530993555d37ebcfcf602354426a812f68160366',\
        \ 'bytes': 84831}, 'include/gl4esinit.h': {'sha256': '3da0beccca54312010e74e1e99814ae64b38e9ccceb782648afcaa83283af6ad',\
        \ 'bytes': 903}}\nfor name,row in sourcehashes.items():\n    data=(source/name).read_bytes();assert len(data)==row['bytes']\
        \ and hashlib.sha256(data).hexdigest()==row['sha256'],name\naliaslines=[line.strip() for p in (source/'src').rglob('*.c')\
        \ for line in p.read_text().splitlines() if 'AliasDecl(' in line]\nexpected=['AliasDecl(void,gl4es_glEnableClientStatei,(GLenum\
