      run: "set -euo pipefail\npython3 - <<'PY'\nimport hashlib,json,os,pathlib,subprocess\nroot=pathlib.Path('.work/cod-gl-v9o-functional').absolute();plan=json.loads((root/'plan.json').read_text())\n\
