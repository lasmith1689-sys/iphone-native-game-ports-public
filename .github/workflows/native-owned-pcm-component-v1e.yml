name: Owned PCM offline component Mac and iPhone SDK proof
'on':
  push:
    branches:
    - codex/native-owned-pcm-component-v1e-20261029
    paths:
    - .github/workflows/native-owned-pcm-component-v1e.yml
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: generic-native-owned-pcm-component-v1e
  cancel-in-progress: false
jobs:
  owned-pcm-component:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-owned-pcm-component-v1e-20261029' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
    - name: Require exact public repository and branch
      id: guard
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json,os,re\nfrom pathlib import Path\nassert os.environ['GITHUB_REPOSITORY']=='lasmith1689-sys/iphone-native-game-ports-public'\nassert os.environ['GITHUB_REF']=='refs/heads/codex/native-owned-pcm-component-v1e-20261029'\nkind=os.environ['GITHUB_EVENT_NAME'];assert kind in ('push','workflow_dispatch')\nassert re.fullmatch('[a-f0-9]{40}',os.environ['GITHUB_SHA'])\nevent=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())\nassert event['repository']['full_name']=='lasmith1689-sys/iphone-native-game-ports-public' and event['repository']['private'] is False\nif kind=='push':\n assert event['ref']=='refs/heads/codex/native-owned-pcm-component-v1e-20261029' and event['after']==os.environ['GITHUB_SHA'] and event.get('deleted',False) is False\nelse:\n assert event.get('inputs') in (None,{})\nprint('Exact public owned-PCM offline proof context accepted.')\nPY\n"
    - name: Stage exact reviewed own sources inline
      id: stage
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,os,zlib\nfrom pathlib import Path\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'ngp-owned-pcm-public-v1e'\npayload={'ngp_audio_v1.h': '',\
        \ 'ngp_audio_internal_v1.h': '', 'ngp_audio_core_v1.c': '',\
        \ 'ngp_audio_backend_v1.m': '',\
        \ 'test_audio_apple_v1.m': ''}\n\
        identities={'ngp_audio_v1.h': {'bytes': 2446, 'sha256': 'cd691f643e3b6350014bd3617f4feb9924fdaae69ed03ea531293138cf2cbe73'}, 'ngp_audio_internal_v1.h': {'bytes': 1197, 'sha256': '156720236bf9316a12d6d71081b422dfd3cf8be6689c5dec0ac7919da17ec1fd'}, 'ngp_audio_core_v1.c': {'bytes': 9351, 'sha256': '8eb7e96d859cd9ded264c573ba0688b5eec57d2d48bdd6f3c7e2cfe8b4f9931e'}, 'ngp_audio_backend_v1.m': {'bytes': 11493, 'sha256': 'e35de25d72d33699f2f4589f8fb71c0e6bb4c3770f37a25e45d722185f4aef1b'}, 'test_audio_apple_v1.m': {'bytes': 16116, 'sha256': 'bd6d4a70e0677c559c22b8fee33d8301a1cc6f49022f9dfa6aca0120877ed144'}}\nprior={}\nassert not base.exists();base.mkdir(mode=0o700)\nsource=base/'source';source.mkdir(mode=0o700)\nassert set(payload)==set(identities) and len(payload)==5\nfor name,wanted in prior.items():\n path=source/name;assert path.is_file() and not path.is_symlink()\n raw=path.read_bytes();assert len(raw)==wanted['bytes'] and hashlib.sha256(raw).hexdigest()==wanted['sha256']\nfor name,encoded\
        \ in payload.items():\n assert '/' not in name and '\\\\' not in name and name not in ('.','..')\n path=source/name;assert not path.exists()\n compressed=base64.b64decode(encoded,validate=True);decoder=zlib.decompressobj();raw=decoder.decompress(compressed,65537)\n assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail and len(raw)<=65536\n wanted=identities[name];assert len(raw)==wanted['bytes'] and hashlib.sha256(raw).hexdigest()==wanted['sha256']\n path.write_bytes(raw)\nall_identities={**prior,**identities}\nassert {p.name for p in source.iterdir()}==set(all_identities)\n(base/'source-manifest.json').write_text(json.dumps(all_identities,sort_keys=True)+'\\n')\nprint(json.dumps({'status':'exact-own-source-chunk-staged','chunkFiles':5,'totalFilesNow':len(all_identities)}))\nPY\n"
    - name: Stage second exact own source chunk
      id: stage2
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,os,zlib\nfrom pathlib import Path\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'ngp-owned-pcm-public-v1e'\npayload={'apple_metadata.py': '',\
        \ 'make_oracle.py': '', 'run_apple.py': '',\
        \ 'test_audio_core_diagnostics_v1.h': '', 'test_audio_core_diagnostics_v1.c': ''}\n\
        identities={'apple_metadata.py': {'bytes': 3382, 'sha256': '056cb25e32463c0e26a4ee5484eac6324570955521e34d65ee3e7b4cb1f9d203'}, 'make_oracle.py': {'bytes': 1078, 'sha256': '8e8a5661208957a766f2609a39378030dfc3762e64b8b865fc49700e6b644192'}, 'run_apple.py': {'bytes': 7908, 'sha256': '4bcca7256535416437e01800323a0a383c3bc379c5de005bc9f447f0eff34ce0'}, 'test_audio_core_diagnostics_v1.h': {'bytes': 558, 'sha256': 'f5ad014f06a34b11e05a202041d28fc7bf298fe4058a49a263777e9ee0b06262'}, 'test_audio_core_diagnostics_v1.c': {'bytes': 1164, 'sha256': 'd0783502bda03961d26ecd943f86fda045f7b46b07cc0b196068c5fa0a1bad27'}}\nprior={'ngp_audio_v1.h': {'bytes': 2446, 'sha256': 'cd691f643e3b6350014bd3617f4feb9924fdaae69ed03ea531293138cf2cbe73'}, 'ngp_audio_internal_v1.h': {'bytes': 1197, 'sha256': '156720236bf9316a12d6d71081b422dfd3cf8be6689c5dec0ac7919da17ec1fd'}, 'ngp_audio_core_v1.c': {'bytes': 9351, 'sha256': '8eb7e96d859cd9ded264c573ba0688b5eec57d2d48bdd6f3c7e2cfe8b4f9931e'}, 'ngp_audio_backend_v1.m':\
        \ {'bytes': 11493, 'sha256': 'e35de25d72d33699f2f4589f8fb71c0e6bb4c3770f37a25e45d722185f4aef1b'}, 'test_audio_apple_v1.m': {'bytes': 16116, 'sha256': 'bd6d4a70e0677c559c22b8fee33d8301a1cc6f49022f9dfa6aca0120877ed144'}}\nassert base.is_dir() and not base.is_symlink()\nsource=base/'source';assert source.is_dir() and not source.is_symlink()\nassert {p.name for p in source.iterdir()}==set(prior)\nassert set(payload)==set(identities) and len(payload)==5\nfor name,wanted in prior.items():\n path=source/name;assert path.is_file() and not path.is_symlink()\n raw=path.read_bytes();assert len(raw)==wanted['bytes'] and hashlib.sha256(raw).hexdigest()==wanted['sha256']\nfor name,encoded in payload.items():\n assert '/' not in name and '\\\\' not in name and name not in ('.','..')\n path=source/name;assert not path.exists()\n compressed=base64.b64decode(encoded,validate=True);decoder=zlib.decompressobj();raw=decoder.decompress(compressed,65537)\n assert decoder.eof and not decoder.unused_data\
        \ and not decoder.unconsumed_tail and len(raw)<=65536\n wanted=identities[name];assert len(raw)==wanted['bytes'] and hashlib.sha256(raw).hexdigest()==wanted['sha256']\n path.write_bytes(raw)\nall_identities={**prior,**identities}\nassert {p.name for p in source.iterdir()}==set(all_identities)\n(base/'source-manifest.json').write_text(json.dumps(all_identities,sort_keys=True)+'\\n')\nprint(json.dumps({'status':'exact-own-source-chunk-staged','chunkFiles':5,'totalFilesNow':len(all_identities)}))\nPY\n"
    - name: Run exact own Mac and unsigned iPhone component proof
      id: proof
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport hashlib,json,os,signal,subprocess,sys\nfrom pathlib import Path\nbase=Path(os.environ['RUNNER_TEMP']).resolve()/'ngp-owned-pcm-public-v1e'\nsource=base/'source';output=base/'build';reports=base/'reports';reports.mkdir(mode=0o700)\nidentities={'ngp_audio_v1.h': {'bytes': 2446, 'sha256': 'cd691f643e3b6350014bd3617f4feb9924fdaae69ed03ea531293138cf2cbe73'}, 'ngp_audio_internal_v1.h': {'bytes': 1197, 'sha256': '156720236bf9316a12d6d71081b422dfd3cf8be6689c5dec0ac7919da17ec1fd'}, 'ngp_audio_core_v1.c': {'bytes': 9351, 'sha256': '8eb7e96d859cd9ded264c573ba0688b5eec57d2d48bdd6f3c7e2cfe8b4f9931e'}, 'ngp_audio_backend_v1.m': {'bytes': 11493, 'sha256': 'e35de25d72d33699f2f4589f8fb71c0e6bb4c3770f37a25e45d722185f4aef1b'}, 'test_audio_apple_v1.m': {'bytes': 16116, 'sha256': 'bd6d4a70e0677c559c22b8fee33d8301a1cc6f49022f9dfa6aca0120877ed144'}, 'apple_metadata.py': {'bytes': 3382, 'sha256': '056cb25e32463c0e26a4ee5484eac6324570955521e34d65ee3e7b4cb1f9d203'},\
        \ 'make_oracle.py': {'bytes': 1078, 'sha256': '8e8a5661208957a766f2609a39378030dfc3762e64b8b865fc49700e6b644192'}, 'run_apple.py': {'bytes': 7908, 'sha256': '4bcca7256535416437e01800323a0a383c3bc379c5de005bc9f447f0eff34ce0'}, 'test_audio_core_diagnostics_v1.h': {'bytes': 558, 'sha256': 'f5ad014f06a34b11e05a202041d28fc7bf298fe4058a49a263777e9ee0b06262'}, 'test_audio_core_diagnostics_v1.c': {'bytes': 1164, 'sha256': 'd0783502bda03961d26ecd943f86fda045f7b46b07cc0b196068c5fa0a1bad27'}}\nassert {p.name for p in source.iterdir()}==set(identities)\nfor name,wanted in identities.items():\n p=source/name;assert p.is_file() and not p.is_symlink()\n raw=p.read_bytes();assert len(raw)==wanted['bytes'] and hashlib.sha256(raw).hexdigest()==wanted['sha256']\nfor name in ('status.json', 'result-summary.json', 'commands-summary.json', 'metadata-summary.json', 'diagnostics.txt'):(reports/name).write_text('' if name.endswith('.txt') else '{}\\n')\nstatus={'status':'started','ownSourceFiles':10,'purpose':'ngp-owned-pcm-offline-v1e','contextId':'d9fc5079-40d0-44d1-8b54-d50c79eb6af7','recoveredEngineExecuted':False,'physicalIPhoneTest':False}\n\
        (reports/'status.json').write_text(json.dumps(status,indent=2)+'\\n')\nclean={'PATH':'/usr/bin:/bin:/usr/sbin:/sbin','HOME':str(base),'TMPDIR':str(base)+'/', 'LANG':'C','LC_ALL':'C','PYTHONDONTWRITEBYTECODE':'1'}\nexit_code=1;timed_out=False;failure=''\ntry:\n with (base/'driver.stdout').open('wb') as stdout,(base/'driver.stderr').open('wb') as stderr:\n  child=subprocess.Popen([sys.executable,'-B',str(source/'run_apple.py'),'--output',str(output)],env=clean,stdout=stdout,stderr=stderr,start_new_session=True)\n  try:exit_code=child.wait(timeout=900)\n  except subprocess.TimeoutExpired:\n   timed_out=True;failure='owned-proof-process-group-timeout';os.killpg(child.pid,signal.SIGTERM)\n   try:child.wait(timeout=3)\n   except subprocess.TimeoutExpired:os.killpg(child.pid,signal.SIGKILL);child.wait(timeout=3)\nexcept Exception as exc:failure=type(exc).__name__+': '+str(exc)[:512]\ndef completed_mac_observations(output,commands):\n \"\"\"Selected completed child receipts only. Never upgrades\
        \ an overall proof result.\"\"\"\n observed={};rejected=[];by_label={r['label']:r['exitCode'] for r in commands}\n for label in ('mac-actual-1','mac-actual-2','mac-actual-timeouts','mac-actual-exceptions'):\n  path=output/(label+'.stdout')\n  if not path.exists():continue\n  try:\n   assert path.is_file() and not path.is_symlink() and path.stat().st_size<=16384\n   assert len(by_label)==len(commands) and type(by_label.get(label)) is int and by_label[label]==0\n   raw=path.read_bytes();row=json.loads(raw);assert isinstance(row,dict) and row.get('status')=='passed'\n   if label in ('mac-actual-1','mac-actual-2'):\n    channels=1 if label.endswith('-1') else 2\n    assert row['scope']=='actual-native-Mac-AVAudioEngine-offline' and row['channels']==channels\n    assert row['inputFrames']==1024 and row['renderedFrames']==8192 and type(row['measuredLeadingFrames']) is int and 0<=row['measuredLeadingFrames']<=4096\n    assert all(row[n] is True for n in ('allInputSamplesCompared','ownerReleaseObserved','actualQueuedCancellationObserved','deviceUnsupportedTokenZero'))\
        \ and row['hardwarePlaybackClaimed'] is False\n    selected={n:row[n] for n in ('channels','inputFrames','renderedFrames','measuredLeadingFrames','allInputSamplesCompared','ownerReleaseObserved','actualQueuedCancellationObserved','deviceUnsupportedTokenZero','hardwarePlaybackClaimed')}\n   elif label=='mac-actual-timeouts':\n    assert row=={'status':'passed','actualFrameworkRequestsWithInjectedControlDelay':3,'borrowedInputAndOutputFreedAfterTimeout':True,'retainedBeforeLateClose':True};selected=dict(row)\n   else:\n    assert row=={'status':'passed','actualProducerExceptions':3,'initialFailureNoGraph':True,'lateOwnedWorkRetained':True,'exceptionEscapedC':False};selected=dict(row)\n   observed[label]={'selectedReceipt':selected,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'commandExitCode':0}\n  except (AssertionError,KeyError,ValueError,TypeError,OSError):rejected.append({'label':label,'reason':'receipt-not-admitted'})\n return {'observations':observed,'rejectedReceipts':rejected,'overallProofClaim':False}\n\
        \ndef collect_fixture_diagnostics(output,commands):\n \"\"\"Bounded diagnostic-only numbers/known labels, never accepted content evidence.\"\"\"\n import math\n def number(v):return type(v) in (int,float) and math.isfinite(v)\n def flag(v):return type(v) in (int,bool) and v in (0,1)\n def integer(v,lo,hi):return type(v) is int and lo<=v<=hi\n by_label={r['label']:r['exitCode'] for r in commands};observations={};rejected=[]\n for channel in (1,2):\n  label='mac-actual-'+str(channel);path=output/('actual-'+str(channel)+'.f32le.diagnostics.json')\n  if not path.exists():continue\n  try:\n   assert path.is_file() and not path.is_symlink() and path.stat().st_size<=16384 and len(by_label)==len(commands) and type(by_label.get(label)) is int\n   raw=path.read_bytes();d=json.loads(raw)\n   assert set(d)=={'scope','channels','inputFrames','requestedRenderFrames','stageSnapshots','first16SourceS16','first16OracleFloat32','outputStats','latencyAssertion','latencyAssertionPassed','matchedLeadingFrames','latencySearchMaximum','absoluteTolerance','oracleUnchanged','overallProofClaim','cleanup'}\n\
        \   assert d['scope']=='diagnostic-only-owned-PCM-offline' and d['channels']==channel and d['inputFrames']==1024 and d['requestedRenderFrames']==8192\n   assert d['latencyAssertion']=='latency>=0' and d['latencySearchMaximum']==4096 and d['absoluteTolerance']==0.000001 and d['oracleUnchanged'] is True and d['overallProofClaim'] is False\n   assert flag(d['latencyAssertionPassed']) and integer(d['matchedLeadingFrames'],-1,4096) and bool(d['latencyAssertionPassed'])==(d['matchedLeadingFrames']>=0)\n   assert len(d['first16SourceS16'])==16 and all(integer(v,-32768,32767) for v in d['first16SourceS16'])\n   assert len(d['first16OracleFloat32'])==16 and all(number(v) and -1<=v<=1 for v in d['first16OracleFloat32'])\n   stats=d['outputStats'];total=8192*channel\n   assert set(stats)=={'totalSamples','finiteSamples','nonfiniteSamples','exactNonzeroSamples','aboveThresholdSamples','firstAboveThresholdSample','lastAboveThresholdSample','finitePeakAbs','first16RenderedSamples','first16AtFirstAboveThreshold'}\
        \ and stats['totalSamples']==total\n   assert all(integer(stats[n],0,total) for n in ('finiteSamples','nonfiniteSamples','exactNonzeroSamples','aboveThresholdSamples'))\n   assert stats['finiteSamples']+stats['nonfiniteSamples']==total and stats['aboveThresholdSamples']<=stats['exactNonzeroSamples']<=stats['finiteSamples']\n   assert number(stats['finitePeakAbs']) and 0<=stats['finitePeakAbs']<=3.5e38\n   first,last=stats['firstAboveThresholdSample'],stats['lastAboveThresholdSample'];assert integer(first,-1,total-1) and integer(last,-1,total-1)\n   assert (stats['aboveThresholdSamples']==0 and first==last==-1) or (stats['aboveThresholdSamples']>0 and 0<=first<=last)\n   assert len(stats['first16RenderedSamples'])==16 and len(stats['first16AtFirstAboveThreshold'])<=16\n   assert all(v is None or number(v) for n in ('first16RenderedSamples','first16AtFirstAboveThreshold') for v in stats[n])\n   stages=d['stageSnapshots'];assert isinstance(stages,list) and 4<=len(stages)<=5\n   expected=['after-open','after-submit','after-first-render','after-all-render']+(['after-failure-cleanup']\
        \ if len(stages)==5 else [])\n   assert [s['stage'] for s in stages]==expected\n   for stage in stages:\n    assert set(stage)=={'stage','core','framework'};core=stage['core'];assert core.get('available') is True\n    assert set(core)=={'available','ticketFound','slot','callbackBits','mailboxOwners','ticketState','tokenMatches','generationMatches','quiescing','closed','ownedPayloadBytes','successfulManualFrames'}\n    assert all(integer(core[n],0,0xffffffff) for n in set(core)-{'available','successfulManualFrames'}) and integer(core['successfulManualFrames'],0,0xffffffffffffffff)\n    assert core['callbackBits']<=3 and core['slot']<16\n    f=stage['framework'];status=f.get('probeStatus')\n    if status=='observed-on-control':\n     assert set(f)=={'probeStatus','enginePresent','engineRunning','playerPresent','playerPlaying','manualRenderingSampleTime','manualFormatPresent','sampleRate','channels','commonFormat','interleaved','playerVolume','playerPan','mixerOutputVolume'}\n     assert\
        \ all(flag(f[n]) for n in ('enginePresent','engineRunning','playerPresent','playerPlaying','manualFormatPresent'))\n     assert f['manualRenderingSampleTime'] is None or integer(f['manualRenderingSampleTime'],-0x8000000000000000,0x7fffffffffffffff)\n     assert f['sampleRate'] is None or (number(f['sampleRate']) and 0<=f['sampleRate']<=1000000)\n     assert all(f[n] is None or integer(f[n],0,65535) for n in ('channels','commonFormat')) and (f['interleaved'] is None or flag(f['interleaved']))\n     for name in ('playerVolume','playerPan','mixerOutputVolume'):\n      v=f[name];assert set(v)=={'finite','value'} and flag(v['finite']) and ((bool(v['finite']) and number(v['value'])) or (not v['finite'] and v['value'] is None))\n    else:\n     assert set(f)=={'probeStatus'} and status in ('no-backend','no-control-queue','allocation-failed','bounded-probe-timeout','no-result','exception-no-description-exported','producer-probe-exception')\n   cleanup=d['cleanup'];assert isinstance(cleanup,dict)\
        \ and type(cleanup.get('attempted')) is bool\n   if cleanup['attempted']:\n    assert set(cleanup)=={'attempted','closeStatus','closeAttempts','closed','retainedTickets','ownedPayloadBytes','pollStatus','ticketState','rendered','canceled','ownerReleased','destroyStatus','serviceRetained'}\n    assert all(integer(cleanup[n],0,0xffffffff) for n in set(cleanup)-{'attempted','serviceRetained'}) and flag(cleanup['serviceRetained'])\n   else:assert set(cleanup)=={'attempted'}\n   observations[label]={'diagnosticOnly':True,'commandExitCode':by_label[label],'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'observed':d}\n  except (AssertionError,KeyError,ValueError,TypeError,OSError):rejected.append({'label':label,'reason':'bounded-diagnostic-not-admitted'})\n return {'observations':observations,'rejectedDiagnostics':rejected,'overallProofClaim':False}\n\ncompleted={'observations':{},'rejectedReceipts':[],'overallProofClaim':False}\ncommands=[];result={};frames={};completed=[];fixture_diagnostics=[]\n\
        try:\n commands=[]\n if (output/'commands.json').is_file():\n  path=output/'commands.json';assert not path.is_symlink() and path.stat().st_size<=262144\n  raw=json.loads(path.read_bytes());assert isinstance(raw,list) and len(raw)<=64\n  for row in raw:\n   assert isinstance(row['label'],str) and len(row['label'])<=100 and isinstance(row['exitCode'],int)\n   commands.append({'label':row['label'],'exitCode':row['exitCode']})\n (reports/'commands-summary.json').write_text(json.dumps(commands,indent=2)+'\\n')\n completed=completed_mac_observations(output,commands)\n fixture_diagnostics=collect_fixture_diagnostics(output,commands)\n result={};frames={};result_path=output/'result.json'\n if exit_code==0 and not timed_out and not failure:\n  assert result_path.is_file() and not result_path.is_symlink() and result_path.stat().st_size<=262144\n  full=json.loads(result_path.read_bytes())\n  assert full['status']=='passed' and full['scope']=='owned-PCM-actual-native-Mac-offline-and-unsigned-iPhone-SDK'\n\
        \  assert full['sourceHashes']=={name:row['sha256'] for name,row in identities.items()}\n  assert full['physicalIPhoneExecuted'] is False and full['deviceReady'] is False and full['legacyBound'] is False and full['keysUsed'] is False and full['SDKExported'] is False\n  assert {r['channels'] for r in full['actualMac']}=={1,2} and len(full['actualMac'])==2\n  actual=[]\n  for row in full['actualMac']:\n   assert row['status']=='passed' and row['scope']=='actual-native-Mac-AVAudioEngine-offline'\n   assert row['inputFrames']==1024 and row['renderedFrames']==8192 and 0<=row['measuredLeadingFrames']<=4096\n   assert all(row[n] is True for n in ('allInputSamplesCompared','ownerReleaseObserved','actualQueuedCancellationObserved','deviceUnsupportedTokenZero')) and row['hardwarePlaybackClaimed'] is False\n   actual.append({n:row[n] for n in ('channels','inputFrames','renderedFrames','measuredLeadingFrames','allInputSamplesCompared','ownerReleaseObserved','actualQueuedCancellationObserved','deviceUnsupportedTokenZero','hardwarePlaybackClaimed')})\n\
        \  assert full['actualFrameworkTimeouts']=={'status':'passed','actualFrameworkRequestsWithInjectedControlDelay':3,'borrowedInputAndOutputFreedAfterTimeout':True,'retainedBeforeLateClose':True}\n  assert full['actualProducerExceptions']=={'status':'passed','actualProducerExceptions':3,'initialFailureNoGraph':True,'lateOwnedWorkRetained':True,'exceptionEscapedC':False}\n  for label,platform,kind in [('mac',1,2),('ios',2,6)]:\n   meta=full['metadata'][label];assert meta['cpu']=='ARM64' and meta['platform']==platform and meta['kind']==kind\n   assert len(meta['strongFileBackedAPIs'])==7\n   frames[label]={n:meta[n] for n in ('cpu','kind','platform','buildVersion','dependencies','codeSignatures','strongFileBackedAPIs','unsignedIPhoneLibrary')}\n  assert frames['ios']['unsignedIPhoneLibrary'] is True and frames['ios']['codeSignatures']==0\n  result={'status':'actual-owned-PCM-offline-Mac-and-unsigned-iPhone-SDK-passed','actualMac':actual,'actualFrameworkTimeouts':full['actualFrameworkTimeouts'],'actualProducerExceptions':full['actualProducerExceptions'],'sourceHashes':full['sourceHashes'],'versions':full['versions'],'compilerSha256':full['compilerSha256'],'deviceReady':False,'legacyBound':False,'physicalIPhoneExecuted':False,'SDKExported':False}\n\
        \ else:result={'status':'proof-not-passed','recoveredEngineExecuted':False,'physicalIPhoneTest':False}\n result['completedMacObservations']=completed\n result['fixtureDiagnostics']=fixture_diagnostics\n (reports/'result-summary.json').write_text(json.dumps(result,indent=2)+'\\n')\n (reports/'metadata-summary.json').write_text(json.dumps(frames,indent=2)+'\\n')\nexcept Exception as exc:\n failure='report-collection-'+type(exc).__name__+': '+str(exc)[:512];exit_code=1\n result={'status':'proof-not-passed','recoveredEngineExecuted':False,'physicalIPhoneTest':False,'completedMacObservations':completed,'fixtureDiagnostics':fixture_diagnostics}\n (reports/'commands-summary.json').write_text(json.dumps(commands,indent=2)+'\\n')\n (reports/'result-summary.json').write_text(json.dumps(result,indent=2)+'\\n')\n (reports/'metadata-summary.json').write_text(json.dumps(frames,indent=2)+'\\n')\ndiagnostics=[]\nselected=[base/'driver.stderr']+sorted(output.glob('*.stderr'))\nremaining=49152\nfor\
        \ path in selected:\n if path.is_file() and not path.is_symlink() and path.stat().st_size:\n  count=min(4096,remaining,path.stat().st_size)\n  with path.open('rb') as handle:handle.seek(-count,2);raw=handle.read(count)\n  diagnostics.append('=== '+path.name+' (bounded tail) ===\\n'+raw.decode('utf-8',errors='replace'));remaining-=len(raw)\n  if remaining<=0:break\n(reports/'diagnostics.txt').write_text('\\n'.join(diagnostics))\nstatus.update(status='passed' if exit_code==0 and not timed_out and not failure else 'failed',recipeExitCode=exit_code,timedOut=timed_out,failure=failure,actualMacAndSDKProofPassed=exit_code==0 and not timed_out and not failure)\n(reports/'status.json').write_text(json.dumps(status,indent=2)+'\\n')\nassert {p.name for p in reports.iterdir()}==set(('status.json', 'result-summary.json', 'commands-summary.json', 'metadata-summary.json', 'diagnostics.txt'))\nassert all(p.is_file() and not p.is_symlink() and p.stat().st_size<=196608 for p in reports.iterdir())\n\
        assert sum(p.stat().st_size for p in reports.iterdir())<=393216\nprint(json.dumps(status))\nraise SystemExit(0 if status['status']=='passed' else 1)\nPY\n"
    - name: Upload only bounded selected reports
      id: upload
      if: always() && steps.guard.outcome == 'success' && steps.stage.outcome == 'success' && steps.stage2.outcome == 'success' && steps.proof.outcome != 'skipped'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: owned-pcm-component-v1e-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/ngp-owned-pcm-public-v1e/reports/status.json

          ${{ runner.temp }}/ngp-owned-pcm-public-v1e/reports/result-summary.json

          ${{ runner.temp }}/ngp-owned-pcm-public-v1e/reports/commands-summary.json

          ${{ runner.temp }}/ngp-owned-pcm-public-v1e/reports/metadata-summary.json

          ${{ runner.temp }}/ngp-owned-pcm-public-v1e/reports/diagnostics.txt'
        if-no-files-found: error
        retention-days: 1
        compression-level: 6
        include-hidden-files: false
        archive: true
    - name: Require actual proof and report upload success
      id: final
      if: always()
      shell: bash
      run: 'set -euo pipefail

        test ''${{ steps.proof.outcome }}'' = ''success''

        test ''${{ steps.upload.outcome }}'' = ''success''

        '
