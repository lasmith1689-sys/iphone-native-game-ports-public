name: Own decoded MP3 to actual STREAM Mac fixture
'on':
  push:
    branches:
    - codex/native-mp3-stream-mac-v1-20261101
    paths:
    - .github/workflows/native-mp3-stream-mac-v1.yml
permissions:
  contents: read
concurrency:
  group: native-mp3-stream-mac-v1
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'lasmith1689-sys/iphone-native-game-ports-public' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-mp3-stream-mac-v1-20261101' && github.event_name == 'push'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 1
        submodules: false
        lfs: false
        sparse-checkout: native/platform/native-audio/mp3-stream-mac-fixture-v1
    - name: Verify exact own source and fixture closure
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_REPOSITORY\" = 'lasmith1689-sys/iphone-native-game-ports-public'\ntest \"$GITHUB_REF\" = 'refs/heads/codex/native-mp3-stream-mac-v1-20261101'\ntest \"$GITHUB_EVENT_NAME\" = 'push'\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\npython3 - <<'PY'\nimport pathlib,hashlib,json\np=pathlib.Path('native/platform/native-audio/mp3-stream-mac-fixture-v1')\nb=(p/'source-manifest.json').read_bytes();assert hashlib.sha256(b).hexdigest()=='24effbebf88c011518dcf6e511c3be66edc1f8abe9f5265cacad09ed3de4de75'\nfor n,w in json.loads(b)['files'].items():\n b=(p/n).read_bytes();assert len(b)==w['bytes'] and hashlib.sha256(b).hexdigest()==w['sha256']\nPY\n"
    - name: Run genuine Mac-only direct composition fixture
      shell: bash
      run: 'set -euo pipefail

        python3 -B native/platform/native-audio/mp3-stream-mac-fixture-v1/run_probe.py

        '
    - name: Retain bounded own diagnostic
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: mp3-stream-mac-${{ github.run_id }}
        path: native/platform/native-audio/mp3-stream-mac-fixture-v1/probe-output/
        if-no-files-found: error
        retention-days: 7
        compression-level: 6
        include-hidden-files: false
        archive: true
